": "光陰似箭", "explanation": "「光陰似箭」：時間過得像射出的箭一樣快。\n完整句子：光陰似箭，一年又過去了。"}, {"id": "zh-u5-09-q3", "unit": "u5", "word": "光陰似箭", "type": "運用", "prompt": "哪一句正確運用了「光陰似箭」？", "options": ["等巴士等了很久，真是光陰似箭。", "他射箭很準，真是光陰似箭。", "光陰似箭，小時候的事彷彿就在昨天。", "這支箭光陰似箭地射中了目標。"], "answer": "光陰似箭，小時候的事彷彿就在昨天。", "explanation": "「光陰似箭」：時間過得像射出的箭一樣快。"}, {"id": "zh-u5-10-q1", "unit": "u5", "word": "狂奔", "type": "詞義", "prompt": "「狂奔」是甚麼意思？", "options": ["慢慢地走", "在地上爬", "瘋狂地大叫", "非常快速地奔跑"], "answer": "非常快速地奔跑", "explanation": "「狂奔」：非常快速地奔跑。"}, {"id": "zh-u5-10-q2", "unit": "u5", "word": "狂奔", "type": "填充", "prompt": "選出最適合填入橫線的詞語：\n快要遲到了，他背着書包向學校____。", "options": ["範本", "憂傷", "意味", "狂奔"], "answer": "狂奔", "explanation": "「狂奔」：非常快速地奔跑。\n完整句子：快要遲到了，他背着書包向學校狂奔。"}, {"id": "zh-u5-10-q3", "unit": "u5", "word": "狂奔", "type": "近義詞", "prompt": "「狂奔」的近義詞是：", "options": ["漫步", "散步", "慢走", "飛奔"], "answer": "飛奔", "explanation": "「狂奔」：非常快速地奔跑。"}]}</script>
<script>
const D=JSON.parse(document.getElementById('zh-data').textContent),Q=D.questions;
function detectTest(){
 let on=false;
 try{
  const q=new URLSearchParams(location.search).get('test');
  if(q==='1'){localStorage.setItem('p6quizTest','1');on=true}
  else if(q==='0'){localStorage.removeItem('p6quizTest');on=false}
  else on=localStorage.getItem('p6quizTest')==='1';
 }catch(e){on=false}
 return on;
}
const TEST=detectTest(),P=TEST?'zh_test_':'zh_';
if(TEST)document.getElementById('test').style.display='block';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(P+k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}};
const SYNC_URL='https://script.google.com/macros/s/AKfycbyatheq18si3u1yzWxpYZURWXaYfmmXLUIAbb8EHS1SmSqy-JBIunVIIwPBxNO_HGVx/exec';
const SYNC_KEY='p6quiz-7Kq2';
const OUT=TEST?'p6quiz4testout':'p6quiz4out';
let outbox=[];
let syncing=false;
function isoHK(t){
 const d=new Date((t||Date.now())+8*3600000), p=n=>String(n).padStart(2,'0');
 return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+'T'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+'+08:00';
}
function loadOut(){
 try{const a=JSON.parse(localStorage.getItem(OUT)); outbox=Array.isArray(a)?a.filter(x=>x&&x.row&&!x.sent):[]}catch(e){outbox=[]}
}
function saveOut(){try{localStorage.setItem(OUT,JSON.stringify(outbox.slice(-400)))}catch(e){}}
function logAttempt(row){
 if(!row||typeof row!=='object')return;
 const sec=Number(row.time_sec);
 const queued={
  timestamp:isoHK(Date.now()),
  session_id:row.session_id||'none',
  mode:row.mode||'practice',
  question_id:row.question_id,
  category:row.category,
  difficulty:row.difficulty||'medium',
  correct:!!row.correct,
  hint_used:!!row.hint_used,
  time_sec:isFinite(sec)?Math.round(Math.max(0,sec)*10)/10:0,
  answer_given:String(row.answer_given==null?'':row.answer_given).slice(0,180),
  user:TEST?'test':'ansbie'
 };
 outbox.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), row:queued, sent:false});
 if(outbox.length>400)outbox=outbox.slice(-400);
 saveOut();
 flushOut();
}
function flushOut(){
 if(syncing)return;
 const pending=outbox.filter(x=>x&&!x.sent&&x.row);
 if(!pending.length)return;
 if(navigator.onLine===false)return;
 const batch=pending.slice(0,40);
 syncing=true;
 let failed=false;
 fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:SYNC_KEY,rows:batch.map(x=>x.row)})})
  .then(()=>{
   const ids={}; batch.forEach(x=>{ids[x.id]=1});
   outbox=outbox.filter(x=>!ids[x.id]);
   saveOut();
  })
  .catch(()=>{failed=true})
  .then(()=>{
   syncing=false;
   if(!failed&&outbox.some(x=>x&&!x.sent))flushOut();
  });
}
loadOut();
window.addEventListener('online',()=>flushOut());
flushOut();
const app=document.getElementById('app');let S=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){const pr=ld('progress',{}),miss=ld('missed',[]);let h='<h1>Hi Ansbie! 👋</h1><p>今日溫習中文重點詞，加油！💪</p>';
for(const u in D.units){const n=Q.filter(q=>q.unit===u).length,p=pr[u]||{done:[],best:0},pct=Math.round(p.done.length/n*100);
h+=`<div class="card"><div class="row"><h2>📘 ${D.units[u].label} ${D.units[u].name}</h2><small>${D.units[u].words.length}個詞</small></div><div class="bar"><i style="width:${pct}%"></i></div><small>已答對 ${p.done.length}/${n} 題　最佳 ${p.best}%</small><button class="big" onclick="start('${u}')">🚀 開始練習</button></div>`}
h+=`<button class="big" onclick="start('all')">🌈 全部單元</button><button class="sec" onclick="start('review')">🔁 錯題重溫（${miss.length}題）</button><button class="sec" onclick="words()">📖 詞語表</button>`;app.innerHTML=h;scrollTo(0,0)}
function start(m){let list=m==='all'?Q:m==='review'?Q.filter(q=>ld('missed',[]).includes(q.id)):Q.filter(q=>q.unit===m);
if(!list.length){alert('暫時沒有錯題，做得好！🎉');return}
S={mode:m,list:shuffle(list),i:0,score:0,sid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t0:0};show()}
function show(){const q=S.list[S.i];S.t0=Date.now();S.opts=shuffle(q.options);
app.innerHTML=`<div class="row"><span class="tag">${q.type}</span><small>第 ${S.i+1}/${S.list.length} 題　⭐ ${S.score}</small></div><div class="bar" style="margin:8px 0"><i style="width:${S.i/S.list.length*100}%"></i></div><div class="card"><div class="prompt">${esc(q.prompt)}</div></div>`+
S.opts.map((o,k)=>`<button class="opt" onclick="pick(${k})">${'ABCD'[k]}. ${esc(o)}</button>`).join('')+'<div id="fb"></div><button class="sec" onclick="home()">🏠 離開</button>';scrollTo(0,0)}
function pick(k){const q=S.list[S.i],g=S.opts[k],ok=g===q.answer,bs=app.querySelectorAll('.opt');
bs.forEach((b,j)=>{b.disabled=true;if(S.opts[j]===q.answer)b.classList.add('ok');else if(j===k)b.classList.add('no')});
let miss=ld('missed',[]),pr=ld('progress',{});pr[q.unit]=pr[q.unit]||{done:[],best:0};
if(ok){S.score++;miss=miss.filter(x=>x!==q.id);if(!pr[q.unit].done.includes(q.id))pr[q.unit].done.push(q.id)}else if(!miss.includes(q.id))miss.push(q.id);
sv('missed',miss);sv('progress',pr);
logAttempt({timestamp:new Date().toISOString(),session_id:S.sid,mode:S.mode,question_id:q.id,category:'zh-'+q.unit,difficulty:q.type,correct:ok,hint_used:false,time_sec:Math.round((Date.now()-S.t0)/1000),answer_given:g,user:'Ansbie'});
document.getElementById('fb').innerHTML=`<div class="card"><b style="font-size:20px">${ok?'✅ 答對了！好叻！':'❌ 答錯了，正確答案是：'+esc(q.answer)}</b><div class="exp">💡 ${esc(q.explanation)}</div><button class="big" onclick="next()">${S.i+1<S.list.length?'下一題 ➡️':'看成績 🏆'}</button></div>`;
document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(++S.i<S.list.length)return show();const pct=Math.round(S.score/S.list.length*100);
if(D.units[S.mode]){const pr=ld('progress',{});pr[S.mode]=pr[S.mode]||{done:[],best:0};pr[S.mode].best=Math.max(pr[S.mode].best,pct);sv('progress',pr)}
const h=ld('history',[]);h.push({t:Date.now(),mode:S.mode,score:S.score,total:S.list.length});sv('history',h.slice(-50));
app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:60px">${pct>=90?'🏆':pct>=70?'🌟':'💪'}</div><h1>${S.score} / ${S.list.length}</h1><p>${pct>=90?'太厲害了，Ansbie！':pct>=70?'做得好！繼續努力！':'不要緊，再試一次！'}</p></div><button class="big" onclick="start('${S.mode}')">🔄 再做一次</button><button class="sec" onclick="start('review')">🔁 錯題重溫</button><button class="sec" onclick="home()">🏠 返回</button>`}
function words(){let h='<h1>📖 詞語表</h1>';for(const u in D.units)h+=`<div class="card"><h2>${D.units[u].label} ${D.units[u].name}</h2><table>${D.units[u].words.map(w=>`<tr><td>${w.word}</td><td>${w.meaning}</td></tr>`).join('')}</table></div>`;
app.innerHTML=h+'<button class="sec" onclick="home()">🏠 返回</button>';scrollTo(0,0)}
home();
</script></body></html>
