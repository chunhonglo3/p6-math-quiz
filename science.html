<\/g><circle cx=\"282\" cy=\"36\" r=\"12\" fill=\"#fff\" stroke=\"#7048e8\" stroke-width=\"2\"/><text x=\"282\" y=\"41\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#5f3dc4\" text-anchor=\"middle\">A<\/text><circle cx=\"314\" cy=\"120\" r=\"12\" fill=\"#fff\" stroke=\"#7048e8\" stroke-width=\"2\"/><text x=\"314\" y=\"125\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#5f3dc4\" text-anchor=\"middle\">B<\/text><circle cx=\"332\" cy=\"236\" r=\"12\" fill=\"#fff\" stroke=\"#7048e8\" stroke-width=\"2\"/><text x=\"332\" y=\"241\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#5f3dc4\" text-anchor=\"middle\">C<\/text><text x=\"20\" y=\"252\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#7f5539\" text-anchor=\"start\">soil<\/text><\/svg>","q":"Label the parts of the cactus: A, B and C.","items":["A: ____","B: ____","C: ____"],"answer":["leaves","stem","roots"],"accepts":[["leaf","needle","needles","spine","spines","needle-shaped leaves"],["thick stem"],["root","shallow roots"]],"hints":["The 'needles' of a cactus are its leaves.","The big green body stores water."],"explain":"A leaves (needle-shaped), B stem (thick, stores water), C roots (shallow, spread widely).","diff":"medium","accept":[],"cat":"C2"},{"id":"C2d-09","sub":"C2d","type":"short","diff":"hard","q":"Explain how a cactus is adapted to the desert. Give TWO features.","answer":"Cacti have thick stems to store water and needle-shaped leaves to reduce water loss. Some have shallow roots spreading widely to absorb water quickly.","groups":[["thick stem","store water","stores water"],["needle","reduce water loss","less water loss"],["shallow","root","spread"]],"need":2,"hints":["Stem, leaves, roots."],"explain":"Any two: thick stems store water; needle-shaped leaves reduce water loss; shallow, wide roots absorb water quickly.","accept":[],"fmt":"Short question","cat":"C2"},{"id":"C2d-10","sub":"C2d","type":"short","fmt":"Situation","src":"cactus","diff":"hard","q":"Why did Tom's cactus die? What should he do instead?","answer":"Cacti are adapted to dry deserts and store water in their thick stems. Tom watered it too often, so the roots rotted. He should not water it every day, and he should keep it in the sun.","groups":[["too much water","too often","every day","overwater","too frequent","so much water"],["not water","less water","water less","dry","sun"]],"need":1,"hints":["Where do cacti normally grow?"],"explain":"Too much water made the roots rot; cacti need little water.","accept":[],"cat":"C2"},{"id":"C2d-11","sub":"C2d","type":"mcq","fmt":"Fair test","src":"wax","q":"After one day, which leaf will probably be drier and more wilted?","options":["Leaf A (coated with wax)","Leaf B (not coated)","Both the same","Neither changes"],"answer":1,"hints":["What do waxy leaves do for mangroves?"],"explain":"The wax layer reduces water loss, so the uncoated leaf B loses more water and wilts more – like mangroves' waxy leaves.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2d-12","sub":"C2d","type":"multi","fmt":"Fair test","src":"wax","q":"To make Amy's test fair, which things must be kept the SAME for both leaves? (There can be more than one answer.)","options":["The size of the leaves","The place and time they are left","Whether there is wax on the leaf","The type of plant"],"answer":[0,1,3],"hints":["Only ONE thing should be changed.","The wax is the thing being tested."],"explain":"Keep size, place, time and plant the same; only the wax coating is changed.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2d-13","sub":"C2d","type":"fill","fmt":"Fair test","src":"wax","q":"In Amy's experiment, the only thing she changed is whether the leaf is coated with ____.","answer":"wax","accept":["a layer of wax","waxy layer"],"hints":["Leaf A vs leaf B."],"explain":"The variable changed is the wax coating.","diff":"medium","cat":"C2"},{"id":"C2d-14","sub":"C2d","type":"short","fmt":"Fair test","src":"wax","diff":"hard","q":"What does Amy's result tell us about mangroves?","answer":"The waxy layer reduces water loss, so the waxy leaves of mangroves help reduce water loss in the salty wetland.","groups":[["reduce water loss","less water","lose less","keep water","keeps water"],["mangrove","waxy","wax"]],"need":2,"hints":["Link the wax to water."],"explain":"Waxy leaves reduce water loss.","accept":[],"cat":"C2"},{"id":"C2d-15","sub":"C2d","type":"mcq","fmt":"Diagram","svg":"<svg viewBox=\"0 0 340 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"two leaves experiment\"><rect width=\"340\" height=\"210\" rx=\"12\" fill=\"#fff9db\"/><path d=\"M95 150 Q40 90 95 30 Q150 90 95 150 Z\" fill=\"#69db7c\" stroke=\"#2b8a3e\" stroke-width=\"3\"/><line x1=\"95\" y1=\"40\" x2=\"95\" y2=\"165\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><path d=\"M95 145 Q47 90 95 38 Q143 90 95 145 Z\" fill=\"#fff\" opacity=\".45\"/><path d=\"M245 150 Q190 90 245 30 Q300 90 245 150 Z\" fill=\"#69db7c\" stroke=\"#2b8a3e\" stroke-width=\"3\"/><line x1=\"245\" y1=\"40\" x2=\"245\" y2=\"165\" stroke=\"#2b8a3e\" stroke-width=\"2\"/><text x=\"95\" y=\"195\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Leaf A: coated with wax<\/text><text x=\"245\" y=\"195\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Leaf B: not coated<\/text><\/svg>","q":"Look at the set-up. What is Amy trying to find out?","options":["Whether wax reduces water loss from leaves","Whether leaves need sunlight to grow","Whether leaves can shed rainwater","Whether wax makes leaves bigger"],"answer":0,"hints":["What is different between A and B?"],"explain":"She is testing whether a wax coating reduces water loss.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2e-01","sub":"C2e","type":"match","q":"Match each plant with how it protects itself.","items":["Oleander","Lithops","Himalayan nettle","Sensitive plant"],"options":["Its stems are full of spikes","It looks like a stone","Its leaves close when touched","It is poisonous","It has buttress roots"],"answer":[3,1,0,2],"hints":["One option is about support, not protection."],"explain":"Oleander – poisonous; lithops – look like stones; nettle – spiky stems; sensitive plant – leaves close.","diff":"medium","accept":[],"fmt":"Matching","cat":"C2"},{"id":"C2e-02","sub":"C2e","type":"mcq","diff":"easy","q":"What happens when you touch the leaves of a sensitive plant?","options":["They close.","They change colour.","They release water.","They grow bigger."],"answer":0,"hints":["Book p.14."],"explain":"The leaves close to protect the plant.","accept":[],"fmt":"MCQ","cat":"C2"},{"id":"C2e-03","sub":"C2e","type":"tf","q":"Lithops protect themselves by looking like stones.","answer":true,"hints":["It is hard for animals to spot them."],"explain":"True.","diff":"easy","accept":[],"fmt":"True or false","cat":"C2"},{"id":"C2e-04","sub":"C2e","type":"fill","q":"Oleanders protect themselves because they are ____.","answer":"poisonous","accept":["toxic"],"hints":["Do not eat them!"],"explain":"Oleanders are poisonous.","diff":"easy","fmt":"Fill in the blank","cat":"C2"},{"id":"C2e-05","sub":"C2e","type":"fix","q":"Judge and correct: “The leaves of Himalayan nettles are full of spikes.” What should 'leaves' be changed to?","answer":"stems","hints":["Book p.14: the ____ are full of spikes."],"explain":"The STEMS of Himalayan nettles are full of spikes.","diff":"medium","accept":[],"fmt":"Judge & correct","cat":"C2"},{"id":"C2e-06","sub":"C2e","type":"short","q":"Name one plant and how it protects itself from animals.","answer":"E.g. oleander – poisonous; lithops – look like stones; Himalayan nettle – stems full of spikes; sensitive plant – leaves close when touched.","groups":[["oleander","lithop","nettle","sensitive"],["poison","stone","spike","close"]],"need":2,"hints":["Four plants on p.14."],"explain":"Any one plant with its way of protection.","diff":"medium","accept":[],"fmt":"Short question","cat":"C2"},{"id":"C2e-07","sub":"C2e","type":"mcq","q":"More to Explore: where in Hong Kong can you see desert plants and tropical plants?","options":["Forsgate Conservatory, Hong Kong Park","Victoria Harbour","Lion Rock","Star Ferry Pier"],"answer":0,"hints":["A glasshouse in a park."],"explain":"The Forsgate Conservatory in Hong Kong Park.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C2"},{"id":"C3a-01","sub":"C3a","type":"classify","fmt":"Matching","q":"Workbook style: where does each animal live?","items":["🦓 Zebra","🐻‍❄️ Polar bear","🐯 Tiger","🐫 Camel","🦧 Orangutan","🐧 Penguin"],"options":["Tropical rainforest","Desert","Tropical grassland","Polar region"],"answer":[2,3,0,1,0,3],"hints":["Tigers and orangutans live among trees."],"explain":"Zebra – grassland; polar bear – polar; tiger – rainforest; camel – desert; orangutan – rainforest; penguin – polar.","diff":"hard","accept":[],"cat":"C3"},{"id":"C3a-02","sub":"C3a","type":"multi","q":"Which things affect the survival of animals in an environment? (There can be more than one answer.)","options":["Climate","Water supply","Food supply","The colour of the sky"],"answer":[0,1,2],"hints":["Book p.24 summary: three things."],"explain":"Climate, water supply and food supply.","diff":"medium","accept":[],"fmt":"MCQ (multi)","cat":"C3"},{"id":"C3a-03","sub":"C3a","type":"mcq","q":"Which environment has a GREAT variety of animals?","options":["Desert","Polar region","Tropical rainforest","None of them"],"answer":2,"hints":["Warm, wet and lots of food."],"explain":"Tropical rainforests are hot and wet with plenty of plants, so they have a great variety of animals.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3a-04","sub":"C3a","type":"short","diff":"hard","q":"Why are there fewer kinds of animals in deserts than in tropical rainforests?","answer":"Deserts have low rainfall and very few plants, so there is little water and food. Rainforests are hot and wet with plenty of plants for food.","groups":[["water","rain","dry"],["food","plant"]],"need":2,"hints":["Think about water supply and food supply."],"explain":"Little water and food in deserts; plenty in rainforests.","accept":[],"fmt":"Short question","cat":"C3"},{"id":"C3a-05","sub":"C3a","type":"tf","q":"Different kinds of animals live in different natural environments.","answer":true,"hints":["Book p.17 Note."],"explain":"True.","diff":"easy","accept":[],"fmt":"True or false","cat":"C3"},{"id":"C3a-06","sub":"C3a","type":"fill","q":"Animals' survival depends on climate, water supply and ____ supply in their habitats.","answer":"food","hints":["What do animals eat?"],"explain":"Climate, water supply and food supply.","diff":"easy","accept":[],"fmt":"Fill in the blank","cat":"C3"},{"id":"C3a-07","sub":"C3a","type":"mcq","fmt":"Analysis","q":"Workbook p.6 shows a toucan. Where does it live?","options":["Tropical rainforest","Desert","Polar region","Tropical grassland"],"answer":0,"hints":["It perches on tree branches in a forest."],"explain":"Toucans live in tropical rainforests.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3b-01","sub":"C3b","type":"multi","q":"What characteristics help polar bears live in cold places? (There can be more than one answer.)","options":["Thick fur","A thick layer of fat under the skin","Big ears","Small ears"],"answer":[0,1,3],"hints":["Big ears are for losing heat."],"explain":"Thick fur, a thick layer of fat and small ears help keep polar bears warm.","diff":"medium","accept":[],"fmt":"MCQ (multi)","cat":"C3"},{"id":"C3b-02","sub":"C3b","type":"mcq","q":"How do snakes survive cold winters?","options":["They change their skin.","They go into deep sleep.","They eat a lot.","They grow thick fur."],"answer":1,"hints":["Workbook p.6."],"explain":"Snakes go into deep sleep in winter to save energy.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3b-03","sub":"C3b","type":"mcq","q":"Why do some animals go into deep sleep in winter?","options":["To save energy because there is less food","To grow bigger","To hunt at night","To lose heat"],"answer":0,"hints":["Less food in winter."],"explain":"Deep sleep saves energy when food is scarce.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3b-04","sub":"C3b","type":"mcq","q":"How do snails reduce water loss in the hot and dry environment?","options":["They drink a lot of water.","They stay inactive in their shells and seal the shell mouth with mucus.","They dig deep holes.","They grow thick fur."],"answer":1,"hints":["Book p.19 speech bubble."],"explain":"Snails stay inactive and seal the shell mouth with mucus.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3b-05","sub":"C3b","type":"fill","q":"African tortoises have thick scales and hard shells to reduce water ____ in a hot and dry environment.","answer":"loss","hints":["Book p.19 Note."],"explain":"…to reduce water loss.","diff":"medium","accept":[],"fmt":"Fill in the blank","cat":"C3"},{"id":"C3b-06","sub":"C3b","type":"fill","q":"Polar bears have a thick layer of ____ under their skin to keep them warm.","answer":"fat","hints":["Book p.18."],"explain":"A thick layer of fat keeps them warm.","diff":"easy","accept":[],"fmt":"Fill in the blank","cat":"C3"},{"id":"C3b-07","sub":"C3b","type":"tf","q":"Polar bears have big ears to keep warm.","answer":false,"hints":["Look at the polar bear's ears in the book."],"explain":"False. Polar bears have small ears; it is the desert cottontail that has big ears, to dissipate heat.","diff":"easy","accept":[],"fmt":"True or false","cat":"C3"},{"id":"C3b-08","sub":"C3b","type":"fix","q":"Judge and correct: “Desert cottontails have long fur and big ears to dissipate heat.” What should 'long' be changed to?","answer":"short","hints":["Fur keeps heat in."],"explain":"Desert cottontails have SHORT fur and big ears.","diff":"medium","accept":[],"fmt":"Judge & correct","cat":"C3"},{"id":"C3b-09","sub":"C3b","type":"mcq","q":"Emperor penguins live in a very cold place. Which features do they have?","options":["Short and thick feathers and a thick layer of fat","Big ears and short fur","Needle-shaped leaves","Gills and fins"],"answer":0,"hints":["Book p.18."],"explain":"Short, thick feathers and a thick layer of fat (and webbed feet).","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3b-10","sub":"C3b","type":"bank","fmt":"Word bank","q":"Word bank: complete the sentences. (One word is not used.)","items":["Camels lose less ____ than other animals.","Snakes go into deep sleep in winter to save ____.","Snails seal their shell mouth with ____.","Desert cottontails have big ____ to dissipate heat."],"options":["energy","mucus","ears","water","fat"],"answer":[3,0,1,2],"hints":["'fat' is for polar animals."],"explain":"water, energy, mucus, ears.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3b-11","sub":"C3b","type":"short","q":"Why can camels live in a hot and dry environment?","answer":"Camels lose less water than other animals (they concentrate their urine), so they can survive with little water.","groups":[["less water","lose less","reduce water loss","urine","little water"]],"need":1,"hints":["Book p.19: 'I lose less water than other animals.'"],"explain":"Camels lose less water, e.g. by concentrating their urine.","diff":"medium","accept":[],"fmt":"Short question","cat":"C3"},{"id":"C3b-12","sub":"C3b","type":"short","diff":"hard","q":"The desert cottontail lives in a hot and dry place. How do its ears help it?","answer":"It has big ears (and short fur) to dissipate heat in the hot environment.","groups":[["big ear","large ear","long ear"],["heat","cool"]],"need":2,"hints":["Big ears let heat out."],"explain":"Big ears help dissipate heat in the hot desert.","accept":[],"fmt":"Short question","cat":"C3"},{"id":"C3b-13","sub":"C3b","type":"match","q":"Match the animal with its adaptation.","items":["Polar bear","Snail","Squirrel","Camel"],"options":["Goes into deep sleep in winter","Loses less water than other animals","Thick fur and a thick layer of fat","Stays inactive and seals its shell with mucus"],"answer":[2,3,0,1],"hints":["Book p.18–19."],"explain":"Polar bear – fur and fat; snail – mucus seal; squirrel – deep sleep; camel – loses less water.","diff":"medium","accept":[],"fmt":"Matching","cat":"C3"},{"id":"C3b-14","sub":"C3b","type":"mcq","fmt":"Fair test","src":"fat","svg":"<svg viewBox=\"0 0 360 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ice water experiment\"><rect width=\"360\" height=\"210\" rx=\"12\" fill=\"#f8f9fa\"/><path d=\"M30 90 L330 90 L310 170 L50 170 Z\" fill=\"#d0ebff\" stroke=\"#1c7ed6\" stroke-width=\"3\"/><rect x=\"60\" y=\"110\" width=\"16\" height=\"14\" rx=\"3\" fill=\"#fff\" stroke=\"#74c0fc\" transform=\"rotate(20 60 110)\"/><rect x=\"170\" y=\"120\" width=\"16\" height=\"14\" rx=\"3\" fill=\"#fff\" stroke=\"#74c0fc\" transform=\"rotate(20 170 120)\"/><rect x=\"285\" y=\"108\" width=\"16\" height=\"14\" rx=\"3\" fill=\"#fff\" stroke=\"#74c0fc\" transform=\"rotate(20 285 108)\"/><rect x=\"150\" y=\"150\" width=\"16\" height=\"14\" rx=\"3\" fill=\"#fff\" stroke=\"#74c0fc\" transform=\"rotate(20 150 150)\"/><rect x=\"250\" y=\"150\" width=\"16\" height=\"14\" rx=\"3\" fill=\"#fff\" stroke=\"#74c0fc\" transform=\"rotate(20 250 150)\"/><rect x=\"90\" y=\"55\" width=\"70\" height=\"95\" rx=\"14\" fill=\"#fff3bf\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M104 40 q8 -22 20 -8 q12 -14 22 8 l0 40 l-42 0 z\" fill=\"#ffd8a8\" stroke=\"#a0522d\" stroke-width=\"2\"/><text x=\"125\" y=\"190\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Bag A: lard (fat)<\/text><rect x=\"200\" y=\"55\" width=\"70\" height=\"95\" rx=\"14\" fill=\"#ffffff\" stroke=\"#495057\" stroke-width=\"2\"/><path d=\"M214 40 q8 -22 20 -8 q12 -14 22 8 l0 40 l-42 0 z\" fill=\"#ffd8a8\" stroke=\"#a0522d\" stroke-width=\"2\"/><text x=\"235\" y=\"190\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Bag B: empty<\/text><text x=\"180\" y=\"22\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#1c7ed6\" text-anchor=\"middle\">Same bowl of ice water<\/text><\/svg>","q":"Which hand will feel cold first?","options":["The hand in bag A (lard)","The hand in bag B (empty)","Both at the same time","Neither"],"answer":1,"hints":["What does a thick layer of fat do for polar bears?"],"explain":"Fat keeps heat in, so the hand in the empty bag B feels cold first.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3b-15","sub":"C3b","type":"multi","fmt":"Fair test","src":"fat","q":"Which of these make Mia's experiment a FAIR test? (There can be more than one answer.)","options":["Both bags are put in the same ice water","Both bags go in at the same time","The bags are the same size and type","Bag B is put in warm water"],"answer":[0,1,2],"hints":["Only the lard should be different."],"explain":"Same water, same time and same bags; only the lard is changed. Putting bag B in warm water would make it unfair.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3b-16","sub":"C3b","type":"short","fmt":"Fair test","src":"fat","q":"What can Mia conclude, and which animals does it help explain?","answer":"A thick layer of fat keeps the body warm in cold places. It explains why polar bears and emperor penguins have a thick layer of fat.","groups":[["fat"],["warm","cold","heat"],["polar bear","penguin"]],"need":2,"hints":["Fat + warm."],"explain":"Fat keeps animals warm, like polar bears and penguins.","diff":"hard","accept":[],"cat":"C3"},{"id":"C3b-17","sub":"C3b","type":"mcq","fmt":"Fair test","src":"wool","svg":"<svg viewBox=\"0 0 340 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"two cups of hot water\"><rect width=\"340\" height=\"210\" rx=\"12\" fill=\"#f8f9fa\"/><rect x=\"50\" y=\"60\" width=\"80\" height=\"100\" rx=\"8\" fill=\"#ffc9c9\" stroke=\"#c92a2a\" stroke-width=\"2\"/><rect x=\"40\" y=\"55\" width=\"100\" height=\"110\" rx=\"14\" fill=\"#e9ecef\" stroke=\"#868e96\" stroke-width=\"3\" stroke-dasharray=\"6 3\"/><rect x=\"60\" y=\"60\" width=\"60\" height=\"10\" fill=\"#ffc9c9\"/><path d=\"M70 50 q6 -10 0 -20\" stroke=\"#fa5252\" stroke-width=\"2\" fill=\"none\"/><path d=\"M90 50 q6 -10 0 -20\" stroke=\"#fa5252\" stroke-width=\"2\" fill=\"none\"/><path d=\"M110 50 q6 -10 0 -20\" stroke=\"#fa5252\" stroke-width=\"2\" fill=\"none\"/><rect x=\"210\" y=\"60\" width=\"80\" height=\"100\" rx=\"8\" fill=\"#ffc9c9\" stroke=\"#c92a2a\" stroke-width=\"2\"/><path d=\"M230 50 q6 -10 0 -20\" stroke=\"#fa5252\" stroke-width=\"2\" fill=\"none\"/><path d=\"M250 50 q6 -10 0 -20\" stroke=\"#fa5252\" stroke-width=\"2\" fill=\"none\"/><path d=\"M270 50 q6 -10 0 -20\" stroke=\"#fa5252\" stroke-width=\"2\" fill=\"none\"/><text x=\"88\" y=\"190\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Cup A: wrapped<\/text><text x=\"88\" y=\"205\" font-family=\"Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">in thick wool<\/text><text x=\"250\" y=\"190\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Cup B: not wrapped<\/text><\/svg>","q":"After 20 minutes, which cup of water will probably be warmer?","options":["Cup A (wrapped in thick wool)","Cup B (not wrapped)","They will be the same","Cannot tell"],"answer":0,"hints":["Thick fur keeps polar bears warm."],"explain":"The thick wool (like thick fur) keeps heat in, so cup A stays warmer.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3b-18","sub":"C3b","type":"fill","fmt":"Fair test","src":"wool","q":"In Leo's test, the only thing he changed is whether the cup is wrapped in ____.","answer":"wool","accept":["thick wool","a thick layer of wool"],"hints":["Cup A vs cup B."],"explain":"The variable changed is the wool wrapping; the amount of water and the cups are kept the same.","diff":"medium","cat":"C3"},{"id":"C3b-19","sub":"C3b","type":"mcq","fmt":"Fair test","src":"wool","q":"Why must Leo use the SAME amount of hot water in both cups?","options":["So that only one thing is different and the test is fair","So that the cups look nice","To make the water hotter","It does not matter"],"answer":0,"hints":["Fair test = change one thing only."],"explain":"Keeping everything else the same makes it a fair test.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3b-20","sub":"C3b","type":"order","fmt":"Experiment","q":"Put Leo's experiment steps in order (type the letters).","options":["Compare the temperatures and write a conclusion.","Pour the same amount of hot water into two identical cups.","Wrap cup A in thick wool.","Measure the temperature of both cups every 5 minutes."],"answer":"BCDA","hints":["Set up → measure → conclude."],"explain":"Pour → wrap → measure → conclude.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-01","sub":"C3c","type":"mcq","q":"Young harp seals are white and live on snow. How does this help them?","options":["Protective colouration – they are hard to see","Warning colours scare predators","They can catch more fish","They lose less water"],"answer":0,"hints":["White on white."],"explain":"Their colour matches the snow (protective colouration).","diff":"easy","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3c-02","sub":"C3c","type":"mcq","q":"Stick insects look like tree branches. This way of protection is called …","options":["warning","mimicry","living in groups","deep sleep"],"answer":1,"hints":["Book p.20: leafy sea dragon, stick insect, flatfish."],"explain":"Looking like something in the surroundings is mimicry.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3c-03","sub":"C3c","type":"classify","fmt":"Classifying","q":"How does each animal protect itself?","items":["Leafy sea dragon","Porcupine","Sardines","Grasshopper","Poison dart frog","Spotted deer"],"options":["Protective colouration","Mimicry","Warning","Living in groups"],"answer":[1,2,3,0,2,3],"hints":["Bright colours and quills = warning."],"explain":"Mimicry: leafy sea dragon. Warning: porcupine, poison dart frog. Groups: sardines, spotted deer. Colouration: grasshopper.","diff":"hard","accept":[],"cat":"C3"},{"id":"C3c-04","sub":"C3c","type":"tf","q":"Poison dart frogs are dull-coloured so that they can stay hidden.","answer":false,"hints":["Their colours are very bright."],"explain":"False. They have bright warning colours, and their skin can release a poison.","diff":"easy","accept":[],"fmt":"True or false","cat":"C3"},{"id":"C3c-05","sub":"C3c","type":"fill","q":"The skin of poison dart frogs can release a ____ to protect themselves from predators.","answer":"poison","accept":["toxin"],"hints":["Book p.21 speech bubble."],"explain":"Their skin releases a poison.","diff":"easy","fmt":"Fill in the blank","cat":"C3"},{"id":"C3c-06","sub":"C3c","type":"mcq","q":"The patterns on a common five-ring butterfly look like …","options":["the eyes of a dangerous animal","dried leaves","stones","tree branches"],"answer":0,"hints":["Round 'rings' on the wings."],"explain":"The patterns look like the eyes of a dangerous animal, which can scare predators away (warning).","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3c-07","sub":"C3c","type":"short","q":"How does living in groups help animals such as sardines and spotted deer?","answer":"Living in large groups helps them defend themselves from predators (e.g. they can distract predators while running away together).","groups":[["group","together"],["predator","enem","defend","protect","safe"]],"need":2,"hints":["Book p.21."],"explain":"They defend themselves from predators.","diff":"medium","accept":[],"fmt":"Short question","cat":"C3"},{"id":"C3c-08","sub":"C3c","type":"fix","q":"Judge and correct: “Porcupines have soft fur on their backs to keep their predators away.” What should 'soft fur' be changed to?","answer":"sharp quills","accept":["quills","spikes","sharp spikes","hard spikes"],"hints":["Ouch!"],"explain":"Porcupines have SHARP QUILLS.","diff":"medium","fmt":"Judge & correct","cat":"C3"},{"id":"C3c-09","sub":"C3c","type":"mcq","q":"A lion's body colour is similar to the colour of its surroundings. How does this help the lion?","options":["It can hide so its prey does not see it easily","It scares other lions","It keeps it cool","It helps it swim"],"answer":0,"hints":["Protective colouration also helps hunters."],"explain":"It hides in its surroundings so its prey does not see it easily.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3c-10","sub":"C3c","type":"mcq","fmt":"Analysis","q":"A grasshopper has powerful back legs. What do they help it do?","options":["Jump to avoid enemies","Dig holes","Swim fast","Catch fish"],"answer":0,"hints":["Workbook p.7."],"explain":"Powerful back legs let it jump to avoid enemies; its back legs are also lined with spikes for protection.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-11","sub":"C3c","type":"mcq","fmt":"Analysis","q":"The colour of a chameleon changes with the environment. This helps it …","options":["avoid predators","keep warm","drink water","fly"],"answer":0,"hints":["Workbook p.7."],"explain":"Changing colour with the environment helps it avoid predators.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-12","sub":"C3c","type":"mcq","fmt":"Analysis","q":"When some meerkats are looking for food, other meerkats look out for danger. This shows that meerkats …","options":["live in groups","live alone","go into deep sleep","migrate"],"answer":0,"hints":["Workbook p.7."],"explain":"Meerkats live in groups.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-13","sub":"C3c","type":"blanks","fmt":"Completing the table","q":"Complete the table: ways animals protect themselves.","items":["Flatfish (looks like the sea floor): ____","Porcupine (sharp quills): ____","Zebras: living in ____","Young harp seal: protective ____"],"answer":["mimicry","warning","groups","colouration"],"accepts":[["mimic"],["warn"],["a group","herds"],["coloration","colour","color"]],"hints":["Four ways: colouration, mimicry, warning, groups."],"explain":"Mimicry, warning, groups, colouration.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-14","sub":"C3c","type":"mcq","fmt":"Fair test","src":"worms","q":"Which paper caterpillars will probably be picked up LESS?","options":["The green ones","The red ones","Both the same","None at all"],"answer":0,"hints":["Green on a green lawn."],"explain":"Green ones match the lawn (like protective colouration), so they are harder to find.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-15","sub":"C3c","type":"multi","fmt":"Fair test","src":"worms","q":"Which things did Sam keep the same to make it a fair test? (There can be more than one answer.)","options":["The number of each colour","The size of the caterpillars","The colour of the caterpillars","The time given"],"answer":[0,1,3],"hints":["The colour is what he is testing."],"explain":"Same number, size, lawn and time; only the colour is changed.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3c-16","sub":"C3c","type":"short","fmt":"Fair test","src":"worms","diff":"hard","q":"Which animals from the book does Sam's experiment help to explain? Explain.","answer":"Animals with protective colouration, e.g. grasshoppers, young harp seals (white like snow) or lions. Their colours are like their surroundings, so they are hard to see.","groups":[["grasshopper","harp seal","seal","lion","chameleon"],["colour","color","surrounding","hide","hard to see"]],"need":2,"hints":["Green caterpillars on grass = ?"],"explain":"Protective colouration: grasshopper, harp seal, lion.","accept":[],"cat":"C3"},{"id":"C3c-17","sub":"C3c","type":"mcq","q":"Leafy sea dragons look like the seaweed around them. Which way of protection is this?","options":["Mimicry","Warning","Living in groups","Deep sleep"],"answer":0,"hints":["Book p.20."],"explain":"Looking like seaweed is mimicry.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3c-18","sub":"C3c","type":"fill","q":"Animals use different ways to hide from other animals, scare ____ away or defend themselves from predators.","answer":"predators","accept":["enemies"],"hints":["Book p.21 Note."],"explain":"…scare predators away.","diff":"medium","fmt":"Fill in the blank","cat":"C3"},{"id":"C3d-01","sub":"C3d","type":"mcq","diff":"easy","q":"Which animal has a long and narrow beak to get nectar from flowers?","options":["Hawk","Pelican","Hummingbird","Penguin"],"answer":2,"hints":["A very small bird near flowers."],"explain":"The hummingbird.","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3d-02","sub":"C3d","type":"mcq","q":"How does a giraffe's long neck help it get food?","options":["It can reach the leaves of tall trees.","It can dig for roots.","It can catch fish.","It can drink nectar."],"answer":0,"hints":["Book p.24 summary."],"explain":"It reaches the leaves of tall trees.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3d-03","sub":"C3d","type":"match","q":"Match each animal with the feature that helps it get food.","items":["Mantis","Lion","Hawk","Pelican"],"options":["A long, large beak with a throat pouch","Sharp teeth","A sharp beak and sharp claws","Long, powerful forelegs lined with spikes","A long neck"],"answer":[3,1,2,0],"hints":["The long neck belongs to the giraffe – not used."],"explain":"Mantis – spiky forelegs; lion – sharp teeth; hawk – sharp beak and claws; pelican – throat pouch.","diff":"medium","accept":[],"fmt":"Matching","cat":"C3"},{"id":"C3d-04","sub":"C3d","type":"fill","q":"A mantis hunts with its forelegs, which are lined with sharp ____.","answer":"spikes","hints":["Book p.23."],"explain":"Forelegs lined with sharp spikes.","diff":"medium","accept":[],"fmt":"Fill in the blank","cat":"C3"},{"id":"C3d-05","sub":"C3d","type":"tf","q":"Birds have beaks of different shapes which allow them to get different food.","answer":true,"hints":["Hummingbird vs hawk vs pelican."],"explain":"True.","diff":"easy","accept":[],"fmt":"True or false","cat":"C3"},{"id":"C3d-06","sub":"C3d","type":"fix","q":"Judge and correct: “A hummingbird has a short and thick beak to get nectar from flowers easily.” What should 'short and thick' be changed to?","answer":"long and narrow","accept":["long narrow","long and thin","long thin"],"hints":["It reaches deep into flowers."],"explain":"LONG AND NARROW beak.","diff":"medium","fmt":"Judge & correct","cat":"C3"},{"id":"C3d-07","sub":"C3d","type":"mcq","q":"Which animal has a saw-like structure?","options":["Sawfish","Giraffe","Mantis","Hawk"],"answer":0,"hints":["Its name gives it away."],"explain":"The sawfish.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C3"},{"id":"C3d-08","sub":"C3d","type":"bank","fmt":"Word bank","q":"Word bank: choose the correct animal. (One word is not used.)","items":["____ have sharp teeth to tear and bite their prey.","Some ____ can change their skin colours.","____ have a long neck to reach the leaves of tall trees.","____ have a large beak with a throat pouch."],"options":["Pelicans","Giraffes","Lions","Hummingbirds","Lizards"],"answer":[2,4,1,0],"hints":["Hummingbirds are not needed."],"explain":"Lions, lizards, giraffes, pelicans.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3d-09","sub":"C3d","type":"short","q":"Why do some animals migrate?","answer":"Some animals migrate for food or reproduction.","groups":[["food","reproduc","breed","babies","young"]],"need":1,"hints":["Book p.24 question."],"explain":"For food or reproduction.","diff":"medium","accept":[],"fmt":"Short question","cat":"C3"},{"id":"C3d-10","sub":"C3d","type":"mcq","fmt":"Analysis","q":"A chameleon's tongue is long and sticky. How does this help it?","options":["It can catch insects for food.","It can keep warm.","It can scare predators.","It can store water."],"answer":0,"hints":["Workbook p.7."],"explain":"A long, sticky tongue catches insects.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3d-11","sub":"C3d","type":"mcq","fmt":"Analysis","q":"A meerkat has strong claws. How does it use them to get food?","options":["It digs holes.","It climbs tall trees.","It swims.","It flies."],"answer":0,"hints":["Workbook p.7."],"explain":"Meerkats dig holes with their strong claws to get food.","diff":"medium","accept":[],"cat":"C3"},{"id":"C3d-12","sub":"C3d","type":"short","diff":"hard","q":"Choose ONE animal from the book and explain how one of its features helps it get food.","answer":"E.g. Giraffe – its long neck lets it reach the leaves of tall trees. Hummingbird – long, narrow beak to get nectar. Lion – sharp teeth to tear prey. Mantis – spiky forelegs to hold prey.","groups":[["giraffe","hummingbird","lion","mantis","hawk","pelican","chameleon","meerkat"],["neck","beak","teeth","foreleg","claw","pouch","tongue"]],"need":2,"hints":["Name the animal AND the feature."],"explain":"Any animal + feature + how it helps.","accept":[],"fmt":"Short question","cat":"C3"},{"id":"C3d-13","sub":"C3d","type":"classify","fmt":"Classifying","q":"Is each feature mainly for getting FOOD or for PROTECTION?","items":["Hummingbird's long beak","Porcupine's sharp quills","Mantis's spiky forelegs","Stick insect's shape","Giraffe's long neck","Poison dart frog's bright colours"],"options":["Getting food","Protection"],"answer":[0,1,0,1,0,1],"hints":["Ask: does it help it eat, or help it stay safe?"],"explain":"Food: beak, forelegs, neck. Protection: quills, shape, bright colours.","diff":"hard","accept":[],"cat":"C3"}]}</script>
<script>
const D=JSON.parse(document.getElementById('sci-data').textContent),QS=D.questions,SUBS=D.subs,CATS=D.cats,SRC=D.src;
const BYID={};QS.forEach(q=>BYID[q.id]=q);
function detectTest(){
 let on=false;
 try{
  const q=new URLSearchParams(location.search).get('test');
  if(q==='1'){localStorage.setItem('p6quizTest','1');on=true}
  else if(q==='0'){localStorage.removeItem('p6quizTest');on=false}
  else on=localStorage.getItem('p6quizTest')==='1';
 }catch(e){on=false}
 return on;
}
const TEST=detectTest(),P=TEST?'sci_test_':'sci_';
if(TEST){document.getElementById('test').style.display='block';document.getElementById('clearTest').onclick=()=>{if(confirm('Clear test data?')){['data'].forEach(k=>localStorage.removeItem(P+k));location.reload()}}}
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(P+k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}};
let data=ld('data',null);if(!data||typeof data!=='object')data={attempts:[],review:{},stat:{}};data.attempts=data.attempts||[];data.review=data.review||{};data.stat=data.stat||{};
const save=()=>sv('data',data);
// ---- progress sync (same Apps Script endpoint, key and row shape as index.html) ----
const SYNC_URL='https://script.google.com/macros/s/AKfycbyatheq18si3u1yzWxpYZURWXaYfmmXLUIAbb8EHS1SmSqy-JBIunVIIwPBxNO_HGVx/exec';
const SYNC_KEY='p6quiz-7Kq2';
const OUT=TEST?'p6quiz4testout':'p6quiz4out';
let outbox=[];let syncing=false;
function isoHK(t){
 const d=new Date((t||Date.now())+8*3600000), p=n=>String(n).padStart(2,'0');
 return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+'T'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+'+08:00';
}
function loadOut(){try{const a=JSON.parse(localStorage.getItem(OUT)); outbox=Array.isArray(a)?a.filter(x=>x&&x.row&&!x.sent):[]}catch(e){outbox=[]}}
function saveOut(){try{localStorage.setItem(OUT,JSON.stringify(outbox.slice(-400)))}catch(e){}}
function catLabel(q){return 'Science-'+q.cat+' '+CATS[q.cat].short}
function queueAttempt(q,ok,hint,ms,given){
 loadOut();
 const row={
  timestamp:isoHK(Date.now()),
  session_id:S&&S.sid?S.sid:'none',
  mode:S&&S.mode?S.mode:'practice',
  question_id:'sci-'+q.id,
  category:catLabel(q),
  difficulty:q.diff||'medium',
  correct:!!ok,
  hint_used:!!hint,
  time_sec:Math.round(Math.max(0,ms||0)/100)/10,
  answer_given:String(given==null?'':given).slice(0,180),
  user:TEST?'test':'ansbie'
 };
 outbox.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), row, sent:false});
 if(outbox.length>400)outbox=outbox.slice(-400);
 saveOut();flushOut();
}
function flushOut(){
 if(syncing)return;
 const pending=outbox.filter(x=>x&&!x.sent&&x.row);
 if(!pending.length)return;
 if(navigator.onLine===false)return;
 const batch=pending.slice(0,40);
 syncing=true;let failed=false;
 fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:SYNC_KEY,rows:batch.map(x=>x.row)})})
  .then(()=>{const ids={};batch.forEach(x=>{ids[x.id]=1});loadOut();outbox=outbox.filter(x=>!ids[x.id]);saveOut();})
  .catch(()=>{failed=true})
  .then(()=>{syncing=false;if(!failed&&outbox.some(x=>x&&!x.sent))flushOut();});
}
loadOut();window.addEventListener('online',()=>flushOut());flushOut();
// ---- lenient answer checking ----
// English: case, punctuation, articles, simple plurals and UK/US spellings are ignored; one small typo allowed in longer words
const SPV={color:'colour',colors:'colours',coloration:'colouration',colored:'coloured',gray:'grey'};
const STOP={a:1,an:1,the:1};
function stem(w){if(w.length>4&&/ies$/.test(w))return w.slice(0,-3)+'y';if(w.length>4&&/(ches|shes|sses|xes)$/.test(w))return w.slice(0,-2);if(w.length>3&&/s$/.test(w)&&!/(ss|us|is)$/.test(w))return w.slice(0,-1);return w}
function norm(s){
 s=String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/[\u2018\u2019'`]/g,'');
 s=s.replace(/[\p{P}\p{S}]/gu,' ');
 return s.split(/\s+/).filter(w=>w&&!STOP[w]).map(w=>stem(SPV[w]||w)).join('');
}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];for(let j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return d[a.length][b.length]}
function checkFill(q,given){
 const g=norm(given);if(!g)return false;
 const list=[q.answer].concat(q.accept||[]).map(norm).filter(Boolean);
 if(list.indexOf(g)>=0)return true;
 if(/^(not|no|non)/.test(g)&&!list.some(a=>/^(not|no|non)/.test(a)))return false;
 if(list.some(a=>a.length>=6&&lev(a,g)<=(a.length>=8?2:1)))return true;
 // a few extra words around the key answer, e.g. "thick stems", "it is the thorax"
 const a=norm(q.answer);return a.length>=3&&g.indexOf(a)>=0&&g.length<=a.length+8;
}
function shortHits(q,given){const g=norm(given);return (q.groups||[]).map(gr=>gr.some(w=>g.indexOf(norm(w))>=0))}
function checkShort(q,given){return shortHits(q,given).filter(Boolean).length>=(q.need||1)}
function checkOrder(q,given){return String(given||'').normalize('NFKC').toUpperCase().replace(/[^A-Z]/g,'')===q.answer}
// ---- spaced review (1, 3, 7 days) ----
const DAY=86400000,GAPS=[0,1,3,7];
function schedule(id,ok){
 const r=data.review[id];
 if(!ok){data.review[id]={box:0,due:Date.now()};return}
 if(!r)return;
 r.box++; if(r.box>=GAPS.length){delete data.review[id];return}
 r.due=Date.now()+GAPS[r.box]*DAY;
}
const dueIds=()=>Object.keys(data.review).filter(id=>BYID[id]&&data.review[id].due<=Date.now());
// ---- helpers ----
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const L='ABCDEFGH';
const isM=q=>q.type==='match'||q.type==='bank'||q.type==='classify';
const TL=q=>q.fmt&&!['MCQ','MCQ (multi)','True or false','Fill in the blank','Judge & correct','Ordering','Matching','Short question','Word bank','Classifying','Completing the table'].includes(q.fmt)?q.fmt+' · '+TYPE[q.type]:TYPE[q.type];
const DIFF={easy:'Easy',medium:'Medium',hard:'Hard'};
const TYPE={bank:'Word bank',classify:'Classifying',blanks:'Fill in the table',mcq:'MCQ',multi:'MCQ (more than one)',tf:'True or false',fill:'Fill in the blank',fix:'Judge & correct',order:'Ordering',match:'Matching',short:'Short question'};
let diffSel=ld('diff','all');
let S=null;
function pool(){return QS.filter(q=>diffSel==='all'||q.diff===diffSel)}
function stat(ids){let n=0,ok=0;ids.forEach(id=>{const s=data.stat[id];if(s){n++;if(s.last)ok++}});return {n,ok}}
function newSid(){return 'sci'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
// ---- home ----
function home(){
 S=null;window.scrollTo(0,0);
 const due=dueIds().length;
 let h='<h1>P6 Science Quiz 🔬🌵</h1><div class="hello">Hi Ansbie! 👋 Which topic shall we revise today?</div>'+
 '<div class="card"><b>Difficulty</b><div class="chips" id="diffs">'+[['all','All'],['easy','Easy ⭐'],['medium','Medium ⭐⭐'],['hard','Hard ⭐⭐⭐']].map(([k,t])=>'<button class="chip'+(diffSel===k?' on':'')+'" data-diff="'+k+'">'+t+'</button>').join('')+'</div>'+
 '<div class="modes" style="margin-top:8px">'+
 '<button class="btn big pri" data-go="quick10">⚡ Quick 10<small>10 random questions</small></button>'+
 '<button class="btn big warn" data-go="timed">⏱️ Timed challenge<small>15 questions · 10 minutes</small></button>'+
 '<button class="btn big go" data-go="review"'+(due?'':' disabled')+'>🔁 Review mistakes<small>'+(due?due+' due now':'nothing due yet')+'</small></button>'+
 '<button class="btn big" data-go="print">🖨️ Worksheet<small>Print with answer key</small></button>'+
 '</div><p class="muted">Answered '+Object.keys(data.stat).length+' / '+QS.length+' · Mistakes come back after 1, 3 and 7 days.</p></div>';
 Object.keys(CATS).forEach(c=>{
  const C=CATS[c];
  h+='<div class="card lesson" style="--c:'+C.color+'"><h2>'+C.emoji+' '+esc(C.name)+'</h2>'+
   '<div class="row" style="margin-top:0"><button class="btn" style="background:'+C.color+';color:#fff" data-cat="'+c+'">Practise whole chapter</button><button class="btn" data-tut="'+c+'">📖 Key points</button></div>';
  Object.keys(SUBS).filter(s=>SUBS[s].cat===c).forEach(s=>{
   const ids=QS.filter(q=>q.sub===s).map(q=>q.id),st=stat(ids);
   h+='<div class="sub"><div class="nm">'+esc(SUBS[s].name)+'<div class="bar"><i style="width:'+Math.round(st.ok/ids.length*100)+'%"></i></div></div><span class="pct">'+st.ok+'/'+ids.length+' ✓</span><button class="btn" data-sub="'+s+'">Practise</button><button class="btn" data-tut="'+s+'" title="Key points">📖</button></div>';
  });
  h+='</div>';
 });
 app.innerHTML=h;
}
function tutorial(key){
 window.scrollTo(0,0);
 const subs=CATS[key]?Object.keys(SUBS).filter(s=>SUBS[s].cat===key):[key];
 const c=SUBS[subs[0]].cat;
 app.innerHTML='<div class="card lesson" style="--c:'+CATS[c].color+'"><h2>📖 '+esc(CATS[c].name)+'</h2>'+subs.map(s=>'<h3>'+esc(SUBS[s].name)+'</h3><ul class="tut">'+SUBS[s].tut.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><button class="btn" data-sub="'+s+'">Practise “'+esc(SUBS[s].name)+'”</button>').join('')+
  '<div class="row"><button class="btn" data-home>← Back</button></div></div>';
}
// ---- session ----
function start(mode,opts){
 let list;
 if(mode==='review')list=shuffle(dueIds().map(id=>BYID[id]));
 else if(mode==='category'){list=shuffle(pool().filter(q=>opts.sub?q.sub===opts.sub:q.cat===opts.cat));if(!list.length)list=shuffle(QS.filter(q=>opts.sub?q.sub===opts.sub:q.cat===opts.cat))}
 else {const p=shuffle(pool());list=p.slice(0,mode==='timed'?15:10)}
 if(!list.length){alert('No questions here yet');return}
 S={mode,sid:newSid(),list,i:0,ok:0,res:[],end:mode==='timed'?Date.now()+10*60000:0,label:opts&&opts.sub?SUBS[opts.sub].name:opts&&opts.cat?CATS[opts.cat].name:({quick10:'Quick 10',timed:'Timed challenge',review:'Review mistakes'})[mode]};
 show();
}
let tick=null;
function timerText(){const ms=Math.max(0,S.end-Date.now()),s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function show(){
 window.scrollTo(0,0);
 clearInterval(tick);
 if(S.end&&Date.now()>=S.end)return finish(true);
 const q=S.list[S.i];S.q=q;S.t0=Date.now();S.hint=0;S.done=false;S.pick=q.type==='multi'?[]:null;
 const C=CATS[q.cat];
 let h='<div class="card"><div class="qhead"><span>'+esc(S.label)+' · Q '+(S.i+1)+' / '+S.list.length+'</span>'+(S.end?'<span class="timer" id="tm">⏱ '+timerText()+'</span>':'')+'<span>✅ '+S.ok+'</span></div>'+
  '<div style="margin-top:6px"><span class="tag" style="--c:'+C.color+'">'+esc(C.short)+'</span> <span class="tag">'+esc(SUBS[q.sub].name)+'</span> <span class="tag" style="--c:#7048e8">'+TL(q)+'</span> <span class="tag" style="--c:#adb5bd">'+DIFF[q.diff]+'</span></div>';
 if(q.src){const s=SRC[q.src];h+='<div class="src"><b>📄 '+esc(s.title)+'</b>'+esc(s.text)+'<span class="cite">'+esc(s.cite)+'</span></div>'}
 if(q.pic)h+='<div class="pic">'+esc(q.pic)+'</div>';
 if(q.svg)h+='<div class="svgbox">'+q.svg+'</div>';
 h+='<div class="stem">'+esc(q.q)+'</div><div id="inp">'+inputHtml(q)+'</div>'+
  '<div class="hints" id="hints"></div><div id="fb"></div>'+
  '<div class="row" id="acts"><button class="btn warn" id="hintBtn">💡 Hint ('+q.hints.length+')</button><button class="btn go" id="sub">Submit</button></div>'+
  '<div class="row"><button class="btn" data-home>End</button></div></div>';
 app.innerHTML=h;
 if(S.end)tick=setInterval(()=>{const el=document.getElementById('tm');if(el)el.textContent='⏱ '+timerText();if(Date.now()>=S.end){clearInterval(tick);if(!S.done)submit(true);else finish(true)}},500);
 const f=app.querySelector('input.ans,textarea.ans');if(f&&!('ontouchstart' in window))f.focus();
}
function inputHtml(q){
 if(q.type==='mcq'||q.type==='multi')return q.options.map((o,i)=>'<button class="opt" data-o="'+i+'"><b>'+L[i]+'.</b> '+esc(o)+'</button>').join('');
 if(q.type==='tf')return '<button class="opt" data-o="0">✓ True</button><button class="opt" data-o="1">✗ False</button>';
 if(q.type==='fill'||q.type==='fix')return '<input class="ans" id="ans" autocomplete="off" placeholder="'+(q.type==='fix'?'Write the correct word(s)':'Type your answer here')+'">';
 if(q.type==='short')return '<textarea class="ans" id="ans" placeholder="Answer in full sentences"></textarea>';
 if(q.type==='order')return '<div class="olist">'+q.options.map((o,i)=>'<div><b>'+L[i]+'.</b> '+esc(o)+'</div>').join('')+'</div><input class="ans" id="ans" autocomplete="off" placeholder="e.g. '+L.slice(0,q.options.length)+'">';
 if(q.type==='bank')return '<div class="wbank">'+q.options.map((o,j)=>'<span>'+L[j]+'. '+esc(o)+'</span>').join('')+'</div>'+q.items.map((it,i)=>'<div class="mrow"><span><b>'+(i+1)+'.</b> '+esc(it)+'</span><select class="ans" data-m="'+i+'"><option value="">— choose a word —</option>'+q.options.map((o,j)=>'<option value="'+j+'">'+L[j]+'. '+esc(o)+'</option>').join('')+'</select></div>').join('');
 if(q.type==='classify')return '<div class="wbank">'+q.options.map((o,j)=>'<span>'+(j+1)+'. '+esc(o)+'</span>').join('')+'</div>'+q.items.map((it,i)=>'<div class="mrow"><span><b>'+L[i]+'.</b> '+esc(it)+'</span><select class="ans" data-m="'+i+'"><option value="">— which group? —</option>'+q.options.map((o,j)=>'<option value="'+j+'">'+(j+1)+'. '+esc(o)+'</option>').join('')+'</select></div>').join('');
 if(q.type==='blanks')return q.items.map((it,i)=>'<div class="brow"><span>'+esc(it)+'</span><input class="ans" data-b="'+i+'" autocomplete="off" placeholder="Blank '+(i+1)+'"></div>').join('');
 if(q.type==='match')return q.items.map((it,i)=>'<div class="mrow"><span><b>'+(i+1)+'.</b> '+esc(it)+'</span><select class="ans" data-m="'+i+'"><option value="">— choose —</option>'+q.options.map((o,j)=>'<option value="'+j+'">'+L[j]+'. '+esc(o)+'</option>').join('')+'</select></div>').join('');
 return '';
}
function given(q){
 if(q.type==='mcq')return S.pick==null?'':L[S.pick];
 if(q.type==='multi')return S.pick.slice().sort().map(i=>L[i]).join(',');
 if(q.type==='tf')return S.pick==null?'':(S.pick===0?'✓':'✗');
 if(q.type==='blanks')return [...app.querySelectorAll('input[data-b]')].map(x=>x.value.trim()||'-').join(',');
 if(isM(q))return [...app.querySelectorAll('select[data-m]')].map(s=>s.value===''?'-':L[+s.value]).join(',');
 const el=document.getElementById('ans');return el?el.value.trim():'';
}
function judge(q,g){
 if(q.type==='mcq')return S.pick===q.answer;
 if(q.type==='multi')return S.pick.slice().sort().join()===q.answer.slice().sort().join();
 if(q.type==='tf')return S.pick!=null&&(S.pick===0)===q.answer;
 if(q.type==='fill'||q.type==='fix')return checkFill(q,g);
 if(q.type==='order')return checkOrder(q,g);
 if(q.type==='blanks'){const v=[...app.querySelectorAll('input[data-b]')].map(x=>x.value);return v.every((x,i)=>checkFill({answer:q.answer[i],accept:(q.accepts||[])[i]||[]},x))}
 if(isM(q)){const v=[...app.querySelectorAll('select[data-m]')].map(s=>s.value===''?-1:+s.value);return v.every((x,i)=>x===q.answer[i])}
 if(q.type==='short')return checkShort(q,g);
 return false;
}
function answerText(q){
 if(q.type==='mcq')return L[q.answer]+'. '+q.options[q.answer];
 if(q.type==='multi')return q.answer.map(i=>L[i]+'. '+q.options[i]).join('；');
 if(q.type==='tf')return q.answer?'✓ True':'✗ False';
 if(q.type==='bank')return q.items.map((it,i)=>(i+1)+'. '+esc(it.replace(/_{3,}|＿{2,}/,'[ '+q.options[q.answer[i]]+' ]'))).join('<br>');
 if(q.type==='classify')return q.options.map((o,j)=>(j+1)+'. '+esc(o)+': '+(q.items.map((it,i)=>q.answer[i]===j?L[i]:null).filter(Boolean).join(', ')||'—')).join('<br>');
 if(q.type==='blanks')return q.items.map((it,i)=>(i+1)+'. '+esc(q.answer[i])).join('; ');
 if(q.type==='match')return q.items.map((it,i)=>(i+1)+'. '+it+' → '+L[q.answer[i]]+'. '+q.options[q.answer[i]]).join('<br>');
 if(q.type==='order')return q.answer.split('').join(' → ');
 return esc(q.answer);
}
function submit(timeout){
 const q=S.q;if(S.done)return;
 const g=given(q);
 if(!timeout&&!g.replace(/[-,]/g,'')){alert('Please answer first 🙂');return}
 S.done=true;
 const ok=!timeout&&judge(q,g);
 const ms=Date.now()-S.t0;
 if(ok)S.ok++;
 S.res.push({id:q.id,ok,g});
 data.stat[q.id]={n:((data.stat[q.id]||{}).n||0)+1,last:ok&&!S.hint};
 data.attempts.push({id:q.id,ok,hint:!!S.hint,t:Date.now()});if(data.attempts.length>2000)data.attempts.splice(0,data.attempts.length-2000);
 schedule(q.id,ok&&!S.hint);
 save();
 queueAttempt(q,ok,S.hint>0,ms,g);
 // mark choices
 if(['mcq','multi','tf'].includes(q.type)){
  const right=q.type==='tf'?[q.answer?0:1]:(q.type==='mcq'?[q.answer]:q.answer);
  app.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.o;if(right.includes(i))b.classList.add('right');else if(b.classList.contains('sel'))b.classList.add('wrong');b.disabled=true});
 }
 let fb='<div class="fb '+(ok?'ok':'no')+'"><b>'+(timeout?'⏰ Time\'s up!':ok?'✅ Correct!'+(S.hint?' (hint used – it will come back for review)':''):'❌ Not quite')+'</b>';
 if(q.type==='short'){
  const hits=shortHits(q,g);
  fb+='<div class="exp">Key ideas (need '+q.need+'): '+q.groups.map((gr,i)=>'<span class="kw'+(hits[i]?' hit':'')+'">'+esc(gr.slice(0,3).join(' / '))+'</span>').join('')+'</div><div class="exp"><b>Model answer: </b>'+esc(q.answer)+'</div>';
 }else{
  fb+='<div class="exp"><b>Correct answer: </b>'+answerText(q)+'</div>';
  if(q.type==='blanks'&&(q.accepts||[]).some(a=>a.length))fb+='<div class="exp muted">Also accepted: '+q.accepts.map((a,i)=>a.length?(i+1)+'. '+a.map(esc).join(' / '):'').filter(Boolean).join('; ')+'</div>';
 if((q.accept||[]).length)fb+='<div class="exp muted">Also accepted: '+q.accept.map(esc).join(', ')+'</div>';
 }
 fb+='<div class="exp">📝 '+esc(q.explain)+'</div></div>';
 document.getElementById('fb').innerHTML=fb;
 document.getElementById('acts').innerHTML='<button class="btn pri" id="next">'+(S.i+1<S.list.length?'Next →':'See results 🎉')+'</button>';
}
function next(){S.i++;if(S.i>=S.list.length||(S.end&&Date.now()>=S.end))finish(S.end&&Date.now()>=S.end);else show()}
function finish(timeUp){
 clearInterval(tick);window.scrollTo(0,0);
 const n=S.res.length,ok=S.ok,pct=n?Math.round(ok/n*100):0;
 const wrong=S.res.filter(r=>!r.ok);
 app.innerHTML='<div class="card"><h2>'+(timeUp?'⏰ Time\'s up!':'🎉 Finished!')+'</h2><p style="font-size:22px"><b>'+ok+' / '+n+'</b>&nbsp;('+pct+'%)'+(pct>=80?' Brilliant, Ansbie! 🌟':pct>=60?' Good work – keep going! 💪':' Take your time – read the key points and try again 📖')+'</p>'+
  (wrong.length?'<h3>Questions to revise</h3><ul>'+wrong.map(r=>'<li>'+esc(BYID[r.id].q)+'<br><span class="muted">Answer: '+answerText(BYID[r.id])+'</span></li>').join('')+'</ul><p class="muted">These have been added to “Review mistakes”.</p>':'')+
  '<div class="row"><button class="btn pri" data-home>Back to home</button></div></div>';
 S=null;
}
// ---- printable worksheet ----
let PW={subs:Object.keys(SUBS),diff:'all',n:20,key:true,list:[]};
function printSetup(){
 window.scrollTo(0,0);
 app.innerHTML='<div class="card"><h2>🖨️ Printable worksheet</h2><b>Topics</b><div class="chips">'+Object.keys(SUBS).map(s=>'<button class="chip'+(PW.subs.includes(s)?' on':'')+'" data-ps="'+s+'">'+esc(CATS[SUBS[s].cat].emoji+' '+SUBS[s].name)+'</button>').join('')+'</div>'+
  '<b>Difficulty</b><div class="chips">'+[['all','All'],['easy','Easy'],['medium','Medium'],['hard','Hard']].map(([k,t])=>'<button class="chip'+(PW.diff===k?' on':'')+'" data-pd="'+k+'">'+t+'</button>').join('')+'</div>'+
  '<b>Number of questions</b><div class="chips">'+[10,20,30,40].map(n=>'<button class="chip'+(PW.n===n?' on':'')+'" data-pn="'+n+'">'+n+'</button>').join('')+'</div>'+
  '<label style="display:block;margin:8px 0"><input type="checkbox" id="pkey"'+(PW.key?' checked':'')+'> Add an answer key with explanations (new page)</label>'+
  '<label style="display:block;margin:8px 0"><input type="checkbox" id="pweak"> Put questions she got wrong first</label>'+
  '<div class="row"><button class="btn pri" id="pgo">🖨️ Print / Save as PDF</button><button class="btn" id="pshuf">🔀 New set</button></div><p class="muted" id="pinfo"></p>'+
  '<div class="row"><button class="btn" data-home>← Back</button></div></div>';
 buildPrint();
}
function buildPrint(){
 const weak=document.getElementById('pweak')&&document.getElementById('pweak').checked;
 let p=QS.filter(q=>PW.subs.includes(q.sub)&&(PW.diff==='all'||q.diff===PW.diff));
 p=shuffle(p);
 if(weak){const w=p.filter(q=>data.review[q.id]||(data.stat[q.id]&&!data.stat[q.id].last));p=w.concat(p.filter(q=>!w.includes(q)))}
 PW.list=p.slice(0,PW.n).sort((a,b)=>a.id<b.id?-1:1);
 const info=document.getElementById('pinfo');if(info)info.textContent=PW.list.length+' questions picked.';
 let h='<div class="phead"><b>P6 Science Worksheet · Unit 1 Biodiversity</b><span>Name: Ansbie &nbsp; Date: ________ &nbsp; Score: ____/'+PW.list.length+'</span></div>';
 const usedSrc={};
 PW.list.forEach((q,i)=>{
  h+='<div class="pq">';
  if(q.src&&!usedSrc[q.src]){usedSrc[q.src]=1;const s=SRC[q.src];h+='<div class="src"><b>'+esc(s.title)+'</b>'+esc(s.text)+'<span class="cite">'+esc(s.cite)+'</span></div>'}
  else if(q.src)h+='<div class="muted">(See “'+esc(SRC[q.src].title)+'” above)</div>';
  if(q.pic)h+='<div class="pic">'+esc(q.pic)+'</div>';
  if(q.svg)h+='<div class="svgbox">'+q.svg+'</div>';
  h+='<div class="stem">'+(i+1)+'. ['+TL(q)+'] '+esc(q.q)+'</div>';
  if(q.type==='mcq'||q.type==='multi')h+=q.options.map((o,j)=>'<div>　'+L[j]+'. '+esc(o)+'</div>').join('')+'<div>Answer: ________</div>';
  else if(q.type==='tf')h+='<div>Answer (✓ / ✗): ________</div>';
  else if(q.type==='order')h+=q.options.map((o,j)=>'<div>　'+L[j]+'. '+esc(o)+'</div>').join('')+'<div>Order: '+q.options.map(()=>'____').join(' → ')+'</div>';
  else if(q.type==='bank')h+='<div class="wbank">'+q.options.map(o=>'<span>'+esc(o)+'</span>').join('')+'</div>'+q.items.map((it,j)=>'<div>'+(j+1)+'. '+esc(it)+'</div>').join('');
  else if(q.type==='classify')h+=q.items.map((it,j)=>'<div>　'+L[j]+'. '+esc(it)+'</div>').join('')+q.options.map((o,j)=>'<div>'+(j+1)+'. '+esc(o)+': ____________</div>').join('');
  else if(q.type==='blanks')h+=q.items.map((it,j)=>'<div>'+esc(it.replace('____','__________'))+'</div>').join('');
  else if(q.type==='match')h+='<div style="display:flex;gap:20pt"><div>'+q.items.map((it,j)=>'<div>'+(j+1)+'. '+esc(it)+' &nbsp;____</div>').join('')+'</div><div>'+q.options.map((o,j)=>'<div>'+L[j]+'. '+esc(o)+'</div>').join('')+'</div></div>';
  else if(q.type==='short')h+='<div class="line"></div><div class="line"></div><div class="line"></div>';
  else h+='<div class="line" style="width:60%"></div>';
  h+='</div>';
 });
 if(PW.key){
  h+='<div class="pkey"><h2>Answers and explanations</h2>'+PW.list.map((q,i)=>'<div class="pq"><b>'+(i+1)+'.</b> '+answerText(q)+'<div class="muted">'+esc(q.explain)+'</div></div>').join('')+'</div>';
 }
 document.getElementById('pr').innerHTML=h;
}
// ---- events ----
app.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.diff){diffSel=t.dataset.diff;sv('diff',diffSel);home();return}
 if(t.hasAttribute('data-home')){clearInterval(tick);home();return}
 if(t.dataset.go==='print'){printSetup();return}
 if(t.dataset.go){start(t.dataset.go,{});return}
 if(t.dataset.cat){start('category',{cat:t.dataset.cat});return}
 if(t.dataset.sub){start('category',{sub:t.dataset.sub});return}
 if(t.dataset.tut){tutorial(t.dataset.tut);return}
 if(t.dataset.ps){const s=t.dataset.ps;PW.subs=PW.subs.includes(s)?PW.subs.filter(x=>x!==s):PW.subs.concat(s);if(!PW.subs.length)PW.subs=[s];printSetup();return}
 if(t.dataset.pd){PW.diff=t.dataset.pd;printSetup();return}
 if(t.dataset.pn){PW.n=+t.dataset.pn;printSetup();return}
 if(t.id==='pshuf'){buildPrint();return}
 if(t.id==='pgo'){buildPrint();window.print();return}
 if(t.dataset.o!=null&&S&&!S.done){
  const i=+t.dataset.o;
  if(S.q.type==='multi'){S.pick=S.pick.includes(i)?S.pick.filter(x=>x!==i):S.pick.concat(i);t.classList.toggle('sel')}
  else{S.pick=i;app.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel')}
  return;
 }
 if(t.id==='hintBtn'&&S){const q=S.q,box=document.getElementById('hints');
  if(S.hint<q.hints.length){box.insertAdjacentHTML('beforeend','<div class="hint">💡 Hint '+(S.hint+1)+': '+esc(q.hints[S.hint])+'</div>');S.hint++;t.textContent=S.hint<q.hints.length?'💡 Another hint ('+(q.hints.length-S.hint)+')':'📖 See key points'}
  else{box.insertAdjacentHTML('beforeend','<ul class="tut">'+SUBS[q.sub].tut.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');t.disabled=true}
  return}
 if(t.id==='sub'){submit(false);return}
 if(t.id==='next'){next();return}
});
app.addEventListener('change',e=>{if(e.target.id==='pkey'){PW.key=e.target.checked;buildPrint()}if(e.target.id==='pweak')buildPrint()});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'&&e.target.tagName==='INPUT'){e.preventDefault();if(S&&!S.done)submit(false);else if(S)next()}});
window.__sci={QS,norm,checkFill,checkShort,checkOrder,count:QS.length,TEST};
home();
</script></body></html>
