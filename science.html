<script type="application/json" id="sci-data">{"cats":{"C1":{"name":"Ch 1 Classification of Living Things","short":"Classification","color":"#2f9e44","emoji":"🦎"},"C2":{"name":"Ch 2 Plants and Environment","short":"Plants & Environment","color":"#e8590c","emoji":"🌵"},"C3":{"name":"Ch 3 Animals and Environment","short":"Animals & Environment","color":"#1c7ed6","emoji":"🐻‍❄️"}},"subs":{"C1a":{"cat":"C1","name":"Animals with backbones: the five groups","tut":["Animals can be classified into animals with backbones and animals without backbones.","Birds: have feathers, a beak, a pair of wings and a pair of legs; breathe with lungs.","Fish: have wet skin, usually covered with scales; have fins for swimming and keeping balance; breathe with gills.","Mammals: have hair on their bodies; feed their young with milk; breathe with lungs.","Reptiles (tortoises, snakes, lizards): have dry skin with dry and hard scales; breathe with lungs. Tortoises have a shell and two pairs of legs; snakes have no legs; lizards have two pairs of legs.","Amphibians (frogs, salamanders): have moist skin and no scales. The young live in water; adults live mainly on land and breathe with lungs and skin."]},"C1b":{"cat":"C1","name":"Animals without backbones & insects","tut":["Insects have three pairs of legs.","An insect's body has three parts: head, thorax and abdomen.","Insects have a pair of antennae on their heads. Some insects have one or two pairs of wings.","Jellyfish, crabs, starfish and shrimps are other animals without backbones.","Spiders have four pairs of legs, and centipedes have more than three pairs of legs, so they are NOT insects."]},"C1c":{"cat":"C1","name":"Tricky animals: look at the key features","tut":["To classify an animal, look for its distinctive characteristics. For example, female mammals feed their young with milk.","Bats have hair and a pair of wings, feed their young with milk and breathe with lungs → mammals (not birds).","Dolphins feed their young with milk, swim with fins and breathe with lungs → mammals (not fish).","Sea turtles have two pairs of limbs, a shell, dry skin and scales, and breathe with lungs → reptiles (not amphibians).","Crocodiles live in water and on land but they are reptiles, not amphibians.","Tortoises can live in water and on land, but they have dry skin and dry, hard scales and breathe only with lungs → reptiles."]},"C1d":{"cat":"C1","name":"Classifying plants","tut":["Plants can be classified into flowering plants and non-flowering plants.","Flowering plants, e.g. daffodils, roses, sunflowers. Their flowers have different shapes and colours, and they flower at different times.","Non-flowering plants, e.g. mosses, ferns, pines.","Plants can also be classified by where they grow: land plants (e.g. flame tree) and water plants (e.g. water lily).","There is a large variety of living things on Earth. We classify them according to their characteristics."]},"C2a":{"cat":"C2","name":"Environments and plant growth","tut":["The growth of plants is affected by temperature and rainfall.","Desert: a large temperature difference between day and night, and low rainfall → very few plants.","Tropical rainforest: hot all year round and high rainfall → a dense forest.","Polar region: very cold, with snow and ice all year round → very few plants.","Wetland (e.g. mangroves in Hong Kong): loose soil whose salt content and water level keep changing; the soil has little oxygen."]},"C2b":{"cat":"C2","name":"Roots","tut":["Desert plants: some have deep roots to absorb water deep in the ground; some have shallow roots that spread over a wide area to absorb water quickly (e.g. cacti).","Tropical rainforest: some trees have buttress roots to support them as they grow very tall to get more sunlight.","Wetland (mangroves): the soil has little oxygen, so some plants have aerial roots that grow above the ground to absorb oxygen from the air.","Different plants have roots with different features to adapt to the environment."]},"C2c":{"cat":"C2","name":"Stems","tut":["Desert: cacti have thick stems to store water. This helps them adapt to the dry desert.","Tropical rainforest: little sunlight reaches the ground, so climbing plants grow by twining their stems around trees to reach more sunlight.","Wetland: the soil lacks oxygen. Lotus stems grow underground and have holes to facilitate gaseous exchange."]},"C2d":{"cat":"C2","name":"Leaves","tut":["Desert (low rainfall): cacti have needle-shaped leaves to reduce water loss.","Tropical rainforest (high rainfall, dense forest with shaded areas): broad and smooth leaves shed rainwater and get more sunlight.","Wetland (mangroves, high salt content in the soil): waxy leaves help reduce water loss.","Different plants have stems and leaves with different features to adapt to the environment."]},"C2e":{"cat":"C2","name":"How plants protect themselves","tut":["Oleanders are poisonous.","Lithops look like stones.","The stems of Himalayan nettles are full of spikes.","The leaves of sensitive plants close if they are touched.","More to explore: the Forsgate Conservatory in Hong Kong Park has desert plants and tropical plants."]},"C3a":{"cat":"C3","name":"Where animals live","tut":["Different kinds of animals live in different natural environments, e.g. tropical rainforest, desert, tropical grassland and polar region.","Animals' survival depends on the climate, water supply and food supply in their habitats.","Tropical rainforests have a great variety of animals; deserts and polar regions have fewer kinds of animals.","Examples (Workbook): toucans, orangutans and tigers – tropical rainforest; camels – desert; zebras and lions – tropical grassland; polar bears and penguins – polar region."]},"C3b":{"cat":"C3","name":"Adapting to cold, hot and dry places","tut":["Polar bears: thick fur, small ears and a thick layer of fat under the skin to keep warm.","Emperor penguins: short and thick feathers, a thick layer of fat, webbed feet. Young penguins have grey feathers.","Some animals (e.g. snakes, squirrels) go into deep sleep in winter to save energy, because there is less food in winter.","Camels lose less water than other animals (they concentrate their urine).","Snails stay inactive in their shells and seal the shell mouth with mucus to reduce water loss in the hot and dry environment.","African tortoises have thick scales and hard shells to reduce water loss.","Arctic hare (cold) vs desert cottontail (hot and dry): the desert cottontail has short fur and big ears to dissipate heat."]},"C3c":{"cat":"C3","name":"How animals protect themselves","tut":["Protective colouration: body colours look like the surroundings, e.g. young harp seals (white on snow), lions, grasshoppers.","Mimicry: looking like something in the surroundings, e.g. leafy sea dragon, stick insect (like tree branches), flatfish.","Warning: porcupines (sharp quills), poison dart frogs (bright colours; the skin can release a poison), common five-ring (patterns that look like the eyes of a dangerous animal).","Living in groups: e.g. sardines, spotted deer, zebras – to defend themselves from predators.","Animals use different ways to hide from other animals, scare predators away or defend themselves from predators."]},"C3d":{"cat":"C3","name":"Features for getting food","tut":["Hummingbird: a long and narrow beak to get nectar from flowers easily.","Giraffe: tall with a long neck to reach the leaves of tall trees.","Lion: sharp teeth to tear and bite its prey.","Mantis: long and powerful forelegs lined with spikes to hold its prey firmly when it hunts.","Hawk: a sharp beak and sharp claws. Pelican: a long, large beak with a throat pouch under it. Sawfish: a saw-like structure.","Birds have beaks of different shapes which allow them to get different food.","Some animals migrate for food or reproduction."]}},"src":{"zoo":{"title":"Situation: A trip to the zoo","text":"Kelly visited a zoo and wrote down three animals.\n• Animal P has hair, a pair of wings and feeds its young with milk. It breathes with lungs.\n• Animal Q lives in the sea. It has two pairs of limbs, a shell, dry skin and scales. It breathes with lungs.\n• Animal R lives in the sea. It swims with fins, feeds its young with milk and breathes with lungs.","cite":"Based on Book 6.5 p.7"},"table":{"title":"Data: Animal X and Animal Y","text":"Animal X: has three pairs of legs · body has three parts · a pair of antennae · two pairs of wings\nAnimal Y: has four pairs of legs · no antennae · no wings\nJack says: “Both X and Y have no backbones, so they are both insects.”","cite":"Based on Book 6.5 p.6"},"cactus":{"title":"Situation: Tom's cactus","text":"Tom bought a cactus for his bedroom. He watered it every day because he thought plants need lots of water. Two weeks later the cactus became soft and its roots rotted.","cite":"Modelled on the Unit 1 test"},"fat":{"title":"Experiment: Does fat keep us warm?","text":"Mia filled plastic bag A with lard (animal fat) and left plastic bag B empty. She put one hand in each bag and then put both bags into the same bowl of ice water at the same time.","cite":"Experiment idea linked to Book 6.5 p.18–19"},"wool":{"title":"Experiment: Thick fur and heat","text":"Leo poured the same amount of hot water into two identical cups. He wrapped cup A in a thick layer of wool (like thick fur). Cup B was not wrapped. He measured the water temperature in both cups every 5 minutes.","cite":"Experiment idea linked to Book 6.5 p.18"},"wax":{"title":"Experiment: Waxy leaves","text":"Amy picked two similar leaves of the same size from the same plant. She coated leaf A with a layer of wax and left leaf B uncoated. She put both leaves on the same sunny window sill for one day.","cite":"Experiment idea linked to Book 6.5 p.13"},"worms":{"title":"Experiment: Hide and seek with colours","text":"Sam cut 20 green and 20 red paper “caterpillars” of the same size. He scattered all of them on the same green lawn. His classmates had 1 minute to pick up as many as they could.","cite":"Experiment idea linked to Book 6.5 p.20"},"rain":{"title":"Information: Three places","text":"Place X: hot all year round, high rainfall\nPlace Y: large temperature difference between day and night, low rainfall\nPlace Z: very cold, snow and ice all year round","cite":"Based on Book 6.5 p.10"}},"questions":[{"id":"C1a-01","sub":"C1a","type":"mcq","diff":"easy","q":"Which group of animals has feathers, a beak and a pair of wings?","options":["Mammals","Birds","Insects","Reptiles"],"answer":1,"hints":["Think of a sparrow.","Only one group has feathers."],"explain":"Birds have feathers, a beak, a pair of wings and a pair of legs, and breathe with lungs.","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1a-02","sub":"C1a","type":"mcq","diff":"easy","q":"Which group of animals breathes with gills?","options":["Fish","Amphibians","Reptiles","Mammals"],"answer":0,"hints":["This group lives in water all its life.","They also have fins."],"explain":"Fish breathe with gills. They have wet skin, usually covered with scales, and fins.","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1a-03","sub":"C1a","type":"mcq","q":"Which of these is a characteristic of mammals?","options":["They breathe with gills.","They feed their young with milk.","They have dry and hard scales.","They have feathers."],"answer":1,"hints":["Think of a cow and its calf.","The book says: female mammals feed their young with ____."],"explain":"Mammals have hair and feed their young with milk. They breathe with lungs.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1a-04","sub":"C1a","type":"mcq","q":"An animal has moist skin and no scales. Its young live in water. Which group does it belong to?","options":["Fish","Reptiles","Amphibians","Insects"],"answer":2,"hints":["Think of a frog and a tadpole.","Reptiles have DRY skin."],"explain":"Amphibians have moist skin and no scales. The young live in water and the adults live mainly on land.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1a-05","sub":"C1a","type":"mcq","q":"How do adult amphibians breathe?","options":["With gills only","With lungs only","With lungs and skin","With fins"],"answer":2,"hints":["Their skin is moist.","They use two body parts to breathe."],"explain":"Adult amphibians breathe with lungs and skin.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1a-06","sub":"C1a","type":"mcq","q":"Which animal is a reptile?","options":["Salamander","Lizard","Frog","Goldfish"],"answer":1,"hints":["Reptiles have dry skin and scales.","Frogs and salamanders have moist skin."],"explain":"Lizards have two pairs of legs, dry skin and scales, and breathe with lungs – they are reptiles. Frogs and salamanders are amphibians.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1a-07","sub":"C1a","type":"multi","q":"Which of these animals breathe with lungs? (There can be more than one answer.)","options":["Snake","Sparrow","Goldfish","Gorilla"],"answer":[0,1,3],"hints":["Only one group here uses gills.","Reptiles, birds and mammals all use lungs."],"explain":"Snakes (reptiles), sparrows (birds) and gorillas (mammals) breathe with lungs. Fish breathe with gills.","diff":"medium","accept":[],"fmt":"MCQ (multi)","cat":"C1"},{"id":"C1a-08","sub":"C1a","type":"tf","diff":"easy","q":"Fish have fins for swimming and keeping balance.","answer":true,"hints":["Look at the book's fish description."],"explain":"True. Fish have fins for swimming and keeping balance.","accept":[],"fmt":"True or false","cat":"C1"},{"id":"C1a-09","sub":"C1a","type":"tf","q":"Reptiles have moist skin and no scales.","answer":false,"hints":["Which group has moist skin?"],"explain":"False. Reptiles have dry skin with dry and hard scales. Amphibians have moist skin and no scales.","diff":"easy","accept":[],"fmt":"True or false","cat":"C1"},{"id":"C1a-10","sub":"C1a","type":"tf","q":"Snakes have no legs, so they cannot be reptiles.","answer":false,"hints":["Look at the reptile examples in the book."],"explain":"False. Snakes have no legs, but they have dry skin and scales and breathe with lungs, so they are reptiles.","diff":"easy","accept":[],"fmt":"True or false","cat":"C1"},{"id":"C1a-11","sub":"C1a","type":"fix","q":"Judge and correct: “Fish have dry skin and are usually covered with scales.” What should the wrong word be changed to?","answer":"wet","accept":["moist"],"hints":["Fish live in water.","Reptiles have dry skin."],"explain":"Fish have WET skin and are usually covered with scales.","diff":"medium","fmt":"Judge & correct","cat":"C1"},{"id":"C1a-12","sub":"C1a","type":"fix","q":"Judge and correct: “Birds have a pair of wings and two pairs of legs.” What should 'two pairs of legs' be changed to?","answer":"a pair of legs","accept":["one pair of legs","one pair","a pair","2 legs","two legs"],"hints":["Count a bird's legs.","Two legs = one pair."],"explain":"Birds have a pair of wings and A PAIR of legs.","diff":"medium","fmt":"Judge & correct","cat":"C1"},{"id":"C1a-13","sub":"C1a","type":"fix","q":"Judge and correct: “Tortoises have a shell, two pairs of legs, dry skin and breathe with gills.” What should the wrong word be changed to?","answer":"lungs","hints":["Tortoises are reptiles.","All reptiles breathe with the same organ."],"explain":"Tortoises breathe with LUNGS.","diff":"medium","accept":[],"fmt":"Judge & correct","cat":"C1"},{"id":"C1a-14","sub":"C1a","type":"fill","diff":"easy","q":"Mammals have ____ on their bodies and feed their young with milk.","answer":"hair","accept":["fur"],"hints":["A cat's body is covered with it."],"explain":"Mammals have hair on their bodies.","fmt":"Fill in the blank","cat":"C1"},{"id":"C1a-15","sub":"C1a","type":"fill","q":"Fish breathe with ____.","answer":"gills","hints":["Not lungs!"],"explain":"Fish breathe with gills.","diff":"easy","accept":[],"fmt":"Fill in the blank","cat":"C1"},{"id":"C1a-16","sub":"C1a","type":"bank","fmt":"Word bank","q":"Word bank: choose the correct group for each sentence. (Each word is used once; one word is not used.)","items":["____ have moist skin and do not have scales.","____ have feathers and a beak.","____ have dry skin with dry and hard scales.","____ have wet skin, fins and gills.","____ have hair and feed their young with milk."],"options":["Insects","Amphibians","Birds","Reptiles","Fish","Mammals"],"answer":[1,2,3,4,5],"hints":["Moist = amphibians; dry = reptiles.","Insects are not needed."],"explain":"Amphibians, Birds, Reptiles, Fish, Mammals.","diff":"medium","accept":[],"cat":"C1"},{"id":"C1a-17","sub":"C1a","type":"classify","fmt":"Classifying","q":"Classify the animals (Workbook style). Which group does each animal belong to?","items":["🐦 Sparrow","🐟 Goldfish","🦍 Gorilla","🐸 Frog","🐢 Tortoise","🦇 Bat"],"options":["Birds","Fish","Mammals","Reptiles","Amphibians"],"answer":[0,1,2,4,3,2],"hints":["A bat feeds its young with milk.","A tortoise has dry skin and scales."],"explain":"Sparrow – bird; goldfish – fish; gorilla – mammal; frog – amphibian; tortoise – reptile; bat – mammal.","diff":"hard","accept":[],"cat":"C1"},{"id":"C1a-18","sub":"C1a","type":"match","q":"Match each group with a characteristic.","items":["Birds","Fish","Amphibians","Reptiles"],"options":["Have moist skin and no scales","Have feathers and a beak","Have dry skin with dry, hard scales","Have fins and gills","Have three pairs of legs"],"answer":[1,3,0,2],"hints":["One option describes insects – not used."],"explain":"Birds – feathers and beak; fish – fins and gills; amphibians – moist skin, no scales; reptiles – dry skin, hard scales.","diff":"medium","accept":[],"fmt":"Matching","cat":"C1"},{"id":"C1a-19","sub":"C1a","type":"blanks","fmt":"Completing the table","q":"Complete the table: differences between amphibians and reptiles.","items":["Skin of amphibians: ____","Skin of reptiles: ____","Do amphibians have scales? (yes/no) ____","Adult amphibians breathe with lungs and ____","Reptiles breathe with ____"],"answer":["moist","dry","no","skin","lungs"] n":"Only X is an insect. Y has four pairs of legs (like a spider), so it is not an insect.","accept":[],"cat":"C1"},{"id":"C1b-12","sub":"C1b","type":"classify","fmt":"Classifying","q":"Insect or not an insect?","items":["🦋 Butterfly","🕷️ Spider","🐜 Ant","🐛 Centipede","🐝 Bee","🦀 Crab"],"options":["Insect","Not an insect"],"answer":[0,1,0,1,0,1],"hints":["Insects: 3 pairs of legs."],"explain":"Insects: butterfly, ant, bee. Not insects: spider (4 pairs of legs), centipede (more than 3 pairs), crab.","diff":"hard","accept":[],"cat":"C1"},{"id":"C1b-13","sub":"C1b","type":"short","q":"Name TWO characteristics of insects.","answer":"Insects have three pairs of legs; their bodies have three parts (head, thorax, abdomen); they have a pair of antennae; some have one or two pairs of wings. (Any two)","groups":[["three pair","3 pair","six leg","6 leg"],["head","thorax","abdomen","three part","3 part"],["antenna"],["wing"]],"need":2,"hints":["Legs, body parts, antennae, wings."],"explain":"Any two: 3 pairs of legs; head–thorax–abdomen; a pair of antennae; some have wings.","diff":"hard","accept":[],"fmt":"Short question","cat":"C1"},{"id":"C1b-14","sub":"C1b","type":"order","fmt":"Ordering","q":"Order the animals by the number of legs, from fewest to most (type the letters).","options":["Spider","Bird","Ant","Snake"],"answer":"DBCA","hints":["Snake 0, bird 2, ant 6, spider 8."],"explain":"Snake (0) → bird (2) → ant (6) → spider (8).","diff":"medium","accept":[],"cat":"C1"},{"id":"C1c-01","sub":"C1c","type":"mcq","q":"Bats can fly. Which group do bats belong to?","options":["Birds","Insects","Mammals","Reptiles"],"answer":2,"hints":["Do bats have feathers or hair?","Bats feed their young with milk."],"explain":"Bats have hair, feed their young with milk and breathe with lungs → mammals.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1c-02","sub":"C1c","type":"mcq","q":"Dolphins live in the sea and swim with fins. Why are they NOT fish?","options":["They have scales.","They feed their young with milk and breathe with lungs.","They have gills.","They have wet skin."],"answer":1,"hints":["Fish breathe with gills."],"explain":"Dolphins feed their young with milk and breathe with lungs → mammals.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1c-03","sub":"C1c","type":"mcq","q":"Sea turtles have two pairs of limbs, a shell, dry skin and scales. Which group are they in?","options":["Amphibians","Reptiles","Fish","Mammals"],"answer":1,"hints":["Dry skin + scales = ?"],"explain":"Sea turtles are reptiles, not amphibians.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1c-04","sub":"C1c","type":"tf","q":"Bats are birds because they have a pair of wings.","answer":false,"hints":["Wings are not the distinctive feature."],"explain":"False. Bats have hair and feed their young with milk → mammals.","diff":"easy","accept":[],"fmt":"True or false","cat":"C1"},{"id":"C1c-05","sub":"C1c","type":"tf","q":"Dolphins breathe with lungs.","answer":true,"hints":["They are mammals."],"explain":"True. Dolphins are mammals, so they breathe with lungs.","diff":"easy","accept":[],"fmt":"True or false","cat":"C1"},{"id":"C1c-06","sub":"C1c","type":"fix","q":"Judge and correct: “Sea turtles live in water and on land, so they are amphibians.” What should 'amphibians' be changed to?","answer":"reptiles","hints":["Look at their skin."],"explain":"Sea turtles have dry skin and scales → REPTILES.","diff":"medium","accept":[],"fmt":"Judge & correct","cat":"C1"},{"id":"C1c-07","sub":"C1c","type":"match","fmt":"Situation","src":"zoo","q":"Match each zoo animal with what it might be.","items":["Animal P","Animal Q","Animal R"],"options":["Dolphin","Bat","Sea turtle","Frog"],"answer":[1,2,0],"hints":["P has wings AND hair."],"explain":"P bat (mammal), Q sea turtle (reptile), R dolphin (mammal).","diff":"medium","accept":[],"cat":"C1"},{"id":"C1c-08","sub":"C1c","type":"multi","fmt":"Situation","src":"zoo","q":"Which of Kelly's animals are mammals? (There can be more than one answer.)","options":["Animal P","Animal Q","Animal R"],"answer":[0,2],"hints":["Which ones feed their young with milk?"],"explain":"P (bat) and R (dolphin) feed their young with milk → mammals. Q is a reptile.","diff":"medium","accept":[],"cat":"C1"},{"id":"C1c-09","sub":"C1c","type":"short","fmt":"Situation","src":"zoo","diff":"hard","q":"Kelly's brother says Animal Q must be an amphibian because it lives in water. Is he right? Explain.","answer":"No. Animal Q has dry skin and scales and breathes with lungs, so it is a reptile (a sea turtle). Amphibians have moist skin and no scales.","groups":[["no","not right","wrong","incorrect"],["dry","scale","reptile"]],"need":2,"hints":["Where an animal lives does not decide its group."],"explain":"Q is a reptile (sea turtle).","accept":[],"cat":"C1"},{"id":"C1c-10","sub":"C1c","type":"blanks","fmt":"Data analysis","q":"Animal A has a pair of legs, cannot fly, is covered with feathers and breathes with lungs. Complete the sentences.","items":["Animal A belongs to the group: ____","It is in this group because it has ____."],"answer":["birds","feathers"],"accepts":[["bird"],["feather"]],"hints":["Not flying does not matter.","Which group has feathers?"],"explain":"Animal A is a bird because it is covered with feathers.","diff":"medium","accept":[],"cat":"C1"},{"id":"C1c-11","sub":"C1c","type":"fill","q":"To classify an animal, we look for its distinctive characteristics. For example, female mammals feed their young with ____.","answer":"milk","hints":["Book p.7 Note."],"explain":"Female mammals feed their young with milk.","diff":"easy","accept":[],"fmt":"Fill in the blank","cat":"C1"},{"id":"C1c-12","sub":"C1c","type":"short","q":"Why are tortoises reptiles and not amphibians? Give ONE reason.","answer":"Tortoises have dry skin with dry and hard scales (amphibians have moist skin and no scales); tortoises breathe only with lungs (adult amphibians breathe with lungs and skin).","groups":[["dry","scale","lungs only","only lung","only with lung"]],"need":1,"hints":["Compare skin."],"explain":"Dry, scaly skin and breathing only with lungs make tortoises reptiles.","diff":"medium","accept":[],"fmt":"Short question","cat":"C1"},{"id":"C1d-01","sub":"C1d","type":"mcq","diff":"easy","q":"Which of these is a NON-flowering plant?","options":["Rose","Sunflower","Fern","Daffodil"],"answer":2,"hints":["Mosses, ferns and pines …"],"explain":"Ferns are non-flowering plants.","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1d-02","sub":"C1d","type":"mcq","diff":"easy","q":"A water lily is a ____ plant.","options":["land","water","desert","non-flowering"],"answer":1,"hints":["Where does it grow?"],"explain":"Water lilies grow in water – water plants.","accept":[],"fmt":"MCQ","cat":"C1"},{"id":"C1d-03","sub":"C1d","type":"multi","q":"Which are flowering plants? (There can be more than one answer.)","options":["Rose","Pine","Moss","Sunflower"],"answer":[0,3],"hints":["Pines and mosses are on the non-flowering list."],"explain":"Roses and sunflowers are flowering plants.","diff":"easy","accept":[],"fmt":"MCQ (multi)","cat":"C1"},{"id":"C1d-04","sub":"C1d","type":"tf","q":"Pines and mosses are non-flowering plants.","answer":true,"hints":["Book p.9."],"explain":"True.","diff":"easy","accept":[],"fmt":"True or false","cat":"C1"},{"id":"C1d-05","sub":"C1d","type":"classify","fmt":"Classifying","q":"Flowering or non-flowering?","items":["🌹 Rose","🌲 Pine","🌻 Sunflower","🌿 Fern","🌼 Daffodil","🟩 Moss"],"options":["Flowering plant","Non-flowering plant"],"answer":[0,1,0,1,0,1],"hints":["Non-flowering: mosses, ferns, pines."],"explain":"Flowering: rose, sunflower, daffodil. Non-flowering: pine, fern, moss.","diff":"hard","accept":[],"cat":"C1"},{"id":"C1d-06","sub":"C1d","type":"blanks","fmt":"Short questions","q":"How can plants be classified by WHERE they grow? Give the groups and an example of each.","items":["Group 1: ____ plants","Example: ____","Group 2: ____ plants","Example: ____"],"answer":["land","flame tree","water","water lily"],"accepts":[[],["rose","sunflower","pine"],[],["lotus"]],"hints":["One grows on land, one in water.","Book p.9 pictures."],"explain":"Land plants (e.g. flame tree) and water plants (e.g. water lily).","diff":"medium","accept":[],"cat":"C1"},{"id":"C1d-07","sub":"C1d","type":"fill","q":"Flowers of flowering plants have different shapes and colours, and they flower at different ____.","answer":"times","hints":["Some flower in spring, some in summer."],"explain":"They flower at different times.","diff":"medium","accept":[],"fmt":"Fill in the blank","cat":"C1"},{"id":"C1d-08","sub":"C1d","type":"short","q":"Why do we classify living things?","answer":"There is a large variety of living things, so we classify them according to their characteristics.","groups":[["variety","many kind","lot of","many different"],["characteristic","feature"]],"need":1,"hints":["Book p.9: there is a large ____ of living things."],"explain":"Because there is a large variety of living things; we group them by their characteristics.","diff":"medium","accept":[],"fmt":"Short question","cat":"C1"},{"id":"C2a-01","sub":"C2a","type":"mcq","diff":"easy","q":"Which two things affect the growth of plants in an environment?","options":["Temperature and rainfall","Wind and noise","Animals and people","Rocks and sand"],"answer":0,"hints":["Book p.10 Note."],"explain":"Plant growth is affected by temperature and rainfall.","accept":[],"fmt":"MCQ","cat":"C2"},{"id":"C2a-02","sub":"C2a","type":"mcq","q":"Why do very few plants grow in deserts?","options":["Hot all year round and high rainfall","Large temperature difference between day and night, and low rainfall","Snow and ice all year round","Too much shade"],"answer":1,"hints":["Deserts are dry."],"explain":"Deserts have a large day–night temperature difference and low rainfall.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C2"},{"id":"C2a-03","sub":"C2a","type":"mcq","q":"Which environment is hot all year round with high rainfall and a dense forest?","options":["Desert","Polar region","Tropical rainforest","Wetland"],"answer":2,"hints":["Lots of rain → lots of plants."],"explain":"Tropical rainforests are hot all year round with high rainfall.","diff":"easy","accept":[],"fmt":"MCQ","cat":"C2"},{"id":"C2a-04","sub":"C2a","type":"tf","q":"Very few plants grow in polar regions because they are very cold with snow and ice all year round.","answer":true,"hints":["Book p.10."],"explain":"True.","diff":"easy","accept":[],"fmt":"True or false","cat":"C2"},{"id":"C2a-05","sub":"C2a","type":"fix","q":"Judge and correct: “Very few plants grow in deserts because of the high rainfall.” What should 'high' be changed to?","answer":"low","hints":["Deserts are dry."],"explain":"Deserts have LOW rainfall.","diff":"medium","accept":[],"fmt":"Judge & correct","cat":"C2"},{"id":"C2a-06","sub":"C2a","type":"match","fmt":"Diagram","svg":"<svg viewBox=\"0 0 540 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"three places\"><rect width=\"540\" height=\"170\" rx=\"12\" fill=\"#f8f9fa\"/><rect x=\"10\" y=\"10\" width=\"165\" height=\"150\" rx=\"10\" fill=\"#d3f9d8\"/><text x=\"92\" y=\"34\" font-family=\"Arial,sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Place X<\/text><text x=\"92\" y=\"62\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">☀️ hot all year<\/text><text x=\"92\" y=\"86\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">🌧️🌧️🌧️ high rainfall<\/text><text x=\"92\" y=\"110\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">🌳🌳🌳 dense forest<\/text><rect x=\"187\" y=\"10\" width=\"165\" height=\"150\" rx=\"10\" fill=\"#fff3bf\"/><text x=\"270\" y=\"34\" font-family=\"Arial,sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Place Y<\/text><text x=\"270\" y=\"62\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">🌡️ hot day, cold night<\/text><text x=\"270\" y=\"86\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">💧 low rainfall<\/text><text x=\"270\" y=\"110\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">very few plants<\/text><rect x=\"364\" y=\"10\" width=\"165\" height=\"150\" rx=\"10\" fill=\"#e7f5ff\"/><text x=\"446\" y=\"34\" font-family=\"Arial,sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">Place Z<\/text><text x=\"446\" y=\"62\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">❄️ very cold<\/text><text x=\"446\" y=\"86\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">snow and ice all year<\/text><text x=\"446\" y=\"110\" font-family=\"Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#222\" text-anchor=\"middle\">very few plants<\/text><\/svg>","q":"Look at the three places. Match each place with its environment.","items":["Place X","Place Y","Place Z"],"options":["Polar region","Tropical rainforest","Desert","Wetland"],"answer":[1,2,0],"hints":["Dense forest = ?"],"explain":"X tropical rainforest, Y desert, Z polar region.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2a-07","sub":"C2a","type":"fill","q":"Mangroves in Hong Kong grow in wetlands. The soil is loose and its salt content and water ____ keep changing.","answer":"levels","hints":["Tides come in and go out."],"explain":"Wetland soil: loose, with changing salt content and water levels.","diff":"medium","accept":[],"fmt":"Fill in the blank","cat":"C2"},{"id":"C2a-08","sub":"C2a","type":"classify","fmt":"Classifying","q":"Which environment does each description match?","items":["Hot all year round","Low rainfall","Snow and ice all year round","Large temperature difference between day and night","High rainfall, dense forest","Loose soil with changing salt content"],"options":["Desert","Tropical rainforest","Polar region","Wetland"],"answer":[1,0,2,0,1,3],"hints":["Two descriptions each for desert and rainforest."],"explain":"Desert: low rainfall, big day–night difference. Rainforest: hot all year, high rainfall. Polar: snow and ice. Wetland: loose, salty soil.","diff":"hard","accept":[],"cat":"C2"},{"id":"C2a-09","sub":"C2a","type":"short","fmt":"Data analysis","src":"rain","q":"Which place (X, Y or Z) has the MOST plants? Explain using temperature and rainfall.","answer":"Place X (tropical rainforest), because it is hot all year round with high rainfall, which helps plants grow, so it is a dense forest.","groups":[["place x","rainforest"],["rain","hot","warm","temperature"]],"need":2,"hints":["Plants need water and warmth."],"explain":"Place X: hot and rainy all year → a dense forest.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2a-10","sub":"C2a","type":"mcq","fmt":"Fair test","q":"Ella wants to test whether the amount of water affects plant growth. Which set-up is a FAIR test?","options":["Two same plants in the same place; one gets a lot of water, one gets a little","Two different plants in different places","One plant in the sun and one in the dark, with different water","Two same plants given the same amount of water"],"answer":0,"hints":["Change ONLY the water."],"explain":"Keep everything the same except the amount of water.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2a-11","sub":"C2a","type":"fill","q":"To adapt to different environments, plants have developed different roots, stems and ____.","answer":"leaves","accept":["leaf"],"hints":["Three plant parts in Chapter 2."],"explain":"Roots, stems and leaves.","diff":"medium","fmt":"Fill in the blank","cat":"C2"},{"id":"C2b-01","sub":"C2b","type":"mcq"," e":"multi","q":"What do the broad and smooth leaves of rainforest plants help them do? (There can be more than one answer.)","options":["Reduce water loss","Shed rainwater","Get more sunlight","Store water"],"answer":[1,2],"hints":["High rainfall + shaded forest."],"explain":"Broad, smooth leaves shed rainwater and get more sunlight.","diff":"medium","accept":[],"fmt":"MCQ (multi)","cat":"C2"},{"id":"C2d-03","sub":"C2d","type":"mcq","q":"Why do mangroves have waxy leaves?","options":["The soil has a high salt content, and waxy leaves help reduce water loss.","The soil has a low salt content.","It snows a lot.","To shed rainwater."],"answer":0,"hints":["Wetland soil is salty."],"explain":"High salt content in the soil → waxy leaves reduce water loss.","diff":"medium","accept":[],"fmt":"MCQ","cat":"C2"},{"id":"C2d-04","sub":"C2d","type":"fix","q":"Judge and correct: “Mangroves have waxy leaves because of the low salt content in the soil.” What should 'low' be changed to?","answer":"high","hints":["Wetland soil is salty."],"explain":"HIGH salt content.","diff":"medium","accept":[],"fmt":"Judge & correct","cat":"C2"},{"id":"C2d-05","sub":"C2d","type":"classify","fmt":"Classifying","q":"Which function does each leaf feature have?","items":["Needle-shaped leaves (cactus)","Waxy leaves (mangrove)","Broad leaves (rainforest)","Smooth leaves (rainforest)"],"options":["Reduce water loss","Shed rainwater","Get more sunlight"],"answer":[0,0,2,1],"hints":["Broad = more surface for light."],"explain":"Needle-shaped and waxy → reduce water loss; broad → more sunlight; smooth → shed rainwater.","diff":"medium","accept":[],"cat":"C2"},{"id":"C2d-06","sub":"C2d","type":"blanks","fmt":"Completing the table","q":"Workbook style: complete the table about a cactus and a rainforest plant.","items":["Cactus – environment: ____","Cactus – ____ leaves reduce water loss","Rainforest plant – ____ leaves get more sunlight","Rainforest plant – ____ leaves shed rainwater"],"answer":["desert","nee
