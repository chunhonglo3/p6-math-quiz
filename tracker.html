function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function safeRich(s){return String(s||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=/gi,' data-blocked=');}
function asBool(v){
 if(v===true||v===1)return true;
 if(v===false||v===0||v==null||v==='')return false;
 const s=String(v).trim().toLowerCase();
 return s==='true'||s==='1'||s==='yes'||s==='y';
}
function isoHK(t){
 const d=new Date((t||Date.now())+8*3600000), p=n=>String(n).padStart(2,'0');
 return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+'T'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+'+08:00';
}
function hkParts(ms){
 const bag={};
 new Intl.DateTimeFormat('en-GB',{timeZone:HK,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'short'})
  .formatToParts(new Date(ms)).forEach(p=>{if(p.type!=='literal')bag[p.type]=p.value;});
 return bag;
}
function hkKey(ms){const p=hkParts(ms);return p.year+'-'+p.month+'-'+p.day;}
function hkMidnight(ms){const p=hkParts(ms);return Date.parse(p.year+'-'+p.month+'-'+p.day+'T00:00:00+08:00');}
function weekStart(ms){
 const mid=hkMidnight(ms);
 const wd=hkParts(mid).weekday;
 const map={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
 return mid-(map[wd]||0)*86400000;
}
function getKey(){try{return localStorage.getItem(KEY_LS)||'';}catch(e){return '';}}
function setKey(v){try{if(v)localStorage.setItem(KEY_LS,v);else localStorage.removeItem(KEY_LS);}catch(e){}}

function topicOf(category){
 const c=String(category||'').trim();
 const low=c.toLowerCase();
 if(low.indexOf('science')===0||low.startsWith('sci-')){
  const m=c.match(/C\d+/);
  const code=m?'sci-'+m[0]:'sci-?';
  const u=SCI_UNITS[code];
  return {key:code,subject:'sci',en:'Science',zh:u?u.name:c,label:u?'Science '+u.label+' '+u.name:c};
 }
 if(c.indexOf('常識')===0||low.startsWith('gs-')){
  const m=c.match(/L\d+/);
  const code=m?'gs-'+m[0]:'gs-?';
  const u=GS_UNITS[code];
  return {key:code,subject:'gs',en:'General Studies',zh:u?u.name:c,label:u?'常識 '+u.name:c};
 }
 if(low.startsWith('zh-')||low.startsWith('zh_')){
  const code=(low.match(/zh-[a-z0-9]+/)||[low.replace('_','-')])[0];
  const u=ZH_UNITS[code];
  return {key:code,subject:'zh',en:'Chinese',zh:u?u.name:c,label:u?u.name+' '+u.label:c};
 }
 const exact=TOPIC_ORDER.find(code=>TOPICS[code].en.toLowerCase()===low);
 if(exact)return packTopic(exact);
 const code=(c.match(/T\d+/)||[])[0];
 if(code&&TOPICS[code])return packTopic(code);
 const loose=TOPIC_ORDER.find(k=>low.includes(TOPICS[k].en.toLowerCase()));
 if(loose)return packTopic(loose);
 return {key:c||'?',subject:'math',en:c||'Unknown',zh:'',label:c||'未知課題'};
}
function packTopic(code){
 const t=TOPICS[code];
 return {key:code,subject:'math',en:t.en,zh:t.zh,label:t.zh+' '+t.en};
}
function modeLabel(mode){
 const m=String(mode||'');
 const map={practice:'練習 practice',quick10:'快問十題',timed:'限時 timed',review:'錯題重溫',category:'課題練習',all:'中文 · 全部單元'};
 if(map[m])return map[m];
 if(ZH_UNITS[m])return '中文 · '+ZH_UNITS[m].name;
 if(m.indexOf('zh-')===0&&ZH_UNITS[m])return '中文 · '+ZH_UNITS[m].name;
 return m||'練習';
}
function tone(ok,n){
 if(!n)return '';
 const shown=Math.round(ok/n*100);
 if(shown<60)return 'bad';
 if(shown<=80)return 'mid';
 return 'good';
}
function pctText(ok,n){return n?Math.round(ok/n*100)+'%':'—';}
function fmtMin(sec){
 const m=sec/60;
 if(m<0.05)return '0 分鐘';
 if(m<1)return Math.round(sec)+' 秒';
 const r=Math.round(m*10)/10;
 return (Math.abs(r-Math.round(r))<0.05?String(Math.round(r)):r.toFixed(1))+' 分鐘';
}
function fmtDur(sec){
 sec=Math.round(Math.max(0,sec));
 if(sec<60)return sec+' 秒';
 const m=Math.floor(sec/60), s=sec%60;
 if(m<60)return s?m+' 分 '+s+' 秒':m+' 分鐘';
 const h=Math.floor(m/60);
 return h+' 小時 '+(m%60)+' 分';
}
function agoText(ms,now){
 const d=now-ms;
 if(!isFinite(d)||d<60000)return '剛剛';
 if(d<3600000)return Math.floor(d/60000)+' 分鐘前';
 if(d<86400000)return Math.floor(d/3600000)+' 小時前';
 return Math.floor(d/86400000)+' 日前';
}
function whenText(ms,now){
 const p=hkParts(ms);
 const clock=p.hour+':'+p.minute;
 const key=hkKey(ms), today=hkKey(now), yest=hkKey(hkMidnight(now)-86400000);
 if(key===today)return '今日 '+clock;
 if(key===yest)return '昨日 '+clock;
 return p.month+'月'+p.day+'日 '+clock;
}
function rowKey(r){return [r.timestamp,r.session_id,r.question_id,r.answer_given,r.correct?'1':'0',r.hint?'1':'0'].join('|');}
function normalise(raw){
 if(!raw||typeof raw!=='object')return null;
 const user=String(raw.user==null?'':raw.user).trim().toLowerCase();
 if(user!=='ansbie')return null;
 const time=Number(raw.time_sec);
 const ts=Date.parse(raw.timestamp);
 return {
  timestamp:String(raw.timestamp||''),
  ts:isFinite(ts)?ts:NaN,
  session_id:String(raw.session_id||''),
  mode:String(raw.mode||''),
  question_id:String(raw.question_id||''),
  category:String(raw.category||''),
  difficulty:String(raw.difficulty||''),
  correct:asBool(raw.correct),
  hint:asBool(raw.hint_used),
  time:isFinite(time)&&time>0?time:0,
  answer_given:String(raw.answer_given==null?'':raw.answer_given),
  user:'ansbie'
 };
}
function normaliseList(raws){
 const out=[], seen=new Set();
 (raws||[]).forEach(raw=>{
  const row=normalise(raw);
  if(!row)return;
  const k=rowKey(row);
  if(seen.has(k))return;
  seen.add(k);
  out.push(row);
 });
 out.sort((a,b)=>(a.ts||0)-(b.ts||0));
 return out;
}
function setRaw(raws){
 const prevKeys=new Set(ROWS.map(rowKey));
 const prevSessions=new Set(ROWS.map(r=>r.session_id));
 const next=normaliseList(raws);
 const fresh=next.filter(r=>!prevKeys.has(rowKey(r)));
 ROWS=next;
 return {fresh,prevSessions};
}
function addRaw(raws){
 const prevKeys=new Set(ROWS.map(rowKey));
 const prevSessions=new Set(ROWS.map(r=>r.session_id));
 const map=new Map(ROWS.map(r=>[rowKey(r),r]));
 normaliseList(raws).forEach(r=>map.set(rowKey(r),r));
 const next=[...map.values()].sort((a,b)=>(a.ts||0)-(b.ts||0));
 const fresh=next.filter(r=>!prevKeys.has(rowKey(r)));
 ROWS=next;
 return {fresh,prevSessions};
}
function tally(rows){
 const n=rows.length, ok=rows.filter(r=>r.correct).length;
 const hints=rows.filter(r=>r.hint).length;
 const sec=rows.reduce((s,r)=>s+Math.min(CAP_SEC,Math.max(0,r.time)),0);
 const zh=rows.filter(r=>topicOf(r.category).subject==='zh').length;
 const gs=rows.filter(r=>topicOf(r.category).subject==='gs').length;
 const sci=rows.filter(r=>topicOf(r.category).subject==='sci').length;
 return {n,ok,hints,sec,math:n-zh-gs-sci,zh,gs,sci,pct:pctText(ok,n)};
}
function inWindow(r,start,end){return isFinite(r.ts)&&r.ts>=start&&r.ts<end;}
function groupSessions(rows){
 const named=new Map();
 const loose=[];
 rows.forEach(r=>{
  const id=r.session_id&&r.session_id!=='none'?r.session_id:'';
  if(id){if(!named.has(id))named.set(id,[]);named.get(id).push(r);}
  else loose.push(r);
 });
 const sessions=[...named.values()];
 loose.sort((a,b)=>(a.ts||0)-(b.ts||0));
 let cur=[];
 loose.forEach(r=>{
  if(!cur.length||(isFinite(r.ts)&&isFinite(cur[cur.length-1].ts)&&r.ts-cur[cur.length-1].ts<=20*60*1000))cur.push(r);
  else{sessions.push(cur);cur=[r];}
 });
 if(cur.length)sessions.push(cur);
 sessions.forEach(s=>s.sort((a,b)=>(a.ts||0)-(b.ts||0)));
 sessions.sort((a,b)=>(b[b.length-1].ts||0)-(a[a.length-1].ts||0));
 return sessions;
}
function sessionSec(rows){
 const sum=rows.reduce((s,r)=>s+Math.max(0,r.time),0);
 if(sum>0)return sum;
 const a=rows[0].ts,b=rows[rows.length-1].ts;
 if(isFinite(a)&&isFinite(b))return Math.max(0,(b-a)/1000);
 return 0;
}
function sessionTopics(rows){
 const labels=[];
 rows.forEach(r=>{
  const t=topicOf(r.category).label;
  if(labels.indexOf(t)<0)labels.push(t);
 });
 if(labels.length<=2)return labels.join('、')||'—';
 return labels.slice(0,2).join('、')+'等';
}
function markWeak(topics){
 const ranked=topics.filter(t=>t.n>0).slice().sort((a,b)=>(a.ok/a.n)-(b.ok/b.n)||b.n-a.n);
 const flags=new Set();
 ranked.forEach(t=>{if(t.n>=3&&t.ok/t.n<0.6)flags.add(t.key);});
 let added=0;
 ranked.forEach(t=>{
  if(added>=3)return;
  if(Math.round(t.ok/t.n*100)<=80){flags.add(t.key);added++;}
 });
 return flags;
}
function meaningOf(unit,word){
 const u=ZH.units&&ZH.units[unit];
 if(!u||!u.words)return '';
 const w=u.words.find(x=>x.word===word);
 return w?w.meaning:'';
}
function optionSvgs(raw){
 const o=raw.option_svgs;
 if(!o)return null;
 if(Array.isArray(o))return o;
 if(typeof o==='object')return ['A','B','C','D'].map(k=>o[k]||'');
 return null;
}
function lineSvg(d){
 const W=360,H=270,left=48,right=14,bottom=46;
 const multi=d.series.length>1, top=multi?48:28;
 const plotH=H-top-bottom, plotW=W-left-right;
 const yMin=d.y_min, yMax=d.y_max, step=d.y_step||1;
 const yOf=v=>top+(yMax-v)/(yMax-yMin||1)*plotH;
 const n=d.x_labels.length;
 const xOf=i=>left+(n<=1?plotW/2:(i/(n-1))*plotW);
 const ticks=[];
 for(let i=0,lim=Math.round((yMax-yMin)/step);i<=lim;i++)ticks.push(Math.round((yMin+i*step)*1000)/1000);
 const colors=['#d6336c','#4263eb'];
 const tick=v=>Math.abs(v-Math.round(v))<1e-6?String(Math.round(v)):String(v);
 let s='<svg viewBox="0 0 '+W+' '+H+'" font-size="11" font-family="sans-serif" role="img">';
 s+='<text x="'+(W/2)+'" y="16" text-anchor="middle" font-weight="bold">'+esc(d.title)+'</text>';
 if(multi){
  let lx=left;
  d.series.forEach((ser,si)=>{
   s+='<rect x="'+lx+'" y="22" width="12" height="8" rx="2" fill="'+colors[si%colors.length]+'"/>';
   s+='<text x="'+(lx+16)+'" y="30">'+esc(ser.name)+'</text>';
   lx+=16+ser.name.length*6.4+16;
  });
 }
 ticks.forEach(v=>{
  const y=yOf(v);
  s+='<line x1="'+left+'" x2="'+(W-right)+'" y1="'+y+'" y2="'+y+'" stroke="#eee"/>';
  s+='<text x="'+(left-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="9">'+tick(v)+'</text>';
 });
 d.series.forEach((ser,si)=>{
  const col=colors[si%colors.length];
  const pts=ser.values.map((v,i)=>xOf(i)+','+yOf(v)).join(' ');
  s+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>';
  ser.values.forEach((v,i)=>{s+='<circle cx="'+xOf(i)+'" cy="'+yOf(v)+'" r="3.5" fill="'+col+'"/>';});
 });
 d.x_labels.forEach((lab,i)=>{s+='<text x="'+xOf(i)+'" y="'+(H-24)+'" text-anchor="middle">'+esc(lab)+'</text>';});

function chartSvg(days){

 days.forEach((d,i)=>{
  const x=i*gap+gap/2;
  const bh=d.n?(d.n/max)*(base-top-10):0;
  const okH=d.n?bh*(d.ok/d.n):0;
  const badH=bh-okH;
  const y=base-bh;
  const tip=d.label+' · '+d.n+' 題 · 對 '+d.ok;
  if(d.n){
   s+='<rect x="'+(x-6).toFixed(1)+'" y="'+(y+badH).toFixed(1)+'" width="12" height="'+Math.max(0,okH).toFixed(1)+'" rx="2" fill="#40c057"><title>'+esc(tip)+'</title></rect>';

   s+='<text x="'+x.toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle" font-size="9" fill="#555">'+d.n+'</text>';
  }else s+='<rect x="'+(x-6).toFixed(1)+'" y="'+(base-2)+'" width="12" height="2" fill="#ffe3ec"></rect>';

function toast(title,body){
 const box=document.getElementById('toastbox');

 el.className='toast';
 el.innerHTML='<b>'+esc(title)+'</b><div>'+esc(body)+'</div>';

}
function ping(title,body){
 toast(title,body);
 if(window.Notification&&Notification.permission==='granted'){
  try{new Notification(title,{body:body});}catch(e){}
 }
}
function announce(fresh,prevSessions){
 if(!seeded){seeded=true;return;}
 if(!fresh||!fresh.length)return;
 const seen=new Set();
 fresh.forEach(r=>{
  if(prevSessions.has(r.session_id)||seen.has(r.session_id))return;
  seen.add(r.session_id);
  const t=topicOf(r.category);
  ping('Ansbie 開始練習',(t.zh||t.en)+' · '+modeLabel(r.mode));
 });
 const wrong=fresh.filter(r=>!r.correct);
 if(wrong.length===1){
  const r=wrong[0], t=topicOf(r.category);
  ping('答錯咗',(t.zh||t.en)+' · '+r.question_id+(r.answer_given?' · 她寫 '+r.answer_given:''));
 }else if(wrong.length>1){
  const r=wrong[wrong.length-1];
  ping('新嘅錯題',wrong.length+' 題答錯，最新係 '+r.question_id);
 }
}
async function fetchRows(key){
 const base=SYNC_URL+'?rk='+encodeURIComponent(key);
 // Apps Script usually answers a browser fetch with a redirect the page cannot read.
 // Try once, then remember to use JSONP, which follows that redirect.
 if(!preferJsonp){
  try{
   const ctrl=typeof AbortController==='function'?new AbortController():null;
   const timer=ctrl?setTimeout(()=>ctrl.abort(),4000):0;
   const r=await fetch(base,{cache:'no-store',redirect:'follow',signal:ctrl?ctrl.signal:undefined});
   if(timer)clearTimeout(timer);
   const t=await r.text();
   const trimmed=t.trim();
   if(trimmed.charAt(0)==='{')return JSON.parse(trimmed);
  }catch(e){}
  preferJsonp=true;
 }
 return jsonp(base);
}
function jsonp(base){
 return new Promise((resolve,reject)=>{
  const cb='p6cb_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const s=document.createElement('script');
  let done=false;
  const timer=setTimeout(()=>finish(new Error('timeout')),20000);
  function finish(err,data){
   if(done)return;
   done=true;
   clearTimeout(timer);
   try{delete window[cb];}catch(e){}
   s.remove();
   if(err)reject(err);else resolve(data);
  }
  window[cb]=data=>finish(null,data);
  s.onerror=()=>finish(new Error('jsonp'));
  s.src=base+'&callback='+cb;
  document.head.appendChild(s);
 });
}
async function refresh(){
 if(DEMO){lastUpdated=Date.now();lastError='';render();return;}
 if(!getKey()){renderGate(gateMsg,gateValue);return;}
 if(pulling)return;
 pulling=true;
 render();
 try{
  const data=await fetchRows(getKey());
  if(!data||data.ok===false){
   const why=data&&data.error==='unauthorized'?'unauthorized':'bad';
   throw new Error(why);
  }
  if(!Array.isArray(data.rows))throw new Error('bad');
  warning=data.warning?('讀取密碼仍然係預設值。請喺 Apps Script 改 READ_KEY，再用 New version 部署。'):'';
  const info=setRaw(data.rows);
  loadedOnce=true;
  announce(info.fresh,info.prevSessions);
  lastUpdated=Date.now();
  lastError='';
 }catch(e){
  if(String(e.message)==='unauthorized'){
   gateValue=getKey();
   gateMsg='密碼唔啱，請再試。The read key was not accepted.';
   setKey('');
   seeded=false;
   loadedOnce=false;
   ROWS=[];
  }else if(!ROWS.length){
   lastError='連唔到試算表。請確認已將 doGet 貼上，並且用 Manage deployments → Edit → New version 部署，/exec 網址先會更新。';
  }else{
   lastError='今次更新失敗，下面仍然係上次成功讀到的紀錄。';
  }
 }finally{
  pulling=false;
  render();
 }
}
function saveKey(){
 const input=document.getElementById('rk');
 const v=input?input.value.trim():'';
 if(!v){gateMsg='請輸入密碼。';gateValue='';renderGate(gateMsg,'');return;}
 gateMsg='';
 gateValue='';
 setKey(v);
 refresh();
}

function indexQuestions(){
 BY_ID={};
 (typeof CLASSIC_Q!=='undefined'?CLASSIC_Q:[]).forEach(q=>{BY_ID[q.id]={kind:'classic',q};});
 (BANK.questions||[]).forEach(raw=>{BY_ID[raw.id]={kind:'bank',raw};});
 (ZH.questions||[]).forEach(q=>{BY_ID[q.id]={kind:'zh',q};});
 (GS.questions||[]).forEach(q=>{BY_ID['gs-'+q.id]={kind:'gs',q};});
 (SCI.questions||[]).forEach(q=>{BY_ID['sci-'+q.id]={kind:'sci',q};});
}
async function loadQuestions(){
 try{
  const [bankRes,zhRes]=await Promise.all([fetch('question_bank.json'),fetch('chinese.html')]);
  if(!bankRes.ok||!zhRes.ok)throw new Error('load');
  BANK=await bankRes.json();
  const zhText=await zhRes.text();
  const open=zhText.indexOf('id="zh-data">');
  const from=open<0?-1:zhText.indexOf('>',open)+1;
  const end=from<0?-1:zhText.indexOf('<'+'/script>',from);
  if(from<0||end<0)throw new Error('zh-data');
  ZH=JSON.parse(zhText.slice(from,end));
 }catch(e){
  qNote='有部分題目檔未載入，錯題可能只顯示題號。';
 }
 try{
  const gsRes=await fetch('gs.html');
  if(!gsRes.ok)throw new Error('gs');
  const gsText=await gsRes.text();
  const open=gsText.indexOf('id="gs-data">');
  const from=open<0?-1:gsText.indexOf('>',open)+1;
  const end=from<0?-1:gsText.indexOf('<'+'/script>',from);
  if(from<0||end<0)throw new Error('gs-data');
  GS=JSON.parse(gsText.slice(from,end));
 }catch(e){
  qNote='有部分題目檔未載入，錯題可能只顯示題號。';
 }
 try{
  const sciRes=await fetch('science.html');
  if(!sciRes.ok)throw new Error('sci');
  const sciText=await sciRes.text();
  const open=sciText.indexOf('id="sci-data">');
  const from=open<0?-1:sciText.indexOf('>',open)+1;
  const end=from<0?-1:sciText.indexOf('<'+'/script>',from);
  if(from<0||end<0)throw new Error('sci-data');
  SCI=JSON.parse(sciText.slice(from,end));
 }catch(e){
  qNote='有部分題目檔未載入，錯題可能只顯示題號。';
 }
 indexQuestions();
}
function takeRkFromUrl(){
 const rk=params.get('rk');
 if(!rk)return;
 setKey(rk);
 try{
  const u=new URL(location.href);
  u.searchParams.delete('rk');
  history.replaceState(null,'',u.pathname+u.search+u.hash);
 }catch(e){}
}
async function boot(){
 takeRkFromUrl();
 app.innerHTML='<div class="card"><p class="pick">載入題目…</p></div>';
 await loadQuestions();
 window.__p6.ready=true;
 window.__p6.zhCount=(ZH.questions||[]).length;
 window.__p6.gsCount=(GS.questions||[]).length;
 window.__p6.sciCount=(SCI.questions||[]).length;
 window.__p6.bankCount=(BANK.questions||[]).length;
 window.__p6.classicCount=(typeof CLASSIC_Q!=='undefined'?CLASSIC_Q.length:0);
 if(DEMO){
  const info=setRaw(demoRows());
  announce(info.fresh,info.prevSessions);
  lastUpdated=Date.now();
  render();
  return;
 }
 if(getKey())refresh();
 else renderGate('','');
}
window.__p6={

 isoHK, asBool, fmtMin, get rows(){return ROWS;}, ready:false, zhCount:0, bankCount:0, classicCount:0,
 refresh, simulate
};
setInterval(()=>{if(getKey()||DEMO)refresh();},POLL_MS);
boot();
