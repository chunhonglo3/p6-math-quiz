</style></head><body><div class="w"><h1>🌸 P6 Maths Practice</h1><div id="app"></div></div>
<div id="watch" class="overlay" hidden><div class="overlay-card"><img id="watchimg" alt="" width="480" height="270"><p id="watchcap" class="pick"></p><p class="overlay-tap">Tap to close</p></div></div>
<script>
const G='<svg viewBox="0 0 340 250" font-size="11" font-family="sans-serif"><text x="170" y="14" text-anchor="middle" font-weight="bold">Number of Books Borrowed</text>'+
(()=>{let s='';for(let v=0;v<=100;v+=10){let y=220-v*1.9;s+=`<line x1="40" x2="330" y1="${y}" y2="${y}" stroke="#ddd"/><text x="34" y="${y+4}" text-anchor="end">${v}</text>`}
const d=[35,50,45,70,60],n=['Mon','Tue','Wed','Thu','Fri'];let p=d.map((v,i)=>`${70+i*60},${220-v*1.9}`).join(' ');
s+=`<polyline points="${p}" fill="none" stroke="#d6336c" stroke-width="2.5"/>`;d.forEach((v,i)=>{s+=`<circle cx="${70+i*60}" cy="${220-v*1.9}" r="4" fill="#d6336c"/><text x="${70+i*60}" y="236" text-anchor="middle">${n[i]}</text>`});
return s+'<line x1="40" x2="40" y1="20" y2="220" stroke="#333"/><line x1="40" x2="330" y1="220" y2="220" stroke="#333"/><text x="185" y="249" text-anchor="middle">Day</text><text x="10" y="120" transform="rotate(-90 10 120)" text-anchor="middle">No. of books</text>'})()+'</svg>';
const CATS=[
['T9','Average'],
['T12','Water level'],
['T13','3-D shapes'],
['T16','Money & charges'],
['T8','Fraction word problem'],
['T17','Line graph'],
['T5','Remainder'],
['T6','Factors'],
['T4','Decimal computation'],
['T14','2-D shapes'],
['T7','Fractions'],
['T10','Units'],
['T11','Volume'],
['T2','Rounding'],
['T1','Whole numbers'],
['T15','Algebra'],
['T3','Decimals'],
['T18','Length & mass'],
['T19','Directions']
];
const CN=Object.fromEntries(CATS);
const VIDEOS=[
{cat:'T9',title:'Average',note:'New average and a missing value',file:'animations/1-average.gif'},
{cat:'T12',title:'Water level',note:'Displacement and the water height',file:'animations/2-water.gif'},
{cat:'T8',title:'Fraction word problem',note:'Fraction of the remainder',file:'animations/3-fraction-remainder.gif'},
{cat:'T16',title:'Money & charges',note:'Taxi fare, step by step',file:'animations/4-taxi.gif'},
{cat:'T13',title:'3-D shapes',note:'Edges, vertices and solids',file:'animations/5-shapes-3d.gif'},
{cat:'T5',title:'Remainder',note:'Division with a remainder',file:'animations/6-decimal-remainder.gif'}
];
const VID=Object.fromEntries(VIDEOS.map(v=>[v.cat,v]));
function openVid(cat){
 const v=VID[cat]; if(!v)return;
 const img=document.getElementById('watchimg');
 document.getElementById('watchcap').textContent=v.title+' · '+v.note;
 img.alt=v.title+' walkthrough';
 img.src=v.file;
 document.getElementById('watch').hidden=false;
 document.body.classList.add('noscroll');
}
function closeVid(){
 const ov=document.getElementById('watch'); if(!ov||ov.hidden)return;
 ov.hidden=true;
 document.getElementById('watchimg').removeAttribute('src');
 document.body.classList.remove('noscroll');
}
function bindWatch(root){(root||document).querySelectorAll('[data-watch]').forEach(b=>{b.onclick=e=>{e.stopPropagation();openVid(b.dataset.watch)}})}
document.getElementById('watch').onclick=closeVid;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVid()});
const M=(id,cat,q,o,a,w,tips)=>({id,cat,t:'m',q,o,a,w,tips});
const S=(id,cat,q,a,w,h,tips)=>({id,cat,t:'s',q,a,w,h,tips});
const Q=[
M('A1','T2','The population of a town is 2,560,000 (correct to the nearest ten thousand). Which can be the actual population?',['2,554,980','2,565,210','2,556,413','2,549,999'],2,'Range is 2,555,000 ≤ n &lt; 2,565,000. Only 2,556,413 is in the range.',['“Nearest ten thousand” means a range.','Step half of 10,000 down, and up to the next cut-off.','Keep the choice that sits inside the range.']),
M('A2','T1','In 863,584, what is the difference between the values of the two ‘8’s?',['799,920','799,992','720,000','800,080'],0,'800,000 − 80 = 799,920.',['Find both 8s.','Write each 8 as its place value.','Subtract the smaller value from the bigger one.']),
M('A3','T6','‘★’ is a missing digit of the 3-digit number 52★. The number is divisible by both 3 and 4. What is ★?',['0','4','6','8'],3,'Divisible by 4: 520, 524, 528. Digit sum divisible by 3: 5+2+8 = 15 ✓. So ★ = 8.',['For ÷ 4, check the last two digits.','Keep only the choices that pass.','Then keep the one whose digits add up for ÷ 3.']),
M('A4','T5','A bottle holds 2.35 L of water, poured into cups of 0.3 L each. At most how many cups can be filled, and how much is left?',['7 … 0.25 L','7 … 0.025 L','8 … 0.05 L','7 … 2.5 L'],0,'7 × 0.3 = 2.1; 2.35 − 2.1 = 0.25 L.',['Divide the water by one cup.','“At most” means whole cups only.','Leftover = start − cups × 0.3.']),
M('A5','T4','When calculating 4.86 ÷ 0.6, Leo mistakenly worked out 486 ÷ 6. How many times the correct answer was Leo’s answer?',['0.1','10','100','1000'],1,'Correct: 8.1. Leo: 81. 81 ÷ 8.1 = 10.',['Work out the real division.','Work out Leo’s division too.','His answer ÷ the real answer = how many times.']),
M('A6','T4','Which expression has the smallest value?',['2.4 ÷ 0.4','0.24 ÷ 4','24 ÷ 0.4','0.24 ÷ 0.04'],1,'Values: 6, 0.06, 60, 6. Smallest is 0.06.',['Work out all four divisions.','Write the four results in a line.','Circle the smallest.']),
M('A7','T4','5.3 ÷ 0.7 = ?',['7.5 (1 d.p.)','7.56 (2 d.p.)','7.58 (2 d.p.)','7.6 (1 d.p.)'],3,'53 ÷ 7 = 7.5714… → 7.6 (1 d.p.) or 7.57 (2 d.p.).',['Shift the dots: 53 ÷ 7.','Keep dividing past the decimal point.','Round the way each choice asks.']),
M('A8','T9','Which group of numbers has an average of 15?',['12, 14, 16, 20','13, 14, 16, 17','10, 15, 20, 25','11, 13, 15, 19'],1,'Sums ÷ 4: 62÷4=15.5; 60÷4=15 ✓; 70÷4=17.5; 58÷4=14.5.',['Add the four numbers.','Divide that total by 4.','Find the group whose average is 15.']),
M('A9','T9','A choir has 8 members with average age 11.5. Two new members aged 12 and 16 join. What is the new average age?',['11.75','12.5','12','14'],2,'8 × 11.5 = 92. 92 + 12 + 16 = 120. 120 ÷ 10 = 12.',['Old total = people × old average.','Add the two new ages.','New average = new total ÷ new number of people.']),
M('A10','T9','A number is removed from 14, 20, 26, 32 and the average increases by 3. Which number is removed?',['14','20','26','32'],0,'Average 92 ÷ 4 = 23. New average 26 × 3 = 78. Removed 92 − 78 = 14.',['Find the old average, then add 3.','Totals = average × how many numbers.','Removed = old total − new total.']),
M('A11','T8','There were 84 students. 3/7 of them joined the art club, and 1/4 of the art club members were boys. How many girls were in the art club?',['9','27','36','48'],1,'Art club 84 × 3/7 = 36. Boys 36 × 1/4 = 9. Girls 36 − 9 = 27.',['Art club = everyone × 3/7.','Boys = art club × 1/4.','Girls = art club − boys.']),
M('A12','T8','There were 120 cards. 2/5 were red, and 3/4 of the red cards were torn. Which expression gives the number of torn red cards?',['120 × (2/5 + 3/4)','120 × 2/5 × (1 − 3/4)','120 × (1 − 2/5) × 3/4','120 × 2/5 × 3/4'],3,'Red = 120 × 2/5; torn red = 120 × 2/5 × 3/4 = 36.',['First take the fraction that are red.','Then take the fraction of those that are torn.','Match that story to one expression.']),
M('A13','T7','Which of the following is correct?',['2/3 &lt; 5/8','3/4 &gt; 7/9','5/6 = 15/18','4/5 &lt; 7/9'],2,'5/6 = 15/18 ✓. (2/3 = 16/24 &gt; 15/24; 3/4 = 27/36 &lt; 28/36; 4/5 = 36/45 &gt; 35/45.)',['Test one statement at a time.','Make fractions with the same denominator.','Keep the statement that is true.']),
M('A14','T13','Which solid has the same number of edges as a hexagonal pyramid?',['Pentagonal prism','Hexagonal prism','Rectangular prism','Heptagonal pyramid'],2,'Hexagonal pyramid: 2 × 6 = 12 edges. Rectangular prism also has 12 (others: 15, 18, 14).',['A pyramid’s edges = 2 × the base sides.','Count the edges of each choice.','Find the solid with the same count.']),
M('A15','T13','Alice uses exactly 12 sticks and 8 plasticine balls to make a 3-D model. What could it be?',['Triangular prism','Pentagonal pyramid','Hexagonal pyramid','Cube'],3,'Sticks = edges, balls = vertices. Cube: 12 edges, 8 vertices.',['Sticks are edges. Balls are vertices.','Count edges and vertices for each solid.','Match both counts to the sticks and balls.']),
M('A16','T13','A triangular prism is cut by a plane parallel to its triangular base. What is the shape of the cross-section?',['Rectangle','Triangle','Trapezium','Square'],1,'A cut parallel to the base gives the same shape as the base: a triangle.',['The cut is parallel to the base.','A parallel cut copies the base’s shape.','Name that same shape.']),
M('A17','T12','A rectangular tank has a base of 20 cm × 15 cm with water 8 cm deep. A stone sinks completely and the level rises to 10 cm. Volume of the stone?',['600 cm³','2,400 cm³','3,000 cm³','6,000 cm³'],0,'Rise 2 cm. 20 × 15 × 2 = 600 cm³.',['See how many cm the water rose.','That rise equals the stone’s volume.','Volume = length × width × rise.']),
M('A18','T10','3.06 L = ?',['306 mL','3,006 cm³','3,060 cm³','30.6 mL'],2,'1 L = 1000 cm³, so 3.06 L = 3,060 cm³.',['1 L = 1,000 cm³.','1 L is also 1,000 mL.','Multiply by 1,000, then match the unit.']),
M('A19','T14','A trapezium has upper base 6 cm, lower base 14 cm and height 5 cm. What is its area?',['50 cm²','70 cm²','100 cm²','420 cm²'],0,'(6 + 14) × 5 ÷ 2 = 50 cm².',['Add the top base and the bottom base.','Multiply by the height.','Then divide by 2.']),
M('A20','T15','A pen costs $x. A book costs $5 more than 3 times the price of the pen. How much do 1 pen and 1 book cost altogether?',['$(3x + 5)','$(4x − 5)','$(4x + 5)','$(3x + 6)'],2,'Book = 3x + 5. Total = x + 3x + 5 = 4x + 5.',['Write the book as 3 times the pen, plus 5.','The pen is x.','Add pen + book, then join the x terms.']),
S('B1','T6','What is the least number to be added to 2,345 so that it is divisible by 9?',4,'Digit sum 14; next multiple of 9 is 18 → add 4.','',['Add the digits of 2,345.','÷ 9 needs a digit sum of 9, 18, 27…','Jump to the next one. The gap is what you add.']),
S('B2','T6','List all the common factors of 48 and 60.',{set:[1,2,3,4,6,12]},'48: 1,2,3,4,6,8,12,16,24,48. 60: 1,2,3,4,5,6,10,12,15,20,30,60. Common: 1, 2, 3, 4, 6, 12.','Separate with commas',['List every factor of 48.','List every factor of 60.','Write only the numbers in both lists.']),
S('B3','T2','Round off 3,684,520 g to the nearest 10 kg. (answer in kg)',3680,'3,684,520 g = 3,684.52 kg → 3,680 kg.','Answer in kg',['Change grams into kilograms first.','You need the nearest 10 kg.','Look at the ones digit, then round.']),
S('B4','T9','The average of P, Q, R and S is 60. The average of R and S is 75. P is 12 more than Q. Find P.',51,'P+Q+R+S = 240; R+S = 150; P+Q = 90; Q = (90 − 12) ÷ 2 = 39; P = 51.','',['Four-number total = average × 4.','R + S = their average × 2. P + Q is what’s left.','P is 12 more than Q. Split that pair.']),
S('B5','T9','Mandy’s average mark in 4 tests is 82. She wants an average of 84 or above after the 5th test. At least how many marks must she get in the 5th test?',92,'84 × 5 = 420. 82 × 4 = 328. 420 − 328 = 92.','',['Target total = wanted average × 5.','Marks so far = her average × 4.','5th test = target − marks so far.']),
S('B6a','T5','15.4 L of soup is poured into bowls of 0.45 L each. At most how many bowls can be filled?',34,'15.4 ÷ 0.45 = 34 r 0.1 (34 × 0.45 = 15.3).','',['Divide the soup by one bowl.','“At most” keeps whole bowls only.','Bowls × 0.45 must not go past 15.4.']),
S('B6b','T5','15.4 L of soup is poured into bowls of 0.45 L each, filling as many bowls as possible. How much soup is left (in L)?',0.1,'34 × 0.45 = 15.3; 15.4 − 15.3 = 0.1 L.','Answer in L',['First find how many full bowls fit.','Soup used = bowls × 0.45.','Left = soup you started with − soup used.']),
S('B7','T5','9.5 kg of rice is packed into bags. Each bag holds 1.2 kg. How many bags are needed to pack all the rice?',8,'9.5 ÷ 1.2 = 7 r 1.1 → 7 full bags + 1 more = 8 bags (round UP!).','',['Divide the rice by one bag.','A leftover still needs its own bag.','Round up. Do not drop the remainder.']),
S('B8','T7','2 3/4 − 1 5/6 + 3 1/3 = ?',{frac:[51,12]},'= 33/12 − 22/12 + 40/12 = 51/12 = 4 1/4.','e.g. 4 1/4 or 17/4',['Turn each mixed number into a fraction.','Use twelfths for all three.','Do the minus, then the plus. Simplify.']),
S('B9','T8','A shop had 360 eggs. 5/12 were sold in the morning and 3/7 of the remaining eggs were sold in the afternoon. How many eggs were left?',120,'Morning 150; remaining 210. Afternoon 210 × 3/7 = 90. Left 120.','',['Morning sold = all eggs × 5/12.','Subtract to get the remaining eggs.','Afternoon = remaining × 3/7. Then subtract again.']),
S('B10','T12','An open wooden box (no cover) measures 22 cm × 17 cm × 9 cm outside. The wood is 1 cm thick. What is the capacity of the box in mL?',2400,'Inner: (22−2) × (17−2) × (9−1) = 20 × 15 × 8 = 2,400 cm³ = 2,400 mL.','Answer in mL',['There is no lid, and the wood is 1 cm thick.','Length and width lose 1 cm on each side.','Height loses 1 cm on the bottom only. Then multiply.']),
S('B11','T12','A rectangular tank is 30 cm long and 20 cm wide, with water 12 cm deep. After 6 identical iron balls are put in (fully under water), the level rises to 15 cm. Volume of each ball (cm³)?',300,'Rise 3 cm. 30 × 20 × 3 = 1,800 cm³. 1,800 ÷ 6 = 300 cm³.','',['Find how many cm the water rose.','Base × rise = the volume of all the balls.','Divide by how many balls.']),
S('B12','T12','A cuboid container has a base of 16 cm × 10 cm. Jason pours in 1.2 L of water and then 2 cups of 400 mL. What is the height of the water (cm)?',12.5,'1,200 + 800 = 2,000 cm³. 2,000 ÷ 160 = 12.5 cm.','',['Turn litres and mL into cm³.','Add the water and the two cups.','Height = volume ÷ (length × width).']),
S('B13','T11','A cuboid is 12 cm × 8 cm × 10 cm. A smaller cuboid 4 cm × 8 cm × 5 cm is cut away from one top corner. Volume of the remaining solid (cm³)?',800,'960 − 160 = 800 cm³.','',['Find the volume of the big cuboid.','Find the volume of the piece cut off.','Remaining = big − small.']),
S('B14','T16','Taxi fare: first 2 km (or part) $27; every subsequent 200 m or part thereof $1.90. Mrs Lee travels 5.3 km. How much is the fare ($)?',59.3,'Extra 3.3 km = 3,300 m; 3,300 ÷ 200 = 16.5 → 17 parts. 27 + 17 × 1.90 = $59.30.','',['The first 2 km has its own fare.','Change the extra distance into metres, in steps of 200 m.','A leftover piece still counts as one step. Then add the fare.']),
S('B15a','T17',G+'(a) Between which two consecutive days was the change in books borrowed the greatest?',{days:['wed','thu']},'Mon 35, Tue 50, Wed 45, Thu 70, Fri 60. Changes: +15, −5, +25, −10 → Wednesday to Thursday.','e.g. Mon and Tue',['Read the number of books for each day.','Find the change from one day to the next.','Pick the biggest change, up or down.']),
S('B15b','T17',G+'(b) What was the average number of books borrowed per day?',52,'35+50+45+70+60 = 260. 260 ÷ 5 = 52.','',['Add the books from every day.','Count how many days there are.','Average = total ÷ number of days.']),
S('B15c','T17',G+'(c) What fraction of the total number of books was borrowed on Thursday?',{frac:[7,26]},'70 / 260 = 7/26.','Fraction, e.g. 1/2',['Read Thursday’s number of books.','Add all the days to get the total.','Fraction = Thursday ÷ total. Then simplify.']),
];
// --- tolerant checking
function num(s){s=s.toLowerCase().replace(/[,\s$]|cm³|cm3|cm|mm|ml|kg|g\b|l\b|bags?|bowls?|eggs?|books?|marks?/g,' ').trim().replace(/\s+/g,' ');
 let m;if(m=s.match(/^(-?\d+) (\d+)\/(\d+)$/))return +m[1]+m[2]/m[3];if(m=s.match(/^(-?\d*\.?\d+)\/(\d*\.?\d+)$/))return m[1]/m[2];s=s.replace(/ /g,'');return /^-?\d*\.?\d+$/.test(s)?+s:NaN}
function check(q,v){const a=q.a,s=v.toLowerCase();
 if(typeof a=='number')return Math.abs(num(v)-a)<1e-9;
 if(a.frac)return Math.abs(num(v)-a.frac[0]/a.frac[1])<1e-9;
 if(a.set){const n=(s.match(/\d+/g)||[]).map(Number);return n.length==a.set.length&&a.set.every(x=>n.includes(x))}
 if(a.days){const all=['mon','tue','wed','thu','fri'];const f=all.filter(d=>s.includes(d));return f.length==2&&a.days.every(d=>f.includes(d))}}
const MA=['C','A','D','A','B','B','D','B','C','A','B','D','C','C','D','B','A','C','A','C'];// key letters, verified on load
Q.slice(0,20).forEach((q,i)=>{if('ABCD'[q.a]!==MA[i])console.error('Key mismatch',q.id)});
Q.forEach(q=>{if(!CN[q.cat]||!q.tips||q.tips.length<1||q.tips.length>3)console.error('Bad question meta',q.id)});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TYPE_DIFF={T1:'easy',T2:'easy',T10:'easy',T17:'easy',T3:'easy',T19:'easy',T4:'medium',T5:'medium',T6:'medium',T7:'medium',T11:'medium',T14:'medium',T15:'medium',T18:'medium',T8:'hard',T9:'medium',T12:'hard',T13:'medium',T16:'hard'};
Q.forEach(q=>{if(!q.diff)q.diff=TYPE_DIFF[q.cat]||'medium'});
function lineSvg(d){
 const W=360,H=270,left=48,right=14,bottom=46;
 const multi=d.series.length>1, top=multi?48:28;
 const plotH=H-top-bottom, plotW=W-left-right;
 const yMin=d.y_min, yMax=d.y_max, step=d.y_step||1;
 const yOf=v=>top+(yMax-v)/(yMax-yMin||1)*plotH;
 const n=d.x_labels.length;
 const xOf=i=>left+(n<=1?plotW/2:(i/(n-1))*plotW);
 const ticks=[];
 for(let i=0,lim=Math.round((yMax-yMin)/step);i<=lim;i++) ticks.push(Math.round((yMin+i*step)*1000)/1000);
 const colors=['#d6336c','#4263eb'];
 const tick=v=>Math.abs(v-Math.round(v))<1e-6?String(Math.round(v)):String(v);
 let s=`<svg viewBox="0 0 ${W} ${H}" font-size="11" font-family="sans-serif" role="img">`;
 s+=`<text x="${W/2}" y="16" text-anchor="middle" font-weight="bold">${esc(d.title)}</text>`;
 if(multi){
  let lx=left;
  d.series.forEach((ser,si)=>{
   s+=`<rect x="${lx}" y="22" width="12" height="8" rx="2" fill="${colors[si%colors.length]}"/>`;
   s+=`<text x="${lx+16}" y="30">${esc(ser.name)}</text>`;
   lx+=16+ser.name.length*6.4+16;
  });
 }
 ticks.forEach(v=>{
  const y=yOf(v);
  s+=`<line x1="${left}" x2="${W-right}" y1="${y}" y2="${y}" stroke="#eee"/>`;
  s+=`<text x="${left-4}" y="${y+3}" text-anchor="end" font-size="9">${tick(v)}</text>`;
 });
 d.series.forEach((ser,si)=>{
  const col=colors[si%colors.length];
  const pts=ser.values.map((v,i)=>xOf(i)+','+yOf(v)).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
  ser.values.forEach((v,i)=>{s+=`<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3.5" fill="${col}"/>`});
 });
 d.x_labels.forEach((lab,i)=>{s+=`<text x="${xOf(i)}" y="${H-24}" text-anchor="middle">${esc(lab)}</text>`});
 s+=`<line x1="${left}" x2="${left}" y1="${top}" y2="${yOf(yMin)}" stroke="#333"/>`;
 s+=`<line x1="${left}" x2="${W-right}" y1="${yOf(yMin)}" y2="${yOf(yMin)}" stroke="#333"/>`;
 s+=`<text x="${(left+W-right)/2}" y="${H-6}" text-anchor="middle">${esc(d.x_label)}</text>`;
 const ly=(top+yOf(yMin))/2;
 s+=`<text x="14" y="${ly}" text-anchor="middle" transform="rotate(-90 14 ${ly})">${esc(d.y_label)}</text></svg>`;
 return s;
}
function looksNumeric(a){
 const s=String(a).trim().replace(/[$,]/g,'');
 return /^-?\d+(\.\d+)?$/.test(s)||/^-?\d+\s+\d+\/\d+$/.test(s)||/^-?\d+\/\d+$/.test(s);
}
function loose(s){return String(s).toLowerCase().replace(/\s+/g,'')}
function numIn(q,v){
 let s=String(v);
 if(q.unit){const u=q.unit.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp(u,'ig'),' ')}
 return num(s);
}
function bankOk(q,v){
 const folded=loose(v), n=numIn(q,v);
 for(const a of q.accepted){
  if(typeof a==='number'){if(typeof n==='number'&&!Number.isNaN(n)&&Math.abs(n-a)<1e-6)return true}
  else{
   if(loose(a)===folded)return true;
   if(looksNumeric(a)){const an=num(String(a));if(typeof n==='number'&&!Number.isNaN(n)&&!Number.isNaN(an)&&Math.abs(n-an)<1e-6)return true}
  }
 }
 return false;
}
function fromBank(raw){
 const tips=(raw.hints||[]).slice(0,3);
 const w=esc(raw.working||'');
 const graph=raw.data&&raw.data.type==='line'?raw.data:null;
 const qhtml=(graph?lineSvg(graph):'')+esc(raw.question||'');
 const base={id:raw.id,cat:raw.code,q:qhtml,w,tips,diff:raw.difficulty,bank:true,unit:raw.unit||'',answerText:raw.answer,accepted:raw.accepted_answers||[]};
 if(raw.format==='mcq')return Object.assign(base,{t:'m',o:raw.options||[],a:'ABCD'.indexOf(raw.answer)});
 return Object.assign(base,{t:'s',a:null,h:raw.unit?'Answer in '+raw.unit:''});
}
function displayAns(q){
 if(q.t==='m')return 'ABCD'[q.a]+' · '+q.o[q.a];
 const t=String(q.answerText);
 return q.unit&&t.indexOf(q.unit)<0?t+' '+q.unit:t;
}
const K='p6quiz3';
function fresh(){return {v:3,best:{},run:null}}
function load(){
 try{localStorage.removeItem('p6quiz1');localStorage.removeItem('p6quiz2')}catch(e){}
 try{
  const o=JSON.parse(localStorage.getItem(K)||'null');
  if(!o||o.v!==3||!o.best||typeof o.best!=='object')return fresh();
  if(o.run){
   const r=o.run;
   if(!Array.isArray(r.ids)||typeof r.i!=='number'||!r.res||typeof r.res!=='object'||!r.hinted||typeof r.hinted!=='object')return fresh();
   if(r.ids.some(id=>!Q.some(q=>q.id===id)))o.run=null;
  }
  return o;
 }catch(e){return fresh()}
}
let data=fresh();
let loadNote='';
let diffs=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}};
const app=document.getElementById('app');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const byId=id=>Q.find(q=>q.id===id);
function inDiff(q,d){return !d||d.includes(q.diff)}
function catCount(cat){return Q.filter(q=>q.cat===cat&&inDiff(q,diffs)).length}
function diffKeyOf(d){return d?d.slice().sort().join('+'):'all'}
function bestLabel(cat){const b=data.best[cat]&&data.best[cat][diffKeyOf(diffs)];return b?'Best '+b.c+'/'+b.n+(b.c===b.n?' ⭐':''):'Best —'}
function recordBest(){
 const tally={};
 data.run.ids.forEach(id=>{
  const q=byId(id); if(!q)return;
  if(!tally[q.cat])tally[q.cat]={c:0,n:0};
  tally[q.cat].n++;
  if(data.run.res[id])tally[q.cat].c++;
 });
 const key=diffKeyOf(data.run.diffs);
 Object.keys(tally).forEach(cat=>{
  const full=Q.filter(q=>q.cat===cat&&inDiff(q,data.run.diffs)).length;
  if(tally[cat].n!==full)return;
  if(!data.best[cat]||typeof data.best[cat].c==='number')data.best[cat]={};
  const prev=data.best[cat][key],cur=tally[cat];
  if(!prev||cur.c/cur.n>prev.c/prev.n)data.best[cat][key]={c:cur.c,n:cur.n};
 });
}
let pick=null;
function pool(){return Q.filter(q=>(!pick||pick.includes(q.cat))&&inDiff(q,diffs))}
function chosenIds(){return pool().map(q=>q.id)}
function start(ids,sh){data.run={ids:sh?shuf(ids):ids.slice(),i:0,res:{},hinted:{},done:false,diffs:diffs?diffs.slice():null};save();show()}
function home(){
 scrollTo(0,0);
 const run=data.run,resume=run&&!run.done&&run.i<run.ids.length;
 app.innerHTML=`<div class="card"><div class="big">🧮</div><p class="pick">${Q.length} questions. Pick a difficulty and one or more types.<br>Take your time — you can do it! 💪</p>
 ${loadNote?`<p class="pick">${esc(loadNote)}</p>`:''}
 <div class="chips" id="diffs"><button type="button" class="chip all" data-diff="all"><b>All levels</b></button><button type="button" class="chip" data-diff="easy"><b>Easy</b></button><button type="button" class="chip" data-diff="medium"><b>Medium</b></button><button type="button" class="chip" data-diff="hard"><b>Hard</b></button></div>
 <div class="chips" id="chips"><button type="button" class="chip all" data-cat="all"><b>All types</b><small>${Q.length} questions</small></button>`+
 CATS.map(([id,name])=>`<button type="button" class="chip" data-cat="${id}"><b>${esc(name)}</b><small>${catCount(id)} question${catCount(id)===1?'':'s'} · ${bestLabel(id)}</small></button>`).join('')+
 `</div><p class="pick" id="picked"></p>
 <label style="font-size:1.05em;display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" id="sh" style="width:26px;height:26px;margin:0"> Shuffle questions 🔀</label>
 ${resume?`<button class="btn alt" id="rs" type="button">▶ Continue (question ${run.i+1} of ${run.ids.length})</button>`:''}
 <button class="btn" id="go" type="button"></button>
 <button class="btn alt" id="q10" type="button"></button>
 <button class="btn ghost" id="wipe" type="button">Reset saved data</button></div>
 <div class="card" id="videos"><h2 style="color:#5f3dc4;margin:.2em 0 .4em;font-size:1.25em">🎬 Videos</h2><p class="pick">Six short walkthroughs. A video loads only when you tap it.</p>
 ${VIDEOS.map(v=>`<button type="button" class="btn watchbtn" data-watch="${v.cat}">${esc(v.title)}<small>${esc(v.note)}</small></button>`).join('')}
 </div>`;
 const paint=()=>{
  app.querySelectorAll('[data-diff]').forEach(el=>{
   const id=el.dataset.diff;
   el.classList.toggle('on',id==='all'?diffs===null:!!(diffs&&diffs.includes(id)));
  });
  app.querySelectorAll('[data-cat]').forEach(el=>{
   const id=el.dataset.cat;
   el.classList.toggle('on',id==='all'?pick===null:!!(pick&&pick.includes(id)));
   const small=el.querySelector('small');
   if(!small)return;
   if(id==='all'){const t=Q.filter(q=>inDiff(q,diffs)).length;small.textContent=t+' questions'}
   else small.textContent=catCount(id)+' question'+(catCount(id)===1?'':'s')+' · '+bestLabel(id);
  });
  const n=chosenIds().length;
  const picked=document.getElementById('picked');
  picked.textContent=n?n+' question'+(n===1?'':'s')+' selected':'Pick a level and at least one type';
  const go=document.getElementById('go');
  go.disabled=n===0;
  go.textContent=(resume?'Start over':'Start')+' · '+n+' 🚀';
  const q10=document.getElementById('q10');
  q10.disabled=n===0;
  q10.textContent='Quick 10 🎲'+(n&&n<10?' · '+n+' ready':'');
 };
 app.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{
  const id=el.dataset.cat;
  if(id==='all')pick=null;
  else{
   if(pick===null)pick=[id];
   else if(pick.includes(id))pick=pick.filter(x=>x!==id);
   else pick=pick.concat(id);
  }
  paint();
 });
 app.querySelectorAll('[data-diff]').forEach(el=>el.onclick=()=>{
  const id=el.dataset.diff;
  if(id==='all')diffs=null;
  else{
   if(diffs===null)diffs=[id];
   else if(diffs.includes(id))diffs=diffs.filter(x=>x!==id);
   else diffs=diffs.concat(id);
  }
  paint();
 });
 paint();
 document.getElementById('go').onclick=()=>{const ids=chosenIds();if(ids.length)start(ids,document.getElementById('sh').checked)};
 document.getElementById('q10').onclick=()=>{const ids=shuf(chosenIds());if(ids.length)start(ids.slice(0,10),false)};
 const rs=document.getElementById('rs');if(rs)rs.onclick=show;
 document.getElementById('wipe').onclick=()=>{data=fresh();try{localStorage.removeItem(K);localStorage.removeItem('p6quiz1');localStorage.removeItem('p6quiz2')}catch(e){}pick=null;diffs=null;home()};
 bindWatch(app);
}
function show(){
 scrollTo(0,0);
 const run=data.run;
 if(!run)return home();
 if(run.i>=run.ids.length){run.done=true;recordBest();save();return end()}
 const q=byId(run.ids[run.i]),n=run.ids.length,vid=VID[q.cat];
 const watchBtn=vid?`<button class="btn watchbtn" type="button" data-watch="${q.cat}">🎬 Watch how</button>`:'';
 const dlab=q.diff==='easy'?'Easy':q.diff==='hard'?'Hard':'Medium';
 let h=`<div class="meta"><span>Question ${run.i+1} / ${n}</span><span>⭐ ${Object.values(run.res).filter(x=>x).length}</span></div><div class="bar"><i style="width:${run.i/n*100}%"></i></div>
 <div class="card"><div class="qhead"><span class="tag">${esc(CN[q.cat])}</span><span class="tag ${q.diff}">${dlab}</span><span class="hint">${q.t=='m'?'Multiple choice':'Short answer'} · ${q.id}</span></div><div class="q">${q.q}</div>
 ${q.tips.length?`<button class="btn hintbtn" id="hint" type="button">💡 Hint</button>`:''}${watchBtn}<p class="hnote" id="hnote" hidden>Using a hint is okay — we’ll note it on your results. 💛</p><div id="steps"></div>`;
 if(q.t=='m')h+=q.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><b>${'ABCD'[k]}</b>${q.bank?esc(o):o}</button>`).join('');
 else h+=`<input id="inp" autocomplete="off" placeholder="${esc(q.h||'Your answer')}" inputmode="${q.bank?(q.accepted.some(a=>typeof a==='number')?'decimal':'text'):(typeof q.a==='number'?'decimal':'text')}"><button class="btn" id="sub" type="button">Check ✔</button>`;
 h+=`<div id="fb"></div></div><button class="btn ghost" id="hm" type="button">🏠 Home (progress saved)</button>`;
 app.innerHTML=h;
 document.getElementById('hm').onclick=home;
 bindWatch(app);
 let locked=false,shown=0;
 const hintBtn=document.getElementById('hint');
 if(hintBtn)hintBtn.onclick=()=>{
  if(locked||shown>=q.tips.length)return;
  shown++;
  run.hinted[q.id]=true;save();
  document.getElementById('hnote').hidden=false;
  document.getElementById('steps').innerHTML=q.tips.slice(0,shown).map((t,i)=>`<p class="step"><b>Step ${i+1}.</b> ${esc(t)}</p>`).join('');
  if(shown>=q.tips.length){hintBtn.disabled=true;hintBtn.textContent='💡 All steps shown'}
  else hintBtn.textContent='💡 Next hint';
 };
 const fin=(ok,ans)=>{
  locked=true;if(hintBtn)hintBtn.disabled=true;
  run.res[q.id]=ok;save();
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'🎉 Correct! Great job!':'😅 Not quite. Answer: '+esc(ans)}</b><br>${q.w}</div>${watchBtn}<button class="btn alt" id="nx" type="button">Next ➜</button>`;
  bindWatch(document.getElementById('fb'));
  const nx=document.getElementById('nx');
  nx.onclick=()=>{run.i++;save();show();scrollTo(0,0)};
  nx.scrollIntoView({behavior:'smooth',block:'center'});
 };
 if(q.t=='m')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(locked)return;
  const k=+b.dataset.k,ok=k==q.a;
  b.classList.add(ok?'ok':'no');
  app.querySelectorAll('.opt')[q.a].classList.add('ok');
  fin(ok,q.bank?displayAns(q):'ABCD'[q.a]);
 });
 else{
  const inp=document.getElementById('inp'),sub=document.getElementById('sub');
  const go=()=>{if(locked||!inp.value.trim())return;inp.disabled=true;sub.remove();fin(q.bank?bankOk(q,inp.value):check(q,inp.value),q.bank?displayAns(q):String(ansTxt(q)))};
  sub.onclick=go;inp.onkeydown=e=>{if(e.key=='Enter')go()};inp.focus();
 }
}
function ansTxt(q){const a=q.a;if(typeof a=='number')return a;if(a.frac)return a.frac[0]%a.frac[1]&&a.frac[0]>a.frac[1]?(q.id=='B8'?'4 1/4':a.frac.join('/')):a.frac.join('/');if(a.set)return a.set.join(', ');return 'Wednesday and Thursday'}
function end(){
 scrollTo(0,0);
 const run=data.run,n=run.ids.length,c=run.ids.filter(i=>run.res[i]).length,wrong=run.ids.filter(i=>!run.res[i]),p=c/n;
 const hinted=run.ids.filter(i=>run.hinted[i]);
 app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${p==1?'🏆':p>=.7?'🌟':'💪'}</div><h2>You scored ${c} / ${n}</h2><p>${p==1?'Perfect! Amazing!':p>=.7?'Well done! Keep it up!':'Good try! Practice makes perfect!'}</p>
 <p>${hinted.length?`💡 You used a hint on ${hinted.length} question${hinted.length===1?'':'s'}.`:'💡 No hints this time — nice work!'}</p>
 ${hinted.length?`<ul class="reslist">${hinted.map(id=>{const q=byId(id);return `<li>${q.id} ${esc(CN[q.cat])} — ${run.res[id]?'correct with a hint':'hint used'}</li>`}).join('')}</ul>`:''}
 ${wrong.length?`<button class="btn" id="rw" type="button">🔁 Retry wrong ones (${wrong.length})</button>`:''}<button class="btn alt" id="ag" type="button">Start again</button></div>`;
 if(wrong.length)document.getElementById('rw').onclick=()=>start(wrong,false);
 document.getElementById('ag').onclick=()=>{data.run=null;save();pick=null;home()};
}
async function boot(){
 app.innerHTML='<div class="card"><p class="pick">Loading extra questions…</p></div>';
 try{
  const r=await fetch('question_bank.json');
  if(!r.ok)throw new Error(String(r.status));
  const bank=await r.json();
  (bank.questions||[]).forEach(raw=>{
   if(!CN[raw.code]||Q.some(x=>x.id===raw.id))return;
   const item=fromBank(raw);
   if(item.t==='m'&&(item.a<0||item.o.length<2))return;
   Q.push(item);
  });
  if(!bank.questions||bank.questions.length<190)loadNote='Some extra questions were missing.';
 }catch(e){
  loadNote='Extra questions did not load. You can still practise the first set.';
 }
 data=load();
 home();
}
boot();
</script></body></html>
