<script type="application/json" id="gs-data">{"cats":{"L1":{"name":"第一課 最後的皇朝","short":"最後的皇朝","color":"#e8590c","emoji":"🏯"},"L4":{"name":"第四課 中國近年的發展","short":"中國近年的發展","color":"#1c7ed6","emoji":"🚄"}},"subs":{"L1a":{"cat":"L1","name":"清朝早期的盛世與轉弱","tut":["清朝是中國最後一個由皇帝統治的朝代，由滿族人建立。","康熙：大力提倡選用人才不分種族（滿、漢一律任用）。","雍正：嚴懲貪官，整頓朝廷貪污風氣，嚴查虧空，充實國庫，改善財政。","乾隆：派兵平定準噶爾叛亂，擴大清朝版圖。","乾隆晚年國勢開始轉弱：官員貪污受賄、破壞法紀；多次（六次）遊江南，花費龐大，令國庫空虛；人口增長迅速，農民耕地不足，生活困苦。"]},"L1b":{"cat":"L1","name":"鴉片戰爭","tut":["清朝中期以後，英國商人在中國販賣（走私）鴉片。","鴉片的禍害：國民健康受損、精神萎靡；軍隊戰鬥力下降；大量白銀外流，國家財政拮据；官員受賄，破壞法紀；影響家庭和諧和社會安定。","1839年：清政府派林則徐到廣州查禁鴉片，林則徐在虎門銷毀大量鴉片。","1840年：英國不滿，派兵攻打中國，爆發鴉片戰爭。","1842年：清政府戰敗，被迫與英國簽訂不平等的《南京條約》。"]},"L1c":{"cat":"L1","name":"不平等條約","tut":["《南京條約》（1842，鴉片戰爭）：香港島給予英國管治；向英國大額賠款；開放廣州、上海等五個港口為通商口岸。","《北京條約》（1860，英法聯軍之役 1856–1860）：九龍半島（南部）交予英國管治；向英國和法國大額賠款；增開天津為通商口岸。","《馬關條約》（1895，中日甲午戰爭 1894–1895）：遼東半島、台灣及澎湖列島讓予日本；向日本大額賠款；增開四個通商口岸。","《辛丑和約》（1901，八國聯軍之役 1900–1901）：向列強大額賠款；拆除大沽口到北京的所有炮台；容許聯軍在北京至山海關一帶駐軍。","相似要求：割地、賠款、開放通商口岸（及駐軍）。影響：賠款加重財政負擔→加重稅收，人民生活困苦；割地令領土不完整；開放通商口岸令中國商人面對外國工業品的激烈競爭；國勢更加衰弱。","與香港有關：《南京條約》（香港島）、《北京條約》（九龍半島南部）。"]},"L1d":{"cat":"L1","name":"辛亥革命與清朝滅亡","tut":["孫中山，原名孫文，廣東省香山縣人，早年在香港接受中學和大學教育。","部分國民認為清政府腐敗無能，只有推翻它才能救國。","1905年：孫中山成立中國同盟會，於世界各地組織有志救國人士參加革命。","革命人士發動多次起義都不成功，較著名的有「黃花崗之役」。","1911年：武昌起義成功，史稱「辛亥革命」。","孫中山被推舉為臨時大總統；1912年1月1日中華民國成立，清朝隨後滅亡，結束了中國二千多年的帝制統治。"]},"L4a":{"cat":"L4","name":"經濟發展的影響","tut":["正面：人民收入普遍增加，消費能力越來越強；工廠提供大量低技術及低學歷的職位，失業率下降；生活質素得到提升。","負面：物價上漲；環境污染（空氣、水污染）；大量農民到城市工作，留下孩子在農村，出現「留守兒童」；城市交通擠塞。","課本資料：平均每年約有一千萬名農民從農村走到城市；2017年城市農民工月均收入比農村高約20%；2015年中國有六千多萬名留守兒童。"]},"L4b":{"cat":"L4","name":"科技發展","tut":["中國近年注重（創新）科技發展，以推動經濟，改善人民生活質素。","航天科技：探月車「玉兔號」。 航空科技：大型噴射式民用飛機C919、水陸兩棲飛機「鯤龍600」。","資訊科技：超級電腦「神威·太湖之光」（可用於太空科研、大型飛機和高速列車設計、生物醫學等）。","農業科技：雜交水稻（袁隆平，「雜交水稻之父」），提高水稻產量。 能源科技：電動車、氫能源電動車（不排出二氧化碳，環保）。","海陸：「蛟龍號」載人潛水器（2012年下潛突破7000米）；高鐵「復興號」（2017年時速350公里，北京至上海約4小時）；廣深港高鐵香港段總站在香港西九龍。"]},"L4c":{"cat":"L4","name":"中國在國際上的角色","tut":["經濟：2001年加入世界貿易組織（推動國際貿易自由和平等地進行）；2015年由中國發起的亞洲基礎設施投資銀行正式成立（向亞洲各國和地區提供資金，發展基礎建設）；2013年提出「一帶一路」倡議，2017年在北京舉行「一帶一路」國際合作高峰論壇。","「一帶」＝絲綢之路經濟帶；「一路」＝21世紀海上絲綢之路。","公共衞生：中國香港代表陳馮富珍由2007年起擔任世界衞生組織總幹事達十年。","文化、教育：2013年郝平擔任聯合國教科文組織大會主席。","體育：2008年北京奧林匹克運動會；2022年北京冬季奧林匹克運動會。","好處：提升國際地位；維護世界安全；保障全球經濟增長；共同解決全球問題。"]},"L4d":{"cat":"L4","name":"認識和關心中國","tut":["途徑：閱讀和中國有關的新聞、報章；參觀和中國有關的展覽、博物館；參加內地考察團、交流團；到內地探親或旅遊；瀏覽可靠網頁、閱讀書籍。"]}},"src":{"opium":{"title":"資料：鴉片戰爭的經過","text":"鴉片戰爭以前，英國從中國購買的貨物多，但賣給中國的東西少。為了扭轉這種逆差，英國商人向中國走私鴉片，獲取暴利。鴉片令許多中國人成為癮君子，大量白銀外流，國家財政拮据。\n1839年，清政府派林則徐到廣州查禁鴉片。林則徐在虎門把搜查到的鴉片全部銷毀。\n英國政府不滿，於1840年派兵攻打中國，鴉片戰爭爆發。清軍節節敗退，1842年，清政府被迫與英國簽訂不平等的《南京條約》，戰爭結束。","cite":"根據課本《最後的皇朝》及模擬試卷資料整理"},"rice":{"title":"資料：稻田裏的科學家","text":"袁隆平（1929–2021）是中國家喻戶曉的科學家，被譽為「雜交水稻之父」。\n雜交水稻是透過選用兩個具有不同特性、能互補不足的水稻品種進行雜交育種，因此產量通常較高。\n袁隆平於1960年代開始研究，成功培育世界上第一個可應用於大面積生產的雜交水稻品種「南優2號」。1976年起，研究成果開始在全國生產，大幅提升了水稻產量。\n1991年，他成為聯合國糧農組織首席顧問；2004年更榮獲「世界糧食獎」。中國接近一半的水稻生產地區都種植了雜交水稻，每年為大約7000萬人口供給糧食。他和團隊還到印度、巴基斯坦、越南等地，為當地水稻研究人員提供意見。","cite":"資料整理自蜜蜂試卷模擬卷（原資料：報章報道、世界糧食獎官方網頁）"},"farm":{"title":"資料：經濟發展與農民工","text":"• 平均每年約有一千萬名農民從農村走到城市工作和生活。\n• 2017年，在城市工作的農民工月均收入比留在農村工作的農民工高約20%。\n• 2015年，中國有六千多萬名留守兒童。\n• 中國現時有二百多種工業產品，產量居世界第一位。\n• 北京空氣污染預警由2016年12月30日啟動，持續了二百多個小時。\n• 工廠提供了大量低技術及低學歷的職位。","cite":"資料整理自課本《中國近年的發展》（原資料：國家統計局網站、《明報》網站）"},"news":{"title":"資料：兩篇報道（2018年7月）","text":"報道一：《2018年全球創新指數》報告顯示，中國首次躋身前20名，在科研人員、技術專利和科技出版物的數量，中國均位居全球第一。\n報道二：有學院院長認為中國的高端科技發展仍處於中低水平。以電腦和電子產品生產為例，2017年中國便需從外國輸入總值2601億美元的晶片產品。","cite":"資料整理自課本《中國近年的發展》"}},"questions":[{"id":"L1a-01","sub":"L1a","type":"mcq","diff":"easy","q":"清朝是由哪個民族建立的朝代？","options":["漢族","滿族","蒙古族","回族"],"answer":1,"hints":["清朝是中國最後一個朝代。","課本：「清朝是中國最後一個由皇帝統治的朝代，由＿族人建立。」","康熙要「不分滿漢」任用人才，因為皇帝本身是滿族。"],"explain":"清朝由滿族人建立，所以康熙要強調滿族、漢族人才一律任用。","accept":[],"cat":"L1"},{"id":"L1a-02","sub":"L1a","type":"mcq","diff":"easy","q":"清朝哪位皇帝在任內大力提倡選用人才不分種族？","options":["乾隆","雍正","道光","康熙"],"answer":3,"hints":["清朝早期三位皇帝：康熙 → 雍正 → 乾隆。","這位皇帝說：「無論是滿族還是漢族人，只要是人才，朕一律任用。」"],"explain":"康熙大力提倡選用人才不分種族，只要是賢能之士都會任用，消除漢族士人的反抗意識。","accept":[],"cat":"L1"},{"id":"L1a-03","sub":"L1a","type":"mcq","q":"哪位皇帝嚴懲貪官，整頓朝廷貪污風氣，嚴查虧空，改善清朝財政？","options":["康熙","雍正","乾隆","光緒"],"answer":1,"hints":["他在康熙之後、乾隆之前。","「朕要嚴懲貪官，掃除朝廷內的貪污風氣。」"],"explain":"雍正整頓朝廷貪污風氣，令吏治清明，嚴查虧空，充實國庫，改善清朝財政體制。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1a-04","sub":"L1a","type":"mcq","q":"哪位皇帝派兵平定了準噶爾叛亂，擴大了清朝版圖？","options":["康熙","雍正","乾隆","道光"],"answer":2,"hints":["根據課本，是清朝早期第三位皇帝。","他晚年多次遊江南。"],"explain":"乾隆派兵平定準噶爾叛亂，平定邊疆外族，擴大清朝版圖。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1a-05","sub":"L1a","type":"tf","diff":"easy","q":"乾隆皇帝六次下西洋，花費龐大。","answer":false,"hints":["「下西洋」是明朝鄭和的事。","乾隆是「遊」去中國哪個地區？"],"explain":"錯。乾隆皇帝是六次遊江南（下江南），花費龐大，令國庫空虛。「下西洋」是明朝鄭和。","accept":[],"cat":"L1"},{"id":"L1a-06","sub":"L1a","type":"multi","q":"為甚麼到了乾隆皇帝晚年，清朝國勢開始轉弱？（可選多於一個）","options":["官員貪污受賄，破壞法紀","多次遊江南，令國庫空虛","人口增長迅速，農民耕地不足","英國派兵攻打北京"],"answer":[0,1,2],"hints":["想想課本的三幅圖：官員送禮、皇帝坐船遊江南、農民說「田地不足」。","英國攻打中國是1840年鴉片戰爭，那時已不是乾隆在位。"],"explain":"乾隆晚年：官員貪污受賄；皇帝多次遊江南令國庫空虛；人口增長迅速但耕地不足。英國派兵是後來鴉片戰爭的事。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1a-07","sub":"L1a","type":"fill","diff":"easy","q":"清朝早期，在康熙、雍正和＿＿＿＿皇帝的統治下，國勢強盛。","answer":"乾隆","hints":["清初三位有作為的皇帝。","他平定了準噶爾叛亂。"],"explain":"清朝早期的三位皇帝：康熙、雍正和乾隆，國勢強盛。","accept":[],"cat":"L1"},{"id":"L1a-08","sub":"L1a","type":"fill","q":"清朝的國勢在＿＿＿＿皇帝晚年時開始轉弱。","answer":"乾隆","accept":["乾隆皇帝"],"hints":["是清初三位皇帝中最後一位。","他晚年多次遊江南。"],"explain":"清朝國勢在乾隆晚年開始轉弱。","diff":"medium","cat":"L1"},{"id":"L1a-09","sub":"L1a","type":"match","q":"配對：以下清朝皇帝在任內做了甚麼事情？","items":["康熙","雍正","乾隆"],"options":["平定準噶爾叛亂","嚴查虧空，充實國庫","大力提倡選用人才不分種族","派林則徐到廣州查禁鴉片","簽訂《南京條約》"],"answer":[2,1,0],"hints":["D 和 E 都是清朝中期（道光年間）的事，不是清初三帝。","康熙：用人；雍正：反貪；乾隆：擴大版圖。"],"explain":"康熙－用人不分種族；雍正－整頓貪污、嚴查虧空；乾隆－平定準噶爾叛亂。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1a-10","sub":"L1a","type":"short","diff":"hard","q":"試舉出兩個乾隆皇帝晚年清朝國勢開始轉弱的原因。","answer":"①官員貪污受賄，破壞法紀；②乾隆多次遊江南，花費不菲，令國庫空虛；③人口增長迅速，但農民耕地不足，生活困苦。（任答兩項）","groups":[["貪污","受賄","貪官","法紀"],["江南","國庫","空虛","花費","遊樂"],["人口","耕地","田地","糊口"]],"need":2,"hints":["課本有三幅圖：官員、遊船、農民。","每一個原因寫一句完整的句子。"],"explain":"寫出任何兩項：官員貪污、國庫空虛、人口多耕地不足。","accept":[],"cat":"L1"},{"id":"L1a-11","sub":"L1a","type":"fix","q":"判斷修正：「康熙派兵平定了準噶爾叛亂，奠定了清朝的版圖。」句子中錯誤的部分應改為甚麼？","answer":"乾隆","accept":["乾隆皇帝"],"hints":["句子講的是皇帝做的事，錯在人名。","平定準噶爾叛亂的皇帝晚年遊江南。"],"explain":"課本：乾隆派兵平定準噶爾叛亂，奠定清朝版圖。所以「康熙」應改為「乾隆」。","diff":"medium","cat":"L1"},{"id":"L1a-12","sub":"L1a","type":"fix","diff":"easy","q":"判斷修正：「清朝是中國最後一個由皇帝統治的朝代，由漢族人建立。」錯誤的部分應改為甚麼？","answer":"滿族","accept":["滿族人","滿洲","滿洲人"],"hints":["錯在民族。","康熙要「不分滿漢」用人。"],"explain":"清朝由滿族人建立。","cat":"L1"},{"id":"L1b-01","sub":"L1b","type":"mcq","diff":"easy","q":"清朝中期以後，哪個國家的商人在中國販賣鴉片？","options":["日本","法國","英國","美國"],"answer":2,"hints":["鴉片戰爭是中國和哪個國家打仗？","《南京條約》把香港島給予這個國家。"],"explain":"清朝中期以後，英國商人在中國販賣鴉片。","accept":[],"cat":"L1"},{"id":"L1b-02","sub":"L1b","type":"multi","q":"清朝中期以後，大量國民沉迷吸食鴉片，對當時中國帶來甚麼禍害？（可選多於一個）","options":["死亡率大大提升，人口迅速減少","國民健康受損","軍隊吸食鴉片，影響戰鬥力","官員貪污受賄，破壞法紀"],"answer":[1,2,3],"hints":["課本列出的禍害包括：健康、軍隊、官員、家庭。","課本沒有說人口迅速減少。"],"explain":"鴉片令國民健康受損、軍隊戰鬥力下降、官員受賄破壞法紀，又令白銀外流。課本沒有提及「人口迅速減少」。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1b-03","sub":"L1b","type":"mcq","diff":"easy","q":"林則徐在哪裏銷毀大量鴉片？","options":["澳門","上海","香港","虎門"],"answer":3,"hints":["地點在廣東。","「＿＿銷煙」是著名的歷史事件。"],"explain":"1839年，林則徐在虎門銷毀大量鴉片（虎門銷煙）。他是被派到廣州查禁鴉片，但銷煙地點是虎門。","accept":[],"cat":"L1"},{"id":"L1b-04","sub":"L1b","type":"fill","diff":"easy","q":"1839年，清政府派＿＿＿＿到廣州查禁鴉片。","answer":"林則徐","hints":["他是欽差大臣。","他在虎門銷煙。"],"explain":"清政府派林則徐到廣州查禁鴉片。","accept":[],"cat":"L1"},{"id":"L1b-05","sub":"L1b","type":"fill","q":"1839年，林則徐在＿＿＿＿把搜查到的走私鴉片銷毀。","answer":"虎門","hints":["不是廣州市內，是另一個地方。","「＿＿銷煙」。"],"explain":"林則徐在虎門銷毀鴉片。常見錯誤：寫成「廣州」。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1b-06","sub":"L1b","type":"mcq","q":"鴉片戰爭在哪一年爆發？","options":["1839年","1840年","1842年","1856年"],"answer":1,"hints":["1839年是虎門銷煙。","1842年是簽訂《南京條約》。"],"explain":"1839年虎門銷煙 → 1840年英國派兵，鴉片戰爭爆發 → 1842年簽訂《南京條約》。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1b-07","sub":"L1b","type":"fill","diff":"easy","q":"清政府在鴉片戰爭中戰敗，被迫與英國簽訂《＿＿＿＿》。","answer":"南京條約","accept":["南京條約"],"hints":["這條約把香港島給予英國管治。","條約以中國一個城市命名。"],"explain":"鴉片戰爭 → 《南京條約》（1842年）。","cat":"L1"},{"id":"L1b-08","sub":"L1b","type":"order","q":"排序：按發生的先後次序排列以下事件（輸入字母，例如 ABCDE）。","options":["清政府在鴉片戰爭中戰敗","林則徐銷毀大量鴉片","清政府被迫與英國簽訂《南京條約》","清政府派林則徐查禁鴉片","英國不滿，派兵攻打中國，爆發鴉片戰爭"],"answer":"DBEAC","hints":["先有「派」林則徐，才有「銷毀」鴉片。","1839 查禁、銷煙 → 1840 開戰 → 1842 戰敗、簽約。"],"explain":"D 派林則徐查禁（1839）→ B 虎門銷煙（1839）→ E 英國開戰（1840）→ A 清政府戰敗 → C 簽訂《南京條約》（1842）。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1b-09","sub":"L1b","type":"short","q":"鴉片戰爭的起因是甚麼？","answer":"清政府派林則徐到廣州查禁鴉片，林則徐在虎門銷毀大量鴉片，引起英國不滿，於是英國在1840年派兵攻打中國，爆發鴉片戰爭。","groups":[["林則徐","禁煙","查禁","禁鴉片","銷煙","銷毀"],["英國不滿","引起英國","英國派兵","英國攻打","英國出兵","激怒"]],"need":2,"hints":["要寫兩部分：清政府做了甚麼？英國有甚麼反應？","關鍵字：林則徐、虎門銷煙、英國不滿。"],"explain":"答案要包括「林則徐禁煙／虎門銷煙」和「英國不滿而派兵」。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1b-10","sub":"L1b","type":"fill","q":"大量白銀＿＿＿＿，導致清朝國家財政拮据。","answer":"外流","accept":["流出","流失","外洩"],"hints":["中國人用白銀買鴉片，白銀去了哪裏？","兩個字，意思是「流到外國」。"],"explain":"國民用白銀購買鴉片，令大量白銀外流，國家財政拮据。","diff":"medium","cat":"L1"},{"id":"L1b-11","sub":"L1b","type":"mcq","diff":"easy","q":"看圖說話：圖中士兵說：「吸食了鴉片使我們沒有力氣去打仗了！」這反映鴉片帶來甚麼禍害？","pic":"💂 士兵：「吸食了鴉片使我們沒有力氣去打仗了！」","options":["軍隊戰鬥力下降","白銀外流","官員受賄","家庭不和"],"answer":0,"hints":["說話的是誰？","士兵沒有力氣打仗＝？"],"explain":"軍隊吸食鴉片，戰鬥力下降。","accept":[],"cat":"L1"},{"id":"L1b-12","sub":"L1b","type":"mcq","q":"看圖說話：英國商人對清朝官員說：「你替我們走私鴉片，保證你財源滾滾。」這反映鴉片帶來甚麼禍害？","pic":"🎩 英國商人 → 👲 官員：「你替我們走私鴉片，保證你財源滾滾。」","options":["國民健康受損","官員貪污受賄，破壞法紀","軍隊戰鬥力下降","人口增長迅速"],"answer":1,"hints":["官員收了好處會怎樣做？","對走私鴉片不加阻攔＝？"],"explain":"官員貪污受賄，對走私不加阻攔，破壞法紀。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1b-13","sub":"L1b","type":"mcq","q":"看圖說話：婦人說：「孩子都沒飯吃了，你還花錢吸食鴉片！」這反映鴉片帶來甚麼禍害？","pic":"👩 婦人：「孩子都沒飯吃了，你還花錢吸食鴉片！」","options":["影響家庭和諧和社會安定","官員受賄","英國不滿","通商口岸增加"],"answer":0,"hints":["這是一家人之間的對話。"],"explain":"把錢花在吸食  const due=dueIds().length;
 let h='<h1>常識小測驗 🏯🚄</h1><div class="hello">Ansbie，你好！👋 今日溫邊一課？</div>'+
 '<div class="card"><b>難度</b><div class="chips" id="diffs">'+[['all','全部'],['easy','淺 ⭐'],['medium','中 ⭐⭐'],['hard','深 ⭐⭐⭐']].map(([k,t])=>'<button class="chip'+(diffSel===k?' on':'')+'" data-diff="'+k+'">'+t+'</button>').join('')+'</div>'+
 '<div class="modes" style="margin-top:8px">'+
 '<button class="btn big pri" data-go="quick10">⚡ 快問十題<small>Quick 10 · 隨機10題</small></button>'+
 '<button class="btn big warn" data-go="timed">⏱️ 限時挑戰<small>15題 · 10分鐘</small></button>'+
 '<button class="btn big go" data-go="review"'+(due?'':' disabled')+'>🔁 錯題重溫<small>'+(due?due+' 題到期':'暫時沒有到期')+'</small></button>'+
 '<button class="btn big" data-go="print">🖨️ 列印工作紙<small>Printable worksheet</small></button>'+
 '</div><p class="muted">已答 '+Object.keys(data.stat).length+' / '+QS.length+' 題 · 錯題會在 1、3、7 日後再出現。</p></div>';
 Object.keys(CATS).forEach(c=>{
  const C=CATS[c];
  h+='<div class="card lesson" style="--c:'+C.color+'"><h2>'+C.emoji+' '+esc(C.name)+'</h2>'+
   '<div class="row" style="margin-top:0"><button class="btn" style="background:'+C.color+';color:#fff" data-cat="'+c+'">練習全課</button><button class="btn" data-tut="'+c+'">📖 課題重點</button></div>';
  Object.keys(SUBS).filter(s=>SUBS[s].cat===c).forEach(s=>{
   const ids=QS.filter(q=>q.sub===s).map(q=>q.id),st=stat(ids);
   h+='<div class="sub"><div class="nm">'+esc(SUBS[s].name)+'<div class="bar"><i style="width:'+Math.round(st.ok/ids.length*100)+'%"></i></div></div><span class="pct">'+st.ok+'/'+ids.length+' ✓</span><button class="btn" data-sub="'+s+'">練習</button><button class="btn" data-tut="'+s+'" title="重點">📖</button></div>';
  });
  h+='</div>';
 });
 app.innerHTML=h;
}
function tutorial(key){
 window.scrollTo(0,0);
 const subs=CATS[key]?Object.keys(SUBS).filter(s=>SUBS[s].cat===key):[key];
 const c=SUBS[subs[0]].cat;
 app.innerHTML='<div class="card lesson" style="--c:'+CATS[c].color+'"><h2>📖 '+esc(CATS[c].name)+'</h2>'+subs.map(s=>'<h3>'+esc(SUBS[s].name)+'</h3><ul class="tut">'+SUBS[s].tut.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><button class="btn" data-sub="'+s+'">練習「'+esc(SUBS[s].name)+'」</button>').join('')+
  '<div class="row"><button class="btn" data-home>← 返回</button></div></div>';
}
// ---- session ----
function start(mode,opts){
 let list;
 if(mode==='review')list=shuffle(dueIds().map(id=>BYID[id]));
 else if(mode==='category'){list=shuffle(pool().filter(q=>opts.sub?q.sub===opts.sub:q.cat===opts.cat));if(!list.length)list=shuffle(QS.filter(q=>opts.sub?q.sub===opts.sub:q.cat===opts.cat))}
 else {const p=shuffle(pool());list=p.slice(0,mode==='timed'?15:10)}
 if(!list.length){alert('沒有題目');return}
 S={mode,sid:newSid(),list,i:0,ok:0,res:[],end:mode==='timed'?Date.now()+10*60000:0,label:opts&&opts.sub?SUBS[opts.sub].name:opts&&opts.cat?CATS[opts.cat].name:({quick10:'快問十題',timed:'限時挑戰',review:'錯題重溫'})[mode]};
 show();
}
let tick=null;
function timerText(){const ms=Math.max(0,S.end-Date.now()),s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function show(){
 window.scrollTo(0,0);
 clearInterval(tick);
 if(S.end&&Date.now()>=S.end)return finish(true);
 const q=S.list[S.i];S.q=q;S.t0=Date.now();S.hint=0;S.done=false;S.pick=q.type==='multi'?[]:null;
 const C=CATS[q.cat];
 let h='<div class="card"><div class="qhead"><span>'+esc(S.label)+' · 第 '+(S.i+1)+' / '+S.list.length+' 題</span>'+(S.end?'<span class="timer" id="tm">⏱ '+timerText()+'</span>':'')+'<span>✅ '+S.ok+'</span></div>'+
  '<div style="margin-top:6px"><span class="tag" style="--c:'+C.color+'">'+esc(C.short)+'</span> <span class="tag">'+esc(SUBS[q.sub].name)+'</span> <span class="tag" style="--c:#7048e8">'+TYPE[q.type]+'</span> <span class="tag" style="--c:#adb5bd">'+DIFF[q.diff]+'</span></div>';
 if(q.src){const s=SRC[q.src];h+='<div class="src"><b>📄 '+esc(s.title)+'</b>'+esc(s.text)+'<span class="cite">'+esc(s.cite)+'</span></div>'}
 if(q.pic)h+='<div class="pic">'+esc(q.pic)+'</div>';
 h+='<div class="stem">'+esc(q.q)+'</div><div id="inp">'+inputHtml(q)+'</div>'+
  '<div class="hints" id="hints"></div><div id="fb"></div>'+
  '<div class="row" id="acts"><button class="btn warn" id="hintBtn">💡 提示 ('+q.hints.length+')</button><button class="btn go" id="sub">提交</button></div>'+
  '<div class="row"><button class="btn" data-home>結束</button></div></div>';
 app.innerHTML=h;
 if(S.end)tick=setInterval(()=>{const el=document.getElementById('tm');if(el)el.textContent='⏱ '+timerText();if(Date.now()>=S.end){clearInterval(tick);if(!S.done)submit(true);else finish(true)}},500);
 const f=app.querySelector('input.ans,textarea.ans');if(f&&!('ontouchstart' in window))f.focus();
}
function inputHtml(q){
 if(q.type==='mcq'||q.type==='multi')return q.options.map((o,i)=>'<button class="opt" data-o="'+i+'"><b>'+L[i]+'.</b> '+esc(o)+'</button>').join('');
 if(q.type==='tf')return '<button class="opt" data-o="0">✓ 正確</button><button class="opt" data-o="1">✗ 錯誤</button>';
 if(q.type==='fill'||q.type==='fix')return '<input class="ans" id="ans" autocomplete="off" placeholder="'+(q.type==='fix'?'寫出正確的字詞':'在這裏填寫答案')+'">';
 if(q.type==='short')return '<textarea class="ans" id="ans" placeholder="用完整句子作答"></textarea>';
 if(q.type==='order')return '<div class="olist">'+q.options.map((o,i)=>'<div><b>'+L[i]+'.</b> '+esc(o)+'</div>').join('')+'</div><input class="ans" id="ans" autocomplete="off" placeholder="例如 '+L.slice(0,q.options.length)+'">';
 if(q.type==='match')return q.items.map((it,i)=>'<div class="mrow"><span><b>'+(i+1)+'.</b> '+esc(it)+'</span><select class="ans" data-m="'+i+'"><option value="">— 選擇 —</option>'+q.options.map((o,j)=>'<option value="'+j+'">'+L[j]+'. '+esc(o)+'</option>').join('')+'</select></div>').join('');
 return '';
}
function given(q){
 if(q.type==='mcq')return S.pick==null?'':L[S.pick];
 if(q.type==='multi')return S.pick.slice().sort().map(i=>L[i]).join(',');
 if(q.type==='tf')return S.pick==null?'':(S.pick===0?'✓':'✗');
 if(q.type==='match')return [...app.querySelectorAll('select[data-m]')].map(s=>s.value===''?'-':L[+s.value]).join(',');
 const el=document.getElementById('ans');return el?el.value.trim():'';
}
function judge(q,g){
 if(q.type==='mcq')return S.pick===q.answer;
 if(q.type==='multi')return S.pick.slice().sort().join()===q.answer.slice().sort().join();
 if(q.type==='tf')return S.pick!=null&&(S.pick===0)===q.answer;
 if(q.type==='fill'||q.type==='fix')return checkFill(q,g);
 if(q.type==='order')return checkOrder(q,g);
 if(q.type==='match'){const v=[...app.querySelectorAll('select[data-m]')].map(s=>s.value===''?-1:+s.value);return v.every((x,i)=>x===q.answer[i])}
 if(q.type==='short')return checkShort(q,g);
 return false;
}
function answerText(q){
 if(q.type==='mcq')return L[q.answer]+'. '+q.options[q.answer];
 if(q.type==='multi')return q.answer.map(i=>L[i]+'. '+q.options[i]).join('；');
 if(q.type==='tf')return q.answer?'✓ 正確':'✗ 錯誤';
 if(q.type==='match')return q.items.map((it,i)=>(i+1)+'. '+it+' → '+L[q.answer[i]]+'. '+q.options[q.answer[i]]).join('<br>');
 if(q.type==='order')return q.answer.split('').join(' → ');
 return esc(q.answer);
}
function submit(timeout){
 const q=S.q;if(S.done)return;
 const g=given(q);
 if(!timeout&&!g.replace(/[-,]/g,'')){alert('請先作答 🙂');return}
 S.done=true;
 const ok=!timeout&&judge(q,g);
 const ms=Date.now()-S.t0;
 if(ok)S.ok++;
 S.res.push({id:q.id,ok,g});
 data.stat[q.id]={n:((data.stat[q.id]||{}).n||0)+1,last:ok&&!S.hint};
 data.attempts.push({id:q.id,ok,hint:!!S.hint,t:Date.now()});if(data.attempts.length>2000)data.attempts.splice(0,data.attempts.length-2000);
 schedule(q.id,ok&&!S.hint);
 save();
 queueAttempt(q,ok,S.hint>0,ms,g);
 // mark choices
 if(['mcq','multi','tf'].includes(q.type)){
  const right=q.type==='tf'?[q.answer?0:1]:(q.type==='mcq'?[q.answer]:q.answer);
  app.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.o;if(right.includes(i))b.classList.add('right');else if(b.classList.contains('sel'))b.classList.add('wrong');b.disabled=true});
 }
 let fb='<div class="fb '+(ok?'ok':'no')+'"><b>'+(timeout?'⏰ 時間到！':ok?'✅ 答對了！'+(S.hint?'（用了提示，稍後再溫一次）':''):'❌ 未答對')+'</b>';
 if(q.type==='short'){
  const hits=shortHits(q,g);
  fb+='<div class="exp">關鍵詞（要中 '+q.need+' 組）：'+q.groups.map((gr,i)=>'<span class="kw'+(hits[i]?' hit':'')+'">'+esc(gr.slice(0,3).join('／'))+'</span>').join('')+'</div><div class="exp"><b>參考答案：</b>'+esc(q.answer)+'</div>';
 }else{
  fb+='<div class="exp"><b>正確答案：</b>'+answerText(q)+'</div>';
  if((q.accept||[]).length)fb+='<div class="exp muted">亦接受：'+q.accept.map(esc).join('、')+'</div>';
 }
 fb+='<div class="exp">📝 '+esc(q.explain)+'</div></div>';
 document.getElementById('fb').innerHTML=fb;
 document.getElementById('acts').innerHTML='<button class="btn pri" id="next">'+(S.i+1<S.list.length?'下一題 →':'看結果 🎉')+'</button>';
}
function next(){S.i++;if(S.i>=S.list.length||(S.end&&Date.now()>=S.end))finish(S.end&&Date.now()>=S.end);else show()}
function finish(timeUp){
 clearInterval(tick);window.scrollTo(0,0);
 const n=S.res.length,ok=S.ok,pct=n?Math.round(ok/n*100):0;
 const wrong=S.res.filter(r=>!r.ok);
 app.innerHTML='<div class="card"><h2>'+(timeUp?'⏰ 時間到！':'🎉 完成！')+'</h2><p style="font-size:22px"><b>'+ok+' / '+n+'</b>（'+pct+'%）'+(pct>=80?' 好叻呀 Ansbie！🌟':pct>=60?' 唔錯，繼續加油！💪':' 慢慢嚟，溫完重點再試 📖')+'</p>'+
  (wrong.length?'<h3>要再溫的題目</h3><ul>'+wrong.map(r=>'<li>'+esc(BYID[r.id].q)+'<br><span class="muted">答案：'+answerText(BYID[r.id])+'</span></li>').join('')+'</ul><p class="muted">這些題目已加入「錯題重溫」。</p>':'')+
  '<div class="row"><button class="btn pri" data-home>返回主頁</button></div></div>';
 S=null;
}
// ---- printable worksheet ----
let PW={subs:Object.keys(SUBS),diff:'all',n:20,key:true,list:[]};
function printSetup(){
 window.scrollTo(0,0);
 app.innerHTML='<div class="card"><h2>🖨️ 列印工作紙</h2><b>課題</b><div class="chips">'+Object.keys(SUBS).map(s=>'<button class="chip'+(PW.subs.includes(s)?' on':'')+'" data-ps="'+s+'">'+esc(CATS[SUBS[s].cat].emoji+' '+SUBS[s].name)+'</button>').join('')+'</div>'+
  '<b>難度</b><div class="chips">'+[['all','全部'],['easy','淺'],['medium','中'],['hard','深']].map(([k,t])=>'<button class="chip'+(PW.diff===k?' on':'')+'" data-pd="'+k+'">'+t+'</button>').join('')+'</div>'+
  '<b>題數</b><div class="chips">'+[10,20,30,40].map(n=>'<button class="chip'+(PW.n===n?' on':'')+'" data-pn="'+n+'">'+n+'</button>').join('')+'</div>'+
  '<label style="display:block;margin:8px 0"><input type="checkbox" id="pkey"'+(PW.key?' checked':'')+'> 另頁附答案及解說</label>'+
  '<label style="display:block;margin:8px 0"><input type="checkbox" id="pweak"> 優先選做錯過的題目</label>'+
  '<div class="row"><button class="btn pri" id="pgo">🖨️ 列印 / 儲存 PDF</button><button class="btn" id="pshuf">🔀 重新抽題</button></div><p class="muted" id="pinfo"></p>'+
  '<div class="row"><button class="btn" data-home>← 返回</button></div></div>';
 buildPrint();
}
function buildPrint(){
 const weak=document.getElementById('pweak')&&document.getElementById('pweak').checked;
 let p=QS.filter(q=>PW.subs.includes(q.sub)&&(PW.diff==='all'||q.diff===PW.diff));
 p=shuffle(p);
 if(weak){const w=p.filter(q=>data.review[q.id]||(data.stat[q.id]&&!data.stat[q.id].last));p=w.concat(p.filter(q=>!w.includes(q)))}
 PW.list=p.slice(0,PW.n).sort((a,b)=>a.id<b.id?-1:1);
 const info=document.getElementById('pinfo');if(info)info.textContent='已抽 '+PW.list.length+' 題。';
 let h='<div class="phead"><b>P6 常識工作紙 · 最後的皇朝／中國近年的發展</b><span>姓名：Ansbie　日期：＿＿＿＿　分數：＿＿/'+PW.list.length+'</span></div>';
 const usedSrc={};
 PW.list.forEach((q,i)=>{
  h+='<div class="pq">';
  if(q.src&&!usedSrc[q.src]){usedSrc[q.src]=1;const s=SRC[q.src];h+='<div class="src"><b>'+esc(s.title)+'</b>'+esc(s.text)+'<span class="cite">'+esc(s.cite)+'</span></div>'}
  else if(q.src)h+='<div class="muted">（參考上面「'+esc(SRC[q.src].title)+'」）</div>';
  if(q.pic)h+='<div class="pic">'+esc(q.pic)+'</div>';
  h+='<div class="stem">'+(i+1)+'. 【'+TYPE[q.type]+'】'+esc(q.q)+'</div>';
  if(q.type==='mcq'||q.type==='multi')h+=q.options.map((o,j)=>'<div>　'+L[j]+'. '+esc(o)+'</div>').join('')+'<div>答案：＿＿＿＿</div>';
  else if(q.type==='tf')h+='<div>答案（✓ / ✗）：＿＿＿＿</div>';
  else if(q.type==='order')h+=q.options.map((o,j)=>'<div>　'+L[j]+'. '+esc(o)+'</div>').join('')+'<div>次序：＿＿ → ＿＿ → ＿＿ → ＿＿'+(q.options.length>4?' → ＿＿':'')+'</div>';
  else if(q.type==='match')h+='<div style="display:flex;gap:20pt"><div>'+q.items.map((it,j)=>'<div>'+(j+1)+'. '+esc(it)+'　＿＿</div>').join('')+'</div><div>'+q.options.map((o,j)=>'<div>'+L[j]+'. '+esc(o)+'</div>').join('')+'</div></div>';
  else if(q.type==='short')h+='<div class="line"></div><div class="line"></div><div class="line"></div>';
  else h+='<div class="line" style="width:60%"></div>';
  h+='</div>';
 });
 if(PW.key){
  h+='<div class="pkey"><h2>答案及解說</h2>'+PW.list.map((q,i)=>'<div class="pq"><b>'+(i+1)+'.</b> '+answerText(q)+'<div class="muted">'+esc(q.explain)+'</div></div>').join('')+'</div>';
 }
 document.getElementById('pr').innerHTML=h;
}
// ---- events ----
app.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.diff){diffSel=t.dataset.diff;sv('diff',diffSel);home();return}
 if(t.hasAttribute('data-home')){clearInterval(tick);home();return}
 if(t.dataset.go==='print'){printSetup();return}
 if(t.dataset.go){start(t.dataset.go,{});return}
 if(t.dataset.cat){start('category',{cat:t.dataset.cat});return}
 if(t.dataset.sub){start('category',{sub:t.dataset.sub});return}
 if(t.dataset.tut){tutorial(t.dataset.tut);return}
 if(t.dataset.ps){const s=t.dataset.ps;PW.subs=PW.subs.includes(s)?PW.subs.filter(x=>x!==s):PW.subs.concat(s);if(!PW.subs.length)PW.subs=[s];printSetup();return}
 if(t.dataset.pd){PW.diff=t.dataset.pd;printSetup();return}
 if(t.dataset.pn){PW.n=+t.dataset.pn;printSetup();return}
 if(t.id==='pshuf'){buildPrint();return}
 if(t.id==='pgo'){buildPrint();window.print();return}
 if(t.dataset.o!=null&&S&&!S.done){
  const i=+t.dataset.o;
  if(S.q.type==='multi'){S.pick=S.pick.includes(i)?S.pick.filter(x=>x!==i):S.pick.concat(i);t.classList.toggle('sel')}
  else{S.pick=i;app.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel')}
  return;
 }
 if(t.id==='hintBtn'&&S){const q=S.q,box=document.getElementById('hints');
  if(S.hint<q.hints.length){box.insertAdjacentHTML('beforeend','<div class="hint">💡 提示 '+(S.hint+1)+'：'+esc(q.hints[S.hint])+'</div>');S.hint++;t.textContent=S.hint<q.hints.length?'💡 再提示 ('+(q.hints.length-S.hint)+')':'📖 看課題重點'}
  else{box.insertAdjacentHTML('beforeend','<ul class="tut">'+SUBS[q.sub].tut.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');t.disabled=true}
  return}
 if(t.id==='sub'){submit(false);return}
 if(t.id==='next'){next();return}
});
app.addEventListener('change',e=>{if(e.target.id==='pkey'){PW.key=e.target.checked;buildPrint()}if(e.target.id==='pweak')buildPrint()});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'&&e.target.tagName==='INPUT'){e.preventDefault();if(S&&!S.done)submit(false);else if(S)next()}});
window.__gs={QS,norm,checkFill,checkShort,checkOrder,count:QS.length,TEST};
home();
</script></body></html>
