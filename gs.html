<script type="application/json" id="gs-data">{"cats":{"L1":{"name":"第一課 最後的皇朝","short":"最後的皇朝","color":"#e8590c","emoji":"🏯"},"L4":{"name":"第四課 中國近年的發展","short":"中國近年的發展","color":"#1c7ed6","emoji":"🚄"}},"subs":{"L1a":{"cat":"L1","name":"清朝早期的盛世與轉弱","tut":["清朝是中國最後一個由皇帝統治的朝代，由滿族人建立。","康熙：大力提倡選用人才不分種族（滿、漢一律任用）。","雍正：嚴懲貪官，整頓朝廷貪污風氣，嚴查虧空，充實國庫，改善財政。","乾隆：派兵平定準噶爾叛亂，擴大清朝版圖。","乾隆晚年國勢開始轉弱：官員貪污受賄、破壞法紀；多次（六次）遊江南，花費龐大，令國庫空虛；人口增長迅速，農民耕地不足，生活困苦。"]},"L1b":{"cat":"L1","name":"鴉片戰爭","tut":["清朝中期以後，英國商人在中國販賣（走私）鴉片。","鴉片的禍害：國民健康受損、精神萎靡；軍隊戰鬥力下降；大量白銀外流，國家財政拮据；官員受賄，破壞法紀；影響家庭和諧和社會安定。","1839年：清政府派林則徐到廣州查禁鴉片，林則徐在虎門銷毀大量鴉片。","1840年：英國不滿，派兵攻打中國，爆發鴉片戰爭。","1842年：清政府戰敗，被迫與英國簽訂不平等的《南京條約》。"]},"L1c":{"cat":"L1","name":"不平等條約","tut":["《南京條約》（1842，鴉片戰爭）：香港島給予英國管治；向英國大額賠款；開放廣州、上海等五個港口為通商口岸。","《北京條約》（1860，英法聯軍之役 1856–1860）：九龍半島（南部）交予英國管治；向英國和法國大額賠款；增開天津為通商口岸。","《馬關條約》（1895，中日甲午戰爭 1894–1895）：遼東半島、台灣及澎湖列島讓予日本；向日本大額賠款；增開四個通商口岸。","《辛丑和約》（1901，八國聯軍之役 1900–1901）：向列強大額賠款；拆除大沽口到北京的所有炮台；容許聯軍在北京至山海關一帶駐軍。","相似要求：割地、賠款、開放通商口岸（及駐軍）。影響：賠款加重財政負擔→加重稅收，人民生活困苦；割地令領土不完整；開放通商口岸令中國商人面對外國工業品的激烈競爭；國勢更加衰弱。","與香港有關：《南京條約》（香港島）、《北京條約》（九龍半島南部）。"]},"L1d":{"cat":"L1","name":"辛亥革命與清朝滅亡","tut":["孫中山，原名孫文，廣東省香山縣人，早年在香港接受中學和大學教育。","部分國民認為清政府腐敗無能，只有推翻它才能救國。","1905年：孫中山成立中國同盟會，於世界各地組織有志救國人士參加革命。","革命人士發動多次起義都不成功，較著名的有「黃花崗之役」。","1911年：武昌起義成功，史稱「辛亥革命」。","孫中山被推舉為臨時大總統；1912年1月1日中華民國成立，清朝隨後滅亡，結束了中國二千多年的帝制統治。"]},"L4a":{"cat":"L4","name":"經濟發展的影響","tut":["正面：人民收入普遍增加，消費能力越來越強；工廠提供大量低技術及低學歷的職位，失業率下降；生活質素得到提升。","負面：物價上漲；環境污染（空氣、水污染）；大量農民到城市工作，留下孩子在農村，出現「留守兒童」；城市交通擠塞。","課本資料：平均每年約有一千萬名農民從農村走到城市；2017年城市農民工月均收入比農村高約20%；2015年中國有六千多萬名留守兒童。"]},"L4b":{"cat":"L4","name":"科技發展","tut":["中國近年注重（創新）科技發展，以推動經濟，改善人民生活質素。","航天科技：探月車「玉兔號」。 航空科技：大型噴射式民用飛機C919、水陸兩棲飛機「鯤龍600」。","資訊科技：超級電腦「神威·太湖之光」（可用於太空科研、大型飛機和高速列車設計、生物醫學等）。","農業科技：雜交水稻（袁隆平，「雜交水稻之父」），提高水稻產量。 能源科技：電動車、氫能源電動車（不排出二氧化碳，環保）。","海陸：「蛟龍號」載人潛水器（2012年下潛突破7000米）；高鐵「復興號」（2017年時速350公里，北京至上海約4小時）；廣深港高鐵香港段總站在香港西九龍。"]},"L4c":{"cat":"L4","name":"中國在國際上的角色","tut":["經濟：2001年加入世界貿易組織（推動國際貿易自由和平等地進行）；2015年由中國發起的亞洲基礎設施投資銀行正式成立（向亞洲各國和地區提供資金，發展基礎建設）；2013年提出「一帶一路」倡議，2017年在北京舉行「一帶一路」國際合作高峰論壇。","「一帶」＝絲綢之路經濟帶；「一路」＝21世紀海上絲綢之路。","公共衞生：中國香港代表陳馮富珍由2007年起擔任世界衞生組織總幹事達十年。","文化、教育：2013年郝平擔任聯合國教科文組織大會主席。","體育：2008年北京奧林匹克運動會；2022年北京冬季奧林匹克運動會。","好處：提升國際地位；維護世界安全；保障全球經濟增長；共同解決全球問題。"]},"L4d":{"cat":"L4","name":"認識和關心中國","tut":["途徑：閱讀和中國有關的新聞、報章；參觀和中國有關的展覽、博物館；參加內地考察團、交流團；到內地探親或旅遊；瀏覽可靠網頁、閱讀書籍。"]}},"src":{"opium":{"title":"資料：鴉片戰爭的經過","text":"鴉片戰爭以前，英國從中國購買的貨物多，但賣給中國的東西少。為了扭轉這種逆差，英國商人向中國走私鴉片，獲取暴利。鴉片令許多中國人成為癮君子，大量白銀外流，國家財政拮据。\n1839年，清政府派林則徐到廣州查禁鴉片。林則徐在虎門把搜查到的鴉片全部銷毀。\n英國政府不滿，於1840年派兵攻打中國，鴉片戰爭爆發。清軍節節敗退，1842年，清政府被迫與英國簽訂不平等的《南京條約》，戰爭結束。","cite":"根據課本《最後的皇朝》及模擬試卷資料整理"},"rice":{"title":"資料：稻田裏的科學家","text":"袁隆平（1929–2021）是中國家喻戶曉的科學家，被譽為「雜交水稻之父」。\n雜交水稻是透過選用兩個具有不同特性、能互補不足的水稻品種進行雜交育種，因此產量通常較高。\n袁隆平於1960年代開始研究，成功培育世界上第一個可應用於大面積生產的雜交水稻品種「南優2號」。1976年起，研究成果開始在全國生產，大幅提升了水稻產量。\n1991年，他成為聯合國糧農組織首席顧問；2004年更榮獲「世界糧食獎」。中國接近一半的水稻生產地區都種植了雜交水稻，每年為大約7000萬人口供給糧食。他和團隊還到印度、巴基斯坦、越南等地，為當地水稻研究人員提供意見。","cite":"資料整理自蜜蜂試卷模擬卷（原資料：報章報道、世界糧食獎官方網頁）"},"farm":{"title":"資料：經濟發展與農民工","text":"• 平均每年約有一千萬名農民從農村走到城市工作和生活。\n• 2017年，在城市工作的農民工月均收入比留在農村工作的農民工高約20%。\n• 2015年，中國有六千多萬名留守兒童。\n• 中國現時有二百多種工業產品，產量居世界第一位。\n• 北京空氣污染預警由2016年12月30日啟動，持續了二百多個小時。\n• 工廠提供了大量低技術及低學歷的職位。","cite":"資料整理自課本《中國近年的發展》（原資料：國家統計局網站、《明報》網站）"},"news":{"title":"資料：兩篇報道（2018年7月）","text":"報道一：《2018年全球創新指數》報告顯示，中國首次躋身前20名，在科研人員、技術專利和科技出版物的數量，中國均位居全球第一。\n報道二：有學院院長認為中國的高端科技發展仍處於中低水平。以電腦和電子產品生產為例，2017年中國便需從外國輸入總值2601億美元的晶片產品。","cite":"資料整理自課本《中國近年的發展》"},"sc_museum":{"title":"情境：參觀博物館","text":"智信和美兒跟家人到廣東東莞參觀鴉片戰爭博物館。\n智信：「導賞員說，這裏就是當年林則徐銷毀鴉片的地方！」\n美兒：「為甚麼英國人會這麼生氣，還派兵來打仗呢？」","cite":"模擬情境（事實根據課本《最後的皇朝》）"},"sc_tv":{"title":"情境：看古裝劇","text":"晚飯後，一家人在看古裝劇。劇中的皇帝說：「朕已派兵平定準噶爾叛亂，奠定了清朝的版圖！朕還要再下江南遊玩。」\n爸爸：「這位皇帝在位時，清朝很強盛，但到了他晚年，國勢就開始轉弱了。」","cite":"模擬情境（事實根據課本《最後的皇朝》）"},"sc_sun":{"title":"情境：中區史蹟徑","text":"老師帶同學們走「孫中山史蹟徑」。\n老師：「這位『國父』年輕時在香港讀中學和大學，他在香港接觸到新思想，後來立志推翻清政府。」\n小晴：「他成功了嗎？」","cite":"模擬情境（事實根據課本《最後的皇朝》）"},"sc_tst":{"title":"情境：尖沙咀海旁","text":"安琪和爸爸在尖沙咀海旁散步。\n爸爸：「1860年，清政府打敗仗後簽了一條條約，九龍半島南部就交了給英國管治。」\n安琪：「那麼對岸的香港島呢？」\n爸爸：「香港島更早，是1842年鴉片戰爭後的條約交出去的。」","cite":"模擬情境（事實根據課本《最後的皇朝》）"},"sc_hsr":{"title":"情境：坐高鐵上北京","text":"暑假，子健一家從香港西九龍站坐高鐵出發去北京旅行。\n子健：「我想去參觀當年奧運會的比賽場地『鳥巢』（國家體育場）！」\n媽媽：「中國的高鐵發展很快，『復興號』由北京到上海只需約4小時呢。」","cite":"模擬情境（事實根據課本《中國近年的發展》）"},"sc_village":{"title":"情境：一通電話","text":"在內地一條偏遠農村裏，小芳正和遠在城市工廠工作的媽媽通電話。\n小芳：「媽媽，我很想你和爸爸，你們甚麼時候回來？」\n媽媽：「乖，春節我們就回來。城市的工資比在家鄉高，我們要多賺點錢給你讀書。」\n小芳平日由年老的祖父母照顧，一年只能見父母一、兩次。","cite":"模擬情境（事實根據課本《中國近年的發展》）"},"sc_smog":{"title":"情境：電視新聞","text":"新聞報道：「北京空氣污染預警持續多日，市民外出要戴口罩。專家指，工廠和汽車排放的廢氣是主要污染來源之一。」\n明明：「為甚麼經濟發展得這麼快，空氣卻變差了？」","cite":"模擬情境（事實根據課本《中國近年的發展》）"},"sc_tour":{"title":"情境：學校通告","text":"學校將於十月舉辦「北京歷史文化交流團」，六年級同學會參觀故宮、長城和國家體育場（鳥巢），並與當地學生一起上課。\n小明：「參觀古蹟好悶啊，我不想去。」\n小慧：「但這是認識國家的好機會呀！」","cite":"模擬情境（事實根據課本《中國近年的發展》）"},"six_hm":{"title":"資料：虎門銷煙","text":"1839年，清政府派林則徐到廣州查禁鴉片。林則徐在廣州採取嚴厲措施，收繳了大批走私鴉片，然後在虎門把它們全部當眾銷毀。他認為鴉片令國民健康受損，又令大量白銀外流，必須嚴禁。英國政府對此十分不滿，翌年（1840年）便派兵攻打中國，鴉片戰爭爆發。","cite":"資料整理自課本《最後的皇朝》及試題庫資料"},"six_bri":{"title":"資料：「一帶一路」","text":"2013年，習近平主席提出「一帶一路」倡議。「一帶」是指絲綢之路經濟帶，「一路」是指21世紀海上絲綢之路。倡議的目的是促進中國與沿線各國和地區的經濟合作。2017年，中國在北京舉行了「一帶一路」國際合作高峰論壇。","cite":"資料整理自課本《中國近年的發展》"}},"questions":[{"id":"L1a-01","sub":"L1a","type":"mcq","diff":"easy","q":"清朝是由哪個民族建立的朝代？","options":["漢族","滿族","蒙古族","回族"],"answer":1,"hints":["清朝是中國最後一個朝代。","課本：「清朝是中國最後一個由皇帝統治的朝代，由＿族人建立。」","康熙要「不分滿漢」任用人才，因為皇帝本身是滿族。"],"explain":"清朝由滿族人建立，所以康熙要強調滿族、漢族人才一律任用。","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1a-02","sub":"L1a","type":"mcq","diff":"easy","q":"清朝哪位皇帝在任內大力提倡選用人才不分種族？","options":["乾隆","雍正","道光","康熙"],"answer":3,"hints":["清朝早期三位皇帝：康熙 → 雍正 → 乾隆。","這位皇帝說：「無論是滿族還是漢族人，只要是人才，朕一律任用。」"],"explain":"康熙大力提倡選用人才不分種族，只要是賢能之士都會任用，消除漢族士人的反抗意識。","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1a-03","sub":"L1a","type":"mcq","q":"哪位皇帝嚴懲貪官，整頓朝廷貪污風氣，嚴查虧空，改善清朝財政？","options":["康熙","雍正","乾隆","光緒"],"answer":1,"hints":["他在康熙之後、乾隆之前。","「朕要嚴懲貪官，掃除朝廷內的貪污風氣。」"],"explain":"雍正整頓朝廷貪污風氣，令吏治清明，嚴查虧空，充實國庫，改善清朝財政體制。","diff":"medium","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1a-04","sub":"L1a","type":"mcq","q":"哪位皇帝派兵平定了準噶爾叛亂，擴大了清朝版圖？","options":["康熙","雍正","乾隆","道光"],"answer":2,"hints":["根據課本，是清朝早期第三位皇帝。","他晚年多次遊江南。"],"explain":"乾隆派兵平定準噶爾叛亂，平定邊疆外族，擴大清朝版圖。","diff":"medium","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1a-05","sub":"L1a","type":"tf","diff":"easy","q":"乾隆皇帝六次下西洋，花費龐大。","answer":false,"hints":["「下西洋」是明朝鄭和的事。","乾隆是「遊」去中國哪個地區？"],"explain":"錯。乾隆皇帝是六次遊江南（下江南），花費龐大，令國庫空虛。「下西洋」是明朝鄭和。","accept":[],"fmt":"判斷","cat":"L1"},{"id":"L1a-06","sub":"L1a","type":"multi","q":"為甚麼到了乾隆皇帝晚年，清朝國勢開始轉弱？（可選多於一個）","options":["官員貪污受賄，破壞法紀","多次遊江南，令國庫空虛","人口增長迅速，農民耕地不足","英國派兵攻打北京"],"answer":[0,1,2],"hints":["想想課本的三幅圖：官員送禮、皇帝坐船遊江南、農民說「田地不足」。","英國攻打中國是1840年鴉片戰爭，那時已不是乾隆在位。"],"explain":"乾隆晚年：官員貪污受賄；皇帝多次遊江南令國庫空虛；人口增長迅速但耕地不足。英國派兵是後來鴉片戰爭的事。","diff":"hard","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1a-07","sub":"L1a","type":"fill","diff":"easy","q":"清朝早期，在康熙、雍正和＿＿＿＿皇帝的統治下，國勢強盛。","answer":"乾隆","hints":["清初三位有作為的皇帝。","他平定了準噶爾叛亂。"],"explain":"清朝早期的三位皇帝：康熙、雍正和乾隆，國勢強盛。","accept":[],"fmt":"填充","cat":"L1"},{"id":"L1a-08","sub":"L1a","type":"fill","q":"清朝的國勢在＿＿＿＿皇帝晚年時開始轉弱。","answer":"乾隆","accept":["乾隆皇帝"],"hints":["是清初三位皇帝中最後一位。","他晚年多次遊江南。"],"explain":"清朝國勢在乾隆晚年開始轉弱。","diff":"medium","fmt":"填充","cat":"L1"},{"id":"L1a-09","sub":"L1a","type":"match","q":"配對：以下清朝皇帝在任內做了甚麼事情？","items":["康熙","雍正","乾隆"],"options":["平定準噶爾叛亂","嚴查虧空，充實國庫","大力提倡選用人才不分種族","派林則徐到廣州查禁鴉片","簽訂《南京條約》"],"answer":[2,1,0],"hints":["D 和 E 都是清朝中期（道光年間）的事，不是清初三帝。","康熙：用人；雍正：反貪；乾隆：擴大版圖。"],"explain":"康熙－用人不分種族；雍正－整頓貪污、嚴查虧空；乾隆－平定準噶爾叛亂。","diff":"hard","accept":[],"fmt":"配對","cat":"L1"},{"id":"L1a-10","sub":"L1a","type":"short","diff":"hard","q":"試舉出兩個乾隆皇帝晚年清朝國勢開始轉弱的原因。","answer":"①官員貪污受賄，破壞法紀；②乾隆多次遊江南，花費不菲，令國庫空虛；③人口增長迅速，但農民耕地不足，生活困苦。（任答兩項）","groups":[["貪污","受賄","貪官","法紀"],["江南","國庫","空虛","花費","遊樂"],["人口","耕地","田地","糊口"]],"need":2,"hints":["課本有三幅圖：官員、遊船、農民。","每一個原因寫一句完整的句子。"],"explain":"寫出任何兩項：官員貪污、國庫空虛、人口多耕地不足。","accept":[],"fmt":"簡答／問答","cat":"L1"},{"id":"L1a-11","sub":"L1a","type":"fix","q":"判斷修正：「康熙派兵平定了準噶爾叛亂，奠定了清朝的版圖。」句子中錯誤的部分應改為甚麼？","answer":"乾隆","accept":["乾隆皇帝"],"hints":["句子講的是皇帝做的事，錯在人名。","平定準噶爾叛亂的皇帝晚年遊江南。"],"explain":"課本：乾隆派兵平定準噶爾叛亂，奠定清朝版圖。所以「康熙」應改為「乾隆」。","diff":"medium","fmt":"判斷修正","cat":"L1"},{"id":"L1a-12","sub":"L1a","type":"fix","diff":"easy","q":"判斷修正：「清朝是中國最後一個由皇帝統治的朝代，由漢族人建立。」錯誤的部分應改為甚麼？","answer":"滿族","accept":["滿族人","滿洲","滿洲人"],"hints":["錯在民族。","康熙要「不分滿漢」用人。"],"explain":"清朝由滿族人建立。","fmt":"判斷修正","cat":"L1"},{"id":"L1b-01","sub":"L1b","type":"mcq","diff":"easy","q":"清朝中期以後，哪個國家的商人在中國販賣鴉片？","options":["日本","法國","英國","美國"],"answer":2,"hints":["鴉片戰爭是中國和哪個國家打仗？","《南京條約》把香港島給予這個國家。"],"explain":"清朝中期以後，英國商人在中國販賣鴉片。","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1b-02","sub":"L1b","type":"multi","q":"清朝中期以後，大量國民沉迷吸食鴉片，對當時中國帶來甚麼禍害？（可選多於一個）","options":["死亡率大大提升，人口迅速減少","國民健康受損","軍隊吸食鴉片，影響戰鬥力","官員貪污受賄，破壞法紀"],"answer":[1,2,3],"hints":["課本列出的禍害包括：健康、軍隊、官員、家庭。","課本沒有說人口迅速減少。"],"explain":"鴉片令國民健康受損、軍隊戰鬥力下降、官員受賄破壞法紀，又令白銀外流。課本沒有提及「人口迅速減少」。","diff":"hard","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1b-03","sub":"L1b","type":"mcq","diff":"easy","q":"林則徐在哪裏銷毀大量鴉片？","options":["澳門","上海","香港","虎門"],"answer":3,"hints":["地點在廣東。","「＿＿銷煙」是著名的歷史事件。"],"explain":"1839年，林則徐在虎門銷毀大量鴉片（虎門銷煙）。他是被派到廣州查禁鴉片，但銷煙地點是虎門。","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1b-04","sub":"L1b","type":"fill","diff":"easy","q":"1839年，清政府派＿＿＿＿到廣州查禁鴉片。","answer":"林則徐","hints":["他是欽差大臣。","他在虎門銷煙。"],"explain":"清政府派林則徐到廣州查禁鴉片。","accept":[],"fmt":"填充","cat":"L1"},{"id":"L1b-05","sub":"L1b","type":"fill","q":"1839年，林則徐在＿＿＿＿把搜查到的走私鴉片銷毀。","answer":"虎門","hints":["不是廣州市內，是另一個地方。","「＿＿銷煙」。"],"explain":"林則徐在虎門銷毀鴉片。常見錯誤：寫成「廣州」。","diff":"medium","accept":[],"fmt":"填充","cat":"L1"},{"id":"L1b-06","sub":"L1b","type":"mcq","q":"鴉片戰爭在哪一年爆發？","options":["1839年","1840年","1842年","1856年"],"answer":1,"hints":["1839年是虎門銷煙。","1842年是簽訂《南京條約》。"],"explain":"1839年虎門銷煙 → 1840年英國派兵，鴉片戰爭爆發 → 1842年簽訂《南京條約》。","diff":"medium","accept":[],"fmt":"選擇","cat":"L1"},{"id":"L1b-07","sub":"L1b","type":"fill","diff":"easy","q":"清政府在鴉片戰爭中戰敗，被迫與英國簽訂《＿＿＿＿》。","answer":"南京條 ","type":"bank","fmt":"供詞填充","q":"供詞填充（年份）：選出正確的年份，填在橫線上。（有一個用不着）","items":["中國在＿＿＿年加入世界貿易組織。","陳馮富珍在＿＿＿年開始擔任世界衞生組織總幹事。","習近平主席在＿＿＿年提出「一帶一路」倡議。","亞洲基礎設施投資銀行在＿＿＿年正式成立。","北京在＿＿＿年舉辦冬季奧林匹克運動會。"],"options":["2015","2022","1997","2001","2013","2007"],"answer":[3,5,4,0,1],"hints":["2001 世貿 → 2007 世衞 → 2013 一帶一路 → 2015 亞投行 → 2022 冬奧。"],"explain":"2001、2007、2013、2015、2022。1997年是香港回歸，與這些事件無關。","diff":"medium","accept":[],"cat":"L4"},{"id":"L4d-x01","sub":"L4d","type":"bank","fmt":"供詞填充","q":"供詞填充：以下是認識和關心中國的途徑。選出適當的字詞，填在橫線上。（有一個用不着）","items":["閱讀和中國有關的＿＿＿和報章。","參觀和中國有關的＿＿＿或博物館。","參加中國內地＿＿＿或交流團。","到內地＿＿＿或旅遊。","瀏覽＿＿＿的網頁，閱讀相關書籍。"],"options":["考察團","可靠","新聞","傳聞","展覽","探親"],"answer":[2,4,0,5,1],"hints":["未經證實的「傳聞」不是好的資料來源。"],"explain":"新聞、展覽、考察團、探親、可靠。「傳聞」不可靠，用不着。","diff":"medium","accept":[],"cat":"L4"},{"id":"L1a-x02","sub":"L1a","type":"classify","q":"分類：以下哪些是清朝初期國勢鼎盛的原因？哪些是乾隆晚年國勢轉弱的原因？","items":["選用人才不分種族","官員貪污受賄","整頓朝廷貪污風氣","乾隆多次到江南巡視及遊樂","平定邊疆外族（準噶爾）","人口增長迅速，農民耕地不足"],"options":["清初鼎盛的原因","乾隆晚年轉弱的原因"],"answer":[0,1,0,1,0,1],"hints":["清初三帝做的好事＝鼎盛原因。","課本三幅圖（官員、遊船、農民）＝轉弱原因。"],"explain":"鼎盛：用人不分種族、整頓貪污、平定邊疆外族。轉弱：官員貪污、遊江南令國庫空虛、人口多耕地不足。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x04","sub":"L1c","type":"classify","q":"分類：以下哪些屬於《南京條約》的條款？哪些屬於《北京條約》的條款？","items":["把香港島給予英國管治","向英國大額賠款","把九龍半島南部交予英國管治","向英國和法國大額賠款","增開天津為通商口岸","開放廣州、上海等五個港口為通商口岸"],"options":["《南京條約》","《北京條約》"],"answer":[0,0,1,1,1,0],"hints":["《北京條約》是英法聯軍之役後簽的，所以賠款給「英國和法國」。"],"explain":"南京：香港島、向英國賠款、五口通商。北京：九龍半島南部、向英法賠款、增開天津。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x05","sub":"L1c","type":"classify","q":"分類：以下哪些屬於《馬關條約》的條款？哪些屬於《辛丑和約》的條款？","items":["向列強大額賠款","把遼東半島、台灣及澎湖列島讓予日本","拆除大沽口到北京的所有炮台","容許聯軍在北京至山海關一帶駐軍","向日本大額賠款","增開四個通商口岸"],"options":["《馬關條約》","《辛丑和約》"],"answer":[1,0,1,1,0,0],"hints":["《馬關條約》只和日本有關；《辛丑和約》和八國聯軍（列強）有關。"],"explain":"馬關：割遼東半島、台灣、澎湖；向日本賠款；增開四個通商口岸。辛丑：向列強賠款；拆炮台；聯軍駐軍。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x06","sub":"L1c","type":"classify","q":"分類：以下哪些是不平等條約對中國造成的影響？哪些不是？","items":["領土失去完整","羣眾更加支持清政府","清政府加重稅收，人民生活困苦","中國商人要面對外國工業產品的競爭","國勢更加衰弱","中國的國際地位大大提升"],"options":["是不平等條約造成的影響","不是不平等條約造成的影響"],"answer":[0,1,0,0,0,1],"hints":["不平等條約對中國有好處嗎？","人民生活困苦、國勢衰弱，羣眾會更支持清政府嗎？"],"explain":"影響：領土不完整、加稅令人民困苦、商人面對競爭、國勢衰弱。羣眾反而對清政府不滿，國際地位也沒有提升。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x07","sub":"L1c","type":"classify","q":"分類：清末，以下地方根據不平等條約交予哪個國家管治？","items":["香港島","九龍半島南部","台灣","澎湖列島","遼東半島"],"options":["英國","日本"],"answer":[0,0,1,1,1],"hints":["與香港有關的條約都是和英國簽的。","《馬關條約》：遼東半島、台灣及澎湖列島讓予日本。"],"explain":"英國：香港島（南京條約）、九龍半島南部（北京條約）。日本：台灣、澎湖列島、遼東半島（馬關條約）。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1d-x03","sub":"L1d","type":"classify","q":"分類：以下哪些事件與鴉片戰爭有關？哪些與辛亥革命有關？","items":["林則徐在虎門銷毀鴉片","孫中山成立中國同盟會","簽訂《南京條約》","黃花崗之役","英國派兵攻打中國","武昌起義"],"options":["與鴉片戰爭有關","與辛亥革命有關"],"answer":[0,1,0,1,0,1],"hints":["鴉片戰爭：1839–1842；辛亥革命：1905–1912 前後。"],"explain":"鴉片戰爭：虎門銷煙、英國派兵、《南京條約》。辛亥革命：同盟會、黃花崗之役、武昌起義。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x08","sub":"L1c","type":"classify","q":"分類：以下哪些事件與英國有關？哪些與日本有關？","items":["鴉片戰爭","中日甲午戰爭","簽訂《南京條約》","簽訂《馬關條約》","簽訂《北京條約》（英法聯軍之役）"],"options":["與英國有關","與日本有關"],"answer":[0,1,0,1,0],"hints":["「中日」甲午戰爭——名稱已有提示。"],"explain":"英國：鴉片戰爭、《南京條約》、《北京條約》。日本：甲午戰爭、《馬關條約》。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L1b-x02","sub":"L1b","type":"classify","q":"分類：吸食鴉片的禍害，哪些主要影響個人和家庭？哪些主要影響國家？","items":["國民健康受損，精神萎靡","大量白銀外流，國家財政拮据","花錢吸食鴉片，家庭不和","軍隊吸食鴉片，戰鬥力下降","官員受賄，對走私不加阻攔，破壞法紀"],"options":["個人和家庭","國家"],"answer":[0,1,0,1,1],"hints":["財政、軍隊、法紀都是國家層面的事。"],"explain":"個人和家庭：健康受損、家庭不和。國家：白銀外流財政拮据、軍隊戰鬥力下降、官員受賄破壞法紀。","fmt":"分類","diff":"medium","accept":[],"cat":"L1"},{"id":"L4a-x02","sub":"L4a","type":"classify","q":"分類：中國近年的經濟發展給社會帶來哪些正面影響？哪些負面影響？","items":["農村出現留守兒童","空氣污染","二百多種工業產品產量居世界第一位","物價上漲","失業率下降","人民收入提高"],"options":["正面影響","負面影響"],"answer":[1,1,0,1,0,0],"hints":["令生活變好＝正面；令生活變差＝負面。"],"explain":"正面：工業產量高、失業率下降、收入提高。負面：留守兒童、空氣污染、物價上漲。","fmt":"分類","diff":"medium","accept":[],"cat":"L4"},{"id":"L4a-x03","sub":"L4a","type":"classify","q":"分類：以下哪些是農民到城市工作的原因？哪些是因此而出現的問題？","items":["城市工作的月均收入比農村高約20%","城市工廠提供大量低技術職位","孩子留在農村，缺乏父母照顧","希望改善生活質素","城市交通擠塞","父母和子女的關係變得疏離"],"options":["農民到城市工作的原因","因此出現的問題"],"answer":[0,0,1,0,1,1],"hints":["原因＝吸引他們去的東西；問題＝去了之後出現的壞處。"],"explain":"原因：收入較高、職位多、改善生活。問題：留守兒童缺乏照顧、交通擠塞、親子關係疏離。","fmt":"分類","diff":"medium","accept":[],"cat":"L4"},{"id":"L4b-x03","sub":"L4b","type":"classify","q":"分類：以下哪些是雜交水稻的特點和成就？哪些是氫能源電動車的特點和成就？","items":["提高水稻產量","不會排出二氧化碳","有助紓緩糧食短缺問題","高效、安靜","對環境起保護作用","為大量人口供給糧食"],"options":["雜交水稻","氫能源電動車"],"answer":[0,1,0,1,1,0],"hints":["水稻和「糧食」有關；電動車和「環保」有關。"],"explain":"雜交水稻：產量高、紓緩糧食短缺、供給大量人口糧食。氫能源電動車：不排出二氧化碳、高效安靜、保護環境。","fmt":"分類","diff":"medium","accept":[],"cat":"L4"},{"id":"L4b-x04","sub":"L4b","type":"classify","q":"分類：以下科技成就屬於哪一類科技？","items":["探月車「玉兔號」","大型噴射式民用飛機C919","水陸兩棲飛機「鯤龍600」","雜交水稻","電動車","超級電腦「神威·太湖之光」"],"options":["航天科技","航空科技","農業科技","能源科技","資訊科技"],"answer":[0,1,1,2,3,4],"hints":["航天＝太空；航空＝飛機（C919 和 鯤龍600 都是飛機）。"],"explain":"航天：玉兔號。航空：C919、鯤龍600。農業：雜交水稻。能源：電動車。資訊：神威·太湖之光。","fmt":"分類","diff":"medium","accept":[],"cat":"L4"},{"id":"L4c-x03","sub":"L4c","type":"classify","q":"分類：以下事件屬於中國在國際上哪一方面的角色？","items":["加入世界貿易組織","發起亞洲基礎設施投資銀行","倡議「一帶一路」","陳馮富珍擔任世界衞生組織總幹事","舉辦2008年北京奧運會","郝平擔任聯合國教科文組織大會主席","舉辦2022年北京冬奧會"],"options":["經濟","公共衞生","體育","文化、教育"],"answer":[0,0,0,1,2,3,2],"hints":["貿易、銀行、一帶一路都和錢、做生意有關＝經濟。"],"explain":"經濟：世貿、亞投行、一帶一路。公共衞生：陳馮富珍（世衞）。體育：北京奧運、北京冬奧。文化教育：郝平（教科文組織）。","fmt":"分類","diff":"medium","accept":[],"cat":"L4"},{"id":"L4d-x02","sub":"L4d","type":"classify","q":"分類：以下哪些是認識和關心中國的合適方法？哪些不合適？","items":["閱讀和中國有關的新聞","只相信社交網站上未經證實的傳聞","參加內地交流團","參觀和中國有關的展覽","從不留意國家的時事","到內地探親或旅遊"],"options":["合適","不合適"],"answer":[0,1,0,0,1,0],"hints":["資料來源要可靠；要主動關心。"],"explain":"合適：看新聞、交流團、參觀展覽、探親旅遊。不合適：只信未經證實的傳聞、從不留意時事。","fmt":"分類","diff":"medium","accept":[],"cat":"L4"},{"id":"L4b-x05","sub":"L4b","type":"classify","q 關條約》","雙方和談，簽訂平等條約"],"answer":1,"hints":["鴉片戰爭→哪條條約？"],"explain":"1842年清政府戰敗，被迫與英國簽訂不平等的《南京條約》，香港島給予英國管治。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1a-x03","sub":"L1a","type":"fill","fmt":"生活情境","src":"sc_tv","diff":"easy","q":"根據情境，劇中的演員在扮演哪位清朝皇帝？","answer":"乾隆","accept":["乾隆皇帝","乾隆帝"],"hints":["平定準噶爾叛亂＋下江南。"],"explain":"平定準噶爾叛亂、多次下江南的是乾隆。","cat":"L1"},{"id":"L1a-x04","sub":"L1a","type":"short","fmt":"生活情境","src":"sc_tv","q":"除了劇中這位皇帝，清朝早期還有哪位有作為的皇帝？他做了甚麼？","answer":"例如：康熙──大力提倡選用人才不分種族；或雍正──嚴懲貪官，整頓朝廷貪污風氣，嚴查虧空，改善財政。","groups":[["康熙","雍正"],["種族","人才","滿","漢","貪","虧空","財政","國庫"]],"need":2,"hints":["清初三帝：康熙、雍正、乾隆。","寫出皇帝名字＋他的一項政績。"],"explain":"康熙：用人不分種族；雍正：整頓貪污、嚴查虧空。寫其中一位及其政績即可。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1a-x05","sub":"L1a","type":"short","fmt":"生活情境","src":"sc_tv","q":"根據情境，爸爸說「到了他晚年，國勢就開始轉弱」。試從劇中皇帝的說話，指出一個國勢轉弱的原因，並加以解釋。","answer":"皇帝多次下江南巡視及遊樂，花費龐大，令國庫空虛，因此國勢轉弱。（亦可答：官員貪污受賄；人口增長迅速，耕地不足。）","groups":[["江南","遊玩","遊樂","巡視"],["國庫","空虛","花費","花錢","財政"]],"need":2,"hints":["劇中皇帝說「再下江南遊玩」。","遊江南要用很多錢→國庫？"],"explain":"從劇中對白：多次遊江南→花費龐大→國庫空虛。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1d-x04","sub":"L1d","type":"fill","fmt":"生活情境","src":"sc_sun","diff":"easy","q":"根據情境，老師口中的「國父」是誰？","answer":"孫中山","accept":["孫文","孫中山先生","孫逸仙"],"hints":["他成立了中國同盟會。"],"explain":"「國父」是孫中山（原名孫文）。","cat":"L1"},{"id":"L1d-x05","sub":"L1d","type":"short","fmt":"生活情境","src":"sc_sun","q":"小晴問：「他成功了嗎？」試簡述孫中山由成立組織到推翻清朝的經過。","answer":"孫中山在1905年成立中國同盟會，組織有志救國的人士參加革命；經過多次起義失敗後，1911年武昌起義成功（辛亥革命），1912年中華民國成立，孫中山被推舉為臨時大總統，清朝隨後滅亡。","groups":[["同盟會"],["武昌","辛亥"],["中華民國","民國","滅亡","推翻"]],"need":2,"hints":["按次序寫：1905 → 1911 → 1912。"],"explain":"同盟會（1905）→ 武昌起義／辛亥革命（1911）→ 中華民國成立、清朝滅亡（1912）。","diff":"hard","accept":[],"cat":"L1"},{"id":"L1d-x06","sub":"L1d","type":"mcq","fmt":"生活情境","src":"sc_sun","q":"根據情境，孫中山和香港有甚麼淵源？","options":["他在香港接受中學和大學教育","他在香港簽訂《南京條約》","他是香港第一任總督","他在香港發動武昌起義"],"answer":0,"hints":["老師說他「年輕時在香港讀書」。"],"explain":"孫中山早年在香港接受中學和大學教育。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x12","sub":"L1c","type":"mcq","fmt":"生活情境","src":"sc_tst","q":"根據情境，爸爸說的「1860年……簽了一條條約」是哪一條條約？","options":["《南京條約》","《北京條約》","《馬關條約》","《辛丑和約》"],"answer":1,"hints":["1860年＝英法聯軍之役結束。"],"explain":"1860年《北京條約》把九龍半島南部交予英國管治。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x13","sub":"L1c","type":"fill","fmt":"生活情境","src":"sc_tst","q":"根據情境，「香港島……是1842年鴉片戰爭後的條約交出去的」，這條約是《＿＿＿＿》。","answer":"南京條約","hints":["鴉片戰爭→？"],"explain":"1842年《南京條約》把香港島給予英國管治。","diff":"medium","accept":[],"cat":"L1"},{"id":"L1c-x14","sub":"L1c","type":"short","fmt":"生活情境","src":"sc_tst","q":"為甚麼這些條約被稱為「不平等條約」？試舉條約內的一項條款作例子。","answer":"因為清政府在戰敗後被迫簽訂，沒有得到平等待遇，條約內容損害中國的利益和主權，例如要割地（把九龍半島南部交予英國管治）、賠款和開放通商口岸。","groups":[["被迫","不平等","不公平","戰敗","損害","主權","利益"],["割地","九龍","香港島","賠款","通商口岸","口岸"]],"need":2,"hints":["想想簽約時雙方地位平等嗎？","條款例子：割＿、賠＿、開放通商＿＿。"],"explain":"要寫原因（被迫、損害主權利益）＋條款例子（割地、賠款、通商口岸）。","diff":"hard","accept":[],"cat":"L1"},{"id":"L4b-x07","sub":"L4b","type":"fill","fmt":"生活情境","src":"sc_hsr","diff":"easy","q":"根據情境，子健一家在哪個高鐵站出發？香港＿＿＿＿站","answer":"西九龍","accept":["香港西九龍","西九龍站"],"hints":["廣深港高鐵香港段的總站。"],"explain":"廣深港高鐵香港段總站：香港西九龍站。","cat":"L4"},{"id":"L4c-x05","sub":"L4c","type":"mcq","fmt":"生活情境","src":"sc_hsr","q":"根據情境，子健想參觀的「鳥巢」是哪項國際體育盛事的比賽場地？","options":["2008年北京奧林匹克運動會","2022年杭州亞運會","2010年上海世界博覽會","1997年香港回歸典禮"],"answer":0,"hints":["子健說「當年奧運會的比賽場地」。"],"explain":"國家體育場（鳥巢）是2008年北京奧運會的主場館。","diff":"medium","accept":[],"cat":"L4"},{"id":"L4c-x06","sub":"L4c","type":"short","fmt":"生活情境","src":"sc_hsr","q":"舉辦奧運會這類大型國際體育賽事，對中國有甚麼好處？試舉一項。","answer":"例如：可以提升中國的國際地位；讓世界各地的人認識中國；加強中國與各國的交流和合作。","groups":[["國際地位","地位","形象"],["認識中國","交流","合作","旅遊","經濟"]],"need":1,"hints":["課本：中國在國際上扮演重要角色有助提升＿＿＿＿。"],"explain":"合理即可，例如提升國際地位、加強國際交流。","diff":"hard","accept":[],"cat":"L4"},{"id":"L4b-x08","sub":"L4b","type":"mcq","fmt":"生活情境","src":"sc_hsr","q":"根據情境，媽媽提及的「復興號」反映了中國在哪方面的發展？","options":["高速鐵路（交通運輸）科技","農業科技","航天科技","醫療衞生"],"answer":0,"hints":["「復興號」是高鐵列車。"],"explain":"「復興號」高鐵（2017年時速3 let PW={subs:Object.keys(SUBS),diff:'all',n:20,key:true,list:[]};
function printSetup(){
 window.scrollTo(0,0);
 app.innerHTML='<div class="card"><h2>🖨️ 列印工作紙</h2><b>課題</b><div class="chips">'+Object.keys(SUBS).map(s=>'<button class="chip'+(PW.subs.includes(s)?' on':'')+'" data-ps="'+s+'">'+esc(CATS[SUBS[s].cat].emoji+' '+SUBS[s].name)+'</button>').join('')+'</div>'+
  '<b>難度</b><div class="chips">'+[['all','全部'],['easy','淺'],['medium','中'],['hard','深']].map(([k,t])=>'<button class="chip'+(PW.diff===k?' on':'')+'" data-pd="'+k+'">'+t+'</button>').join('')+'</div>'+
  '<b>題數</b><div class="chips">'+[10,20,30,40].map(n=>'<button class="chip'+(PW.n===n?' on':'')+'" data-pn="'+n+'">'+n+'</button>').join('')+'</div>'+
  '<label style="display:block;margin:8px 0"><input type="checkbox" id="pkey"'+(PW.key?' checked':'')+'> 另頁附答案及解說</label>'+
  '<label style="display:block;margin:8px 0"><input type="checkbox" id="pweak"> 優先選做錯過的題目</label>'+
  '<div class="row"><button class="btn pri" id="pgo">🖨️ 列印 / 儲存 PDF</button><button class="btn" id="pshuf">🔀 重新抽題</button></div><p class="muted" id="pinfo"></p>'+
  '<div class="row"><button class="btn" data-home>← 返回</button></div></div>';
 buildPrint();
}
function buildPrint(){
 const weak=document.getElementById('pweak')&&document.getElementById('pweak').checked;
 let p=QS.filter(q=>PW.subs.includes(q.sub)&&(PW.diff==='all'||q.diff===PW.diff));
 p=shuffle(p);
 if(weak){const w=p.filter(q=>data.review[q.id]||(data.stat[q.id]&&!data.stat[q.id].last));p=w.concat(p.filter(q=>!w.includes(q)))}
 PW.list=p.slice(0,PW.n).sort((a,b)=>a.id<b.id?-1:1);
 const info=document.getElementById('pinfo');if(info)info.textContent='已抽 '+PW.list.length+' 題。';
 let h='<div class="phead"><b>P6 常識工作紙 · 最後的皇朝／中國近年的發展</b><span>姓名：Ansbie　日期：＿＿＿＿　分數：＿＿/'+PW.list.length+'</span></div>';
 const usedSrc={};
 PW.list.forEach((q,i)=>{
  h+='<div class="pq">';
  if(q.src&&!usedSrc[q.src]){usedSrc[q.src]=1;const s=SRC[q.src];h+='<div class="src"><b>'+esc(s.title)+'</b>'+esc(s.text)+'<span class="cite">'+esc(s.cite)+'</span></div>'}
  else if(q.src)h+='<div class="muted">（參考上面「'+esc(SRC[q.src].title)+'」）</div>';
  if(q.pic)h+='<div class="pic">'+esc(q.pic)+'</div>';
  if(q.svg)h+='<div class="svgbox">'+q.svg+'</div>';
  h+='<div class="stem">'+(i+1)+'. 【'+TL(q)+'】'+esc(q.q)+'</div>';
  if(q.type==='mcq'||q.type==='multi')h+=q.options.map((o,j)=>'<div>　'+L[j]+'. '+esc(o)+'</div>').join('')+'<div>答案：＿＿＿＿</div>';
  else if(q.type==='tf')h+='<div>答案（✓ / ✗）：＿＿＿＿</div>';
  else if(q.type==='order')h+=q.options.map((o,j)=>'<div>　'+L[j]+'. '+esc(o)+'</div>').join('')+'<div>次序：＿＿ → ＿＿ → ＿＿ → ＿＿'+(q.options.length>4?' → ＿＿':'')+'</div>';
  else if(q.type==='bank')h+='<div class="wbank">'+q.options.map(o=>'<span>'+esc(o)+'</span>').join('')+'</div>'+q.items.map((it,j)=>'<div>'+(j+1)+'. '+esc(it)+'</div>').join('');
  else if(q.type==='classify')h+=q.items.map((it,j)=>'<div>　'+L[j]+'. '+esc(it)+'</div>').join('')+q.options.map((o,j)=>'<div>'+(j+1)+'. '+esc(o)+'：＿＿＿＿＿＿</div>').join('');
  else if(q.type==='blanks')h+=q.items.map((it,j)=>'<div>'+esc(it.replace('____','＿＿＿＿＿＿'))+'</div>').join('');
  else if(q.type==='match')h+='<div style="display:flex;gap:20pt"><div>'+q.items.map((it,j)=>'<div>'+(j+1)+'. '+esc(it)+'　＿＿</div>').join('')+'</div><div>'+q.options.map((o,j)=>'<div>'+L[j]+'. '+esc(o)+'</div>').join('')+'</div></div>';
  else if(q.type==='short')h+='<div class="line"></div><div class="line"></div><div class="line"></div>';
  else h+='<div class="line" style="width:60%"></div>';
  h+='</div>';
 });
 if(PW.key){
  h+='<div class="pkey"><h2>答案及解說</h2>'+PW.list.map((q,i)=>'<div class="pq"><b>'+(i+1)+'.</b> '+answerText(q)+'<div class="muted">'+esc(q.explain)+'</div></div>').join('')+'</div>';
 }
 document.getElementById('pr').innerHTML=h;
}
// ---- events ----
app.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.diff){diffSel=t.dataset.diff;sv('diff',diffSel);home();return}
 if(t.hasAttribute('data-home')){clearInterval(tick);home();return}
 if(t.dataset.go==='print'){printSetup();return}
 if(t.dataset.go){start(t.dataset.go,{});return}
 if(t.dataset.cat){start('category',{cat:t.dataset.cat});return}
 if(t.dataset.sub){start('category',{sub:t.dataset.sub});return}
 if(t.dataset.tut){tutorial(t.dataset.tut);return}
 if(t.dataset.ps){const s=t.dataset.ps;PW.subs=PW.subs.includes(s)?PW.subs.filter(x=>x!==s):PW.subs.concat(s);if(!PW.subs.length)PW.subs=[s];printSetup();return}
 if(t.dataset.pd){PW.diff=t.dataset.pd;printSetup();return}
 if(t.dataset.pn){PW.n=+t.dataset.pn;printSetup();return}
 if(t.id==='pshuf'){buildPrint();return}
 if(t.id==='pgo'){buildPrint();window.print();return}
 if(t.dataset.o!=null&&S&&!S.done){
  const i=+t.dataset.o;
  if(S.q.type==='multi'){S.pick=S.pick.includes(i)?S.pick.filter(x=>x!==i):S.pick.concat(i);t.classList.toggle('sel')}
  else{S.pick=i;app.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel')}
  return;
 }
 if(t.id==='hintBtn'&&S){const q=S.q,box=document.getElementById('hints');
  if(S.hint<q.hints.length){box.insertAdjacentHTML('beforeend','<div class="hint">💡 提示 '+(S.hint+1)+'：'+esc(q.hints[S.hint])+'</div>');S.hint++;t.textContent=S.hint<q.hints.length?'💡 再提示 ('+(q.hints.length-S.hint)+')':'📖 看課題重點'}
  else{box.insertAdjacentHTML('beforeend','<ul class="tut">'+SUBS[q.sub].tut.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');t.disabled=true}
  return}
 if(t.id==='sub'){submit(false);return}
 if(t.id==='next'){next();return}
});
app.addEventListener('change',e=>{if(e.target.id==='pkey'){PW.key=e.target.checked;buildPrint()}if(e.target.id==='pweak')buildPrint()});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'&&e.target.tagName==='INPUT'){e.preventDefault();if(S&&!S.done)submit(false);else if(S)next()}});
window.__gs={QS,norm,checkFill,checkShort,checkOrder,count:QS.length,TEST};
home();
</script></body></html>
